<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>audio files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================
   PAGE
========================================= */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0 80px;
}


/* =========================================
   BACK
========================================= */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* =========================================
   DIRECTORY HEADER
========================================= */

.directory-header {
    margin-top: 48px;
    margin-bottom: 32px;
}

.directory-path {
    display: inline-block;

    color: #d00000;

    border: 1px solid #520000;

    padding: 8px 16px;

    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 24px;
}

.section-title {
    color: #666;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================
   DIRECTORY LIST
========================================= */

.directory-list {
    width: 100%;

    margin-top: 18px;

    border-top: 1px solid #1d1d1d;
}


/* =========================================
   AUDIO ROW
========================================= */

.directory-file {
    display: flex;

    align-items: center;

    min-height: 46px;

    padding: 0 14px;

    border-bottom: 1px solid #161616;

    color: #999;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease,
        background 0.15s ease;
}

.directory-file:hover {
    color: #fff;

    padding-left: 20px;

    background: rgba(120, 0, 0, 0.04);
}


/* =========================================
   FILE SYMBOL
========================================= */

.file-symbol {
    display: inline-block;

    width: 25px;

    color: #777;

    font-size: 10px;

    flex-shrink: 0;
}


/* =========================================
   NUMBER
========================================= */

.number {
    display: inline-block;

    width: 42px;

    color: #d00000;

    flex-shrink: 0;
}


/* =========================================
   FILE NAME
========================================= */

.file-name {
    white-space: nowrap;
}


/* =========================================
   AUDIO OVERLAY
========================================= */

.audio-overlay {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.94);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.audio-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================
   AUDIO WINDOW
========================================= */

.audio-window {
    position: relative;

    width: min(700px, 88vw);

    opacity: 0;

    transform: translateY(10px);

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.audio-overlay.active .audio-window {
    opacity: 1;

    transform: translateY(0);
}


/* =========================================
   CLOSE
========================================= */

.close-audio {
    position: absolute;

    top: -35px;
    right: 0;

    padding: 0;

    border: none;

    background: none;

    color: #666;

    font-family: "Courier New", monospace;

    font-size: 20px;

    cursor: pointer;
}

.close-audio:hover {
    color: #fff;
}


/* =========================================
   LOADING SCREEN
========================================= */

.loading-screen {
    width: 100%;

    padding: 30px 0;

    background: #000;
}

.loading-text {
    color: #666;

    font-size: 11px;

    margin-bottom: 15px;

    letter-spacing: 1px;
}


/* =========================================
   LOADING BAR
========================================= */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #171717;

    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;

    background: #a00000;
}

.loading-percent {
    margin-top: 10px;

    color: #444;

    font-size: 10px;

    text-align: right;
}


/* =========================================
   PLAYER AREA
========================================= */

.player-area {
    display: none;

    width: 100%;

    padding: 28px 0;
}

.now-playing {
    color: #777;

    font-size: 11px;

    margin-bottom: 20px;

    letter-spacing: 1px;
}

.now-playing span {
    color: #b00000;
}


/* =========================================
   AUDIO PLAYER
========================================= */

#audioPlayer {
    width: 100%;

    height: 38px;

    filter:
        grayscale(1)
        brightness(0.65);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .page {
        width: 90%;

        padding-top: 28px;
    }

    .directory-header {
        margin-top: 35px;
    }

    .directory-file {
        font-size: 11px;

        padding-left: 8px;
    }

    .directory-file:hover {
        padding-left: 12px;
    }

    .directory-path {
        font-size: 16px;
    }

    .file-symbol {
        width: 20px;
    }

    .number {
        width: 34px;
    }

    .audio-window {
        width: 88vw;
    }

}

</style>

</head>


<body>


<div class="page">


    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>



    <div class="directory-header">

        <div class="directory-path">
            /audio
        </div>

        <div class="section-title">
            audio files (.mp3)
        </div>

    </div>



    <div class="directory-list">


        <!-- AUDIO 01 -->

        <div
            class="directory-file"
            onclick="openAudio(
                'audio-file-01.mp3',
                'audio-file-01.mp3',
                false
            )"
        >

            <span class="file-symbol">▫</span>

            <span class="number">01</span>

            <span class="file-name">
                audio-file-01.mp3
            </span>

        </div>



        <!-- AUDIO 02 -->

        <div
            class="directory-file"
            onclick="openAudio(
                'audio-file-02.mp3',
                'audio-file-02.mp3',
                true
            )"
        >

            <span class="file-symbol">▫</span>

            <span class="number">02</span>

            <span class="file-name">
                audio-file-02.mp3
            </span>

        </div>


    </div>


</div>



<!-- =========================================
     AUDIO OVERLAY
========================================= -->

<div
    id="audioOverlay"
    class="audio-overlay"
    onclick="backgroundClose(event)"
>


    <div class="audio-window">


        <button
            class="close-audio"
            onclick="closeAudio()"
        >
            ×
        </button>



        <div
            id="loadingScreen"
            class="loading-screen"
        >

            <div
                id="loadingText"
                class="loading-text"
            >
                loading audio...
            </div>


            <div class="loading-bar">

                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>

            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>

        </div>



        <div
            id="playerArea"
            class="player-area"
        >

            <div class="now-playing">

                playing:

                <span id="trackName">
                    unknown
                </span>

            </div>


            <audio
                id="audioPlayer"
                controls
                preload="metadata"
            >

                <source
                    id="audioSource"
                    src=""
                    type="audio/mpeg"
                >

            </audio>

        </div>


    </div>


</div>



<script>

let loadingInterval;
let loadingTimeout;


/* =========================================
   OPEN AUDIO
========================================= */

function openAudio(
    fileName,
    displayName,
    stutterLoader
) {

    const overlay =
        document.getElementById(
            "audioOverlay"
        );

    const player =
        document.getElementById(
            "audioPlayer"
        );

    const source =
        document.getElementById(
            "audioSource"
        );

    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );

    const playerArea =
        document.getElementById(
            "playerArea"
        );

    const progress =
        document.getElementById(
            "loadingProgress"
        );

    const percent =
        document.getElementById(
            "loadingPercent"
        );

    const loadingText =
        document.getElementById(
            "loadingText"
        );

    const trackName =
        document.getElementById(
            "trackName"
        );


    clearInterval(
        loadingInterval
    );

    clearTimeout(
        loadingTimeout
    );

    player.pause();

    source.src =
        fileName;

    player.load();

    trackName.textContent =
        displayName;

    playerArea.style.display =
        "none";

    loadingScreen.style.display =
        "block";

    progress.style.width =
        "0%";

    percent.textContent =
        "0%";

    loadingText.textContent =
        "loading audio...";

    overlay.classList.add(
        "active"
    );


    if (
        stutterLoader === false
    ) {

        runNormalLoader();

    }

    else {

        runStutterLoader();

    }

}


/* =========================================
   UPDATE DISPLAY
========================================= */

function updateLoading(value) {

    const progress =
        document.getElementById(
            "loadingProgress"
        );

    const percent =
        document.getElementById(
            "loadingPercent"
        );

    const loadingText =
        document.getElementById(
            "loadingText"
        );


    progress.style.width =
        value + "%";

    percent.textContent =
        Math.floor(value) + "%";


    if (
        value < 30
    ) {

        loadingText.textContent =
            "loading audio...";

    }

    else if (
        value < 65
    ) {

        loadingText.textContent =
            "reading file...";

    }

    else if (
        value < 90
    ) {

        loadingText.textContent =
            "buffering...";

    }

    else {

        loadingText.textContent =
            "file ready...";

    }

}


/* =========================================
   AUDIO 01 NORMAL
========================================= */

function runNormalLoader() {

    let value = 0;


    loadingInterval =

        setInterval(function() {

            value++;

            updateLoading(
                value
            );


            if (
                value >= 100
            ) {

                clearInterval(
                    loadingInterval
                );

                showAudio();

            }

        }, 30);

}


/* =========================================
   AUDIO 02 — STALLS ONLY
========================================= */

function runStutterLoader() {

    let value = 0;


    function nextStep() {


        if (
            value >= 100
        ) {

            updateLoading(
                100
            );

            showAudio();

            return;

        }


        /* SMALL STALL */

        if (
            value === 18
        ) {

            updateLoading(
                value
            );

            loadingTimeout =
                setTimeout(function() {

                    value++;

                    nextStep();

                }, 300);

            return;

        }


        /* SECOND STALL */

        if (
            value === 36
        ) {

            updateLoading(
                value
            );

            loadingTimeout =
                setTimeout(function() {

                    value++;

                    nextStep();

                }, 600);

            return;

        }


        /* MID STALL */

        if (
            value === 54
        ) {

            updateLoading(
                value
            );

            loadingTimeout =
                setTimeout(function() {

                    value++;

                    nextStep();

                }, 450);

            return;

        }


        /* BIGGER STALL */

        if (
            value === 72
        ) {

            updateLoading(
                value
            );

            loadingTimeout =
                setTimeout(function() {

                    value++;

                    nextStep();

                }, 850);

            return;

        }


        /* LONG BUFFER STALL */

        if (
            value === 86
        ) {

            updateLoading(
                value
            );

            const loadingText =
                document.getElementById(
                    "loadingText"
                );

            loadingText.textContent =
                "buffering...";


            loadingTimeout =
                setTimeout(function() {

                    value++;

                    nextStep();

                }, 1500);

            return;

        }


        /* LAST SHORT STALL */

        if (
            value === 95
        ) {

            updateLoading(
                value
            );

            loadingTimeout =
                setTimeout(function() {

                    value++;

                    nextStep();

                }, 550);

            return;

        }


        value++;

        updateLoading(
            value
        );


        const randomDelay =
            20 +
            Math.floor(
                Math.random() * 45
            );


        loadingTimeout =
            setTimeout(
                nextStep,
                randomDelay
            );

    }


    nextStep();

}


/* =========================================
   SHOW AUDIO
========================================= */

function showAudio() {

    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );

    const playerArea =
        document.getElementById(
            "playerArea"
        );

    const player =
        document.getElementById(
            "audioPlayer"
        );


    setTimeout(function() {

        loadingScreen.style.display =
            "none";

        playerArea.style.display =
            "block";

        player.play();

    }, 150);

}


/* =========================================
   CLOSE AUDIO
========================================= */

function closeAudio() {

    const overlay =
        document.getElementById(
            "audioOverlay"
        );

    const player =
        document.getElementById(
            "audioPlayer"
        );


    clearInterval(
        loadingInterval
    );

    clearTimeout(
        loadingTimeout
    );

    player.pause();

    overlay.classList.remove(
        "active"
    );

}


/* =========================================
   BACKGROUND CLOSE
========================================= */

function backgroundClose(event) {

    if (
        event.target.id ===
        "audioOverlay"
    ) {

        closeAudio();

    }

}


/* =========================================
   ESC CLOSE
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeAudio();

        }

    }
);

</script>


</body>

</html>
