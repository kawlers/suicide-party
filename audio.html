<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>audio files</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #aaa;
    font-family: "Courier New", monospace;
}

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 35px 0 70px;
}


/* BACK */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* HEADER */

.header {
    text-align: center;
    margin-top: 5px;
}

.title {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 2px;
}


/* LINE */

.line {
    height: 1px;
    background: #292929;
    margin: 18px 0 45px;
}


/* AUDIO LIST */

.audio-list {
    width: 540px;
    max-width: 100%;
}


/* AUDIO BOX */

.audio-entry {
    position: relative;

    border: 1px solid #252525;

    background: #030303;

    margin-bottom: 15px;

    padding: 14px 16px 16px;

    transition: 0.2s ease;
}

.audio-entry:hover {
    border-color: #3a3a3a;
    background: #050505;
}


/* FILE INFORMATION */

.file-top {
    display: flex;
    align-items: center;

    margin-bottom: 15px;
}

.filename {
    display: flex;
    align-items: center;
    gap: 18px;

    color: #aaa;
    font-size: 12px;
}

.number {
    color: #b00000;
}


/* PLAYER */

.player {
    display: flex;
    align-items: center;
    gap: 14px;
}


/* PLAY BUTTON */

.play {
    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #333;

    background: #050505;

    color: #888;

    font-family: "Courier New", monospace;
    font-size: 10px;

    cursor: pointer;

    transition: 0.15s;
}

.play:hover {
    color: #fff;
    border-color: #666;
}


/* CENTER PLAYER */

.player-center {
    flex: 1;
}


/* WAVEFORM */

.waveform {
    height: 18px;

    display: flex;
    align-items: center;
    gap: 3px;

    margin-bottom: 7px;

    overflow: hidden;

    opacity: 0.45;
}

.waveform span {
    display: block;

    width: 2px;

    background: #666;
}

.waveform span:nth-child(1)  { height: 4px; }
.waveform span:nth-child(2)  { height: 9px; }
.waveform span:nth-child(3)  { height: 14px; }
.waveform span:nth-child(4)  { height: 7px; }
.waveform span:nth-child(5)  { height: 17px; }
.waveform span:nth-child(6)  { height: 11px; }
.waveform span:nth-child(7)  { height: 5px; }
.waveform span:nth-child(8)  { height: 13px; }
.waveform span:nth-child(9)  { height: 8px; }
.waveform span:nth-child(10) { height: 16px; }
.waveform span:nth-child(11) { height: 6px; }
.waveform span:nth-child(12) { height: 11px; }
.waveform span:nth-child(13) { height: 15px; }
.waveform span:nth-child(14) { height: 5px; }
.waveform span:nth-child(15) { height: 9px; }
.waveform span:nth-child(16) { height: 17px; }
.waveform span:nth-child(17) { height: 7px; }
.waveform span:nth-child(18) { height: 12px; }
.waveform span:nth-child(19) { height: 4px; }
.waveform span:nth-child(20) { height: 14px; }
.waveform span:nth-child(21) { height: 8px; }
.waveform span:nth-child(22) { height: 16px; }
.waveform span:nth-child(23) { height: 10px; }
.waveform span:nth-child(24) { height: 5px; }


/* WAVEFORM ANIMATION */

.audio-entry.playing .waveform {
    opacity: 0.8;
}

.audio-entry.playing .waveform span {
    background: #8b0000;
    animation: signal 0.6s infinite alternate;
}

.audio-entry.playing .waveform span:nth-child(2n) {
    animation-delay: 0.15s;
}

.audio-entry.playing .waveform span:nth-child(3n) {
    animation-delay: 0.3s;
}

@keyframes signal {

    from {
        transform: scaleY(0.6);
    }

    to {
        transform: scaleY(1);
    }

}


/* PROGRESS */

.progress {
    width: 100%;
    height: 3px;

    background: #1c1c1c;

    cursor: pointer;

    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: #9d0000;

    pointer-events: none;
}


/* TIME */

.time {
    width: 85px;

    color: #555;

    font-size: 9px;

    text-align: right;

    white-space: nowrap;
}


/* HIDDEN AUDIO */

audio {
    display: none;
}


/* FOOTER */

.footer {
    margin-top: 80px;

    color: #444;

    font-size: 11px;
    line-height: 1.8;

    white-space: pre-line;
}


/* MOBILE */

@media (max-width: 700px) {

    .page {
        width: 90%;
    }

    .audio-list {
        width: 100%;
    }

    .time {
        width: 70px;
        font-size: 8px;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- BACK -->

    <a class="back" href="index.html">
        ← back
    </a>


    <!-- HEADER -->

    <div class="header">

        <div class="title">
            audio files
        </div>

    </div>


    <div class="line"></div>



    <div class="audio-list">


        <!-- AUDIO 01 -->

        <div class="audio-entry" id="entry01">


            <div class="file-top">

                <div class="filename">

                    <span class="number">01</span>

                    <span>file_01.mp3</span>

                </div>

            </div>


            <div class="player">


                <button
                    class="play"
                    onclick="toggleAudio('audio01', this, 'entry01')"
                >
                    ▶
                </button>


                <div class="player-center">


                    <div class="waveform">

                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>

                    </div>


                    <div
                        class="progress"
                        onclick="seekAudio(event, 'audio01', this)"
                    >

                        <div
                            class="progress-fill"
                            id="progress01"
                        ></div>

                    </div>


                </div>


                <span class="time" id="time01">
                    00:00 / 00:00
                </span>


            </div>


            <audio
                id="audio01"
                data-progress="progress01"
                data-time="time01"
                data-entry="entry01"
            >

                <source
                    src="file_01.mp3"
                    type="audio/mpeg"
                >

            </audio>


        </div>



        <!-- AUDIO 02 -->

        <div class="audio-entry" id="entry02">


            <div class="file-top">

                <div class="filename">

                    <span class="number">02</span>

                    <span>file_02.mp3</span>

                </div>

            </div>


            <div class="player">


                <button
                    class="play"
                    onclick="toggleAudio('audio02', this, 'entry02')"
                >
                    ▶
                </button>


                <div class="player-center">


                    <div class="waveform">

                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>

                    </div>


                    <div
                        class="progress"
                        onclick="seekAudio(event, 'audio02', this)"
                    >

                        <div
                            class="progress-fill"
                            id="progress02"
                        ></div>

                    </div>


                </div>


                <span class="time" id="time02">
                    00:00 / 00:00
                </span>


            </div>


            <audio
                id="audio02"
                data-progress="progress02"
                data-time="time02"
                data-entry="entry02"
            >

                <source
                    src="file_02.mp3"
                    type="audio/mpeg"
                >

            </audio>


        </div>


    </div>



    <!-- FOOTER -->

    <div class="footer">your connection has been logged.
session ID: [unbound]
unknown client</div>


</div>



<script>


function toggleAudio(audioId, button, entryId) {

    const selectedAudio =
        document.getElementById(audioId);

    const selectedEntry =
        document.getElementById(entryId);


    /* STOP OTHER AUDIO */

    document.querySelectorAll("audio").forEach(function(audio) {

        if (audio !== selectedAudio) {

            audio.pause();

            const entry =
                document.getElementById(audio.dataset.entry);

            const otherButton =
                entry.querySelector(".play");


            entry.classList.remove("playing");

            otherButton.textContent = "▶";

        }

    });


    /* PLAY */

    if (selectedAudio.paused) {

        selectedAudio.play();

        button.textContent = "Ⅱ";

        selectedEntry.classList.add("playing");

    }


    /* PAUSE */

    else {

        selectedAudio.pause();

        button.textContent = "▶";

        selectedEntry.classList.remove("playing");

    }

}



/* PROGRESS */

document.querySelectorAll("audio").forEach(function(audio) {

    audio.addEventListener("timeupdate", function() {

        const progress =
            document.getElementById(audio.dataset.progress);

        const time =
            document.getElementById(audio.dataset.time);


        if (!audio.duration) {
            return;
        }


        const percent =
            (audio.currentTime / audio.duration) * 100;


        progress.style.width =
            percent + "%";


        time.textContent =
            formatTime(audio.currentTime)
            +
            " / "
            +
            formatTime(audio.duration);

    });


    audio.addEventListener("loadedmetadata", function() {

        const time =
            document.getElementById(audio.dataset.time);

        time.textContent =
            "00:00 / "
            +
            formatTime(audio.duration);

    });


    audio.addEventListener("ended", function() {

        const entry =
            document.getElementById(audio.dataset.entry);

        const button =
            entry.querySelector(".play");


        entry.classList.remove("playing");

        button.textContent = "▶";

    });

});



/* SEEK */

function seekAudio(event, audioId, progressBar) {

    const audio =
        document.getElementById(audioId);


    if (!audio.duration) {
        return;
    }


    const rect =
        progressBar.getBoundingClientRect();


    let percent =
        (event.clientX - rect.left)
        /
        rect.width;


    percent =
        Math.max(0, Math.min(1, percent));


    audio.currentTime =
        percent * audio.duration;

}



/* TIME */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "00:00";
    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60);


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );

}


</script>


</body>

</html>
