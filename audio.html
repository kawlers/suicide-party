<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>audio files</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 35px 0 70px;
}

.back {
    color: #aaa;
    text-decoration: none;
    font-size: 12px;
}

.header {
    text-align: center;
    margin-top: -10px;
}

.logo {
    width: 220px;
    max-width: 60vw;
}

.title {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: -8px;
}

.line {
    height: 1px;
    background: #333;
    margin: 18px 0 45px;
}

.audio-entry {
    margin-bottom: 50px;
}

.filename {
    display: flex;
    gap: 26px;
    align-items: center;
    margin-bottom: 18px;
    font-size: 13px;
}

.number {
    color: #d00000;
}

    .player {
    width: 400px;
    max-width: 100%;
    height: 50px;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
}


.play {
    font-size: 18px;
}

.progress {
    flex: 1;
    height: 1px;
    background: #555;
}

.time {
    color: #aaa;
    font-size: 11px;
}

.footer {
    text-align: center;
    margin-top: 85px;
    color: #555;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="page">

    <a class="back" href="index.html">← back</a>

    <div class="header">
        <img
            class="logo"
            src="suicide-party-logo.png"
            alt="suicide party"
        >

        <div class="title">audio files</div>
    </div>

    <div class="line"></div>

    <div class="audio-entry">

        <div class="filename">
            <span class="number">01</span>
            <span>file_01.mp3</span>
        </div>

        <div class="player">
            <span class="play">▶</span>
            <div class="progress"></div>
            <span class="time">00:00 / 00:00</span>
        </div>

    </div>

    <div class="audio-entry">

        <div class="filename">
            <span class="number">02</span>
            <span>file_02.mp3</span>
        </div>

        <div class="player">
            <span class="play">▶</span>
            <div class="progress"></div>
            <span class="time">00:00 / 00:00</span>
        </div>

    </div>

    <div class="footer">
        just end it then.
    </div>

</div>

</body>
</html>
