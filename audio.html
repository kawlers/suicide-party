<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio files / suicide party</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: min(700px, 90%);
            margin: auto;
            padding: 40px 0 80px;
        }

        .back {
            color: #555;
            text-decoration: none;
            font-size: 11px;
        }

        .back:hover {
            color: #fff;
        }

        h1 {
            margin-top: 50px;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .line {
            height: 1px;
            background: #333;
            margin: 30px 0;
        }

        .file {
            padding: 25px 0;
            border-bottom: 1px solid #222;
        }

        .name {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .meta {
            color: #555;
            font-size: 10px;
            margin-bottom: 15px;
        }

        .audio-box {
            height: 45px;
            border: 1px solid #222;
            background: #080808;

            display: flex;
            align-items: center;

            padding: 0 15px;

            color: #333;
            font-size: 10px;
        }

        .note {
            margin-top: 60px;
            color: #333;
            font-size: 10px;
        }
    </style>
</head>

<body>

<div class="page">

    <a class="back" href="index.html">← back</a>

    <h1>audio files</h1>

    <div class="line"></div>


    <!-- FILE 01 -->

    <div class="file">

        <div class="name">
            SP_001
        </div>

        <div class="meta">
            AUDIO FILE
        </div>

        <div class="audio-box">
            AUDIO PLAYER
        </div>

    </div>


    <!-- FILE 02 -->

    <div class="file">

        <div class="name">
            SP_002
        </div>

        <div class="meta">
            AUDIO FILE
        </div>

        <div class="audio-box">
            AUDIO PLAYER
        </div>

    </div>


    <div class="note">
        2 files
    </div>

</div>

</body>
</html>
