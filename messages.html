<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sweet-dreams-(IM)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent;color:#d5d5d5;font-family:"Courier New",monospace}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.back{position:fixed;top:18px;left:20px;color:#8d1d1d;text-decoration:none;font-size:12px;letter-spacing:.6px}.back:hover{color:#d23c3c}
.im-window{width:min(480px,88vw);height:min(720px,88vh);display:flex;flex-direction:column;background:linear-gradient(#171717,#0f0f0f);border:2px solid #4b4b4b;box-shadow:0 0 0 1px #111,0 0 0 3px #222,0 18px 55px rgba(0,0,0,.9);transform:scale(.66);transform-origin:center center;filter:contrast(1.08) saturate(.92)}
.titlebar{height:34px;display:flex;align-items:center;background:linear-gradient(90deg,#0c0202,#300606 55%,#140202);border-bottom:1px solid #484848}.title-icon{width:38px;text-align:center;color:#dc2e2e;font-size:11px}.title-text{flex:1;color:#e23a3a;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:.4px 0 rgba(255,65,65,.30),-.4px 0 rgba(30,0,0,.5)}.window-buttons{display:flex;gap:4px;padding-right:7px}.winbtn.close-im{cursor:pointer}.winbtn.close-im:hover{color:#ff4b4b;border-color:#7d2a2a}.winbtn{width:25px;height:22px;border:1px solid #555;background:linear-gradient(#252525,#080808);color:#bb2d2d;display:grid;place-items:center;font-family:Arial;font-size:14px;box-shadow:inset 1px 1px #444,inset -1px -1px #000}
.menu{height:30px;display:flex;align-items:center;gap:24px;padding:0 16px;background:linear-gradient(#202020,#151515);border-bottom:1px solid #333;color:#bcbcbc;font-family:Arial,sans-serif;font-size:17px}
.chat-shell{flex:1;min-height:0;margin:6px 7px 4px;border:1px solid #591717;box-shadow:inset 0 0 0 1px #1d1d1d,0 0 0 .5px rgba(112,20,20,.35);background:#000}.chat-log{height:100%;overflow-y:auto;padding:15px 17px 21px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#551111 #161616}.chat-log::-webkit-scrollbar{width:18px}.chat-log::-webkit-scrollbar-track{background:#171717;border-left:1px solid #333}.chat-log::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#250606,#551111);border:1px solid #9b2828}
.time{color:#6a6a6a;text-align:center;font-size:9px;letter-spacing:1.1px;margin:0 0 14px}.system-message{color:#707070;text-align:center;font-size:11px;font-style:italic;letter-spacing:.25px;margin:14px 0}.message{margin:0 0 11px;font-size:clamp(15px,1.67vw,18.4px);line-height:1.4;word-break:break-word}.username{color:#c93434;font-weight:bold;text-shadow:.35px 0 rgba(255,70,70,.34),-.35px 0 rgba(60,0,0,.38)}.message-text{color:#d1d1d1;font-weight:bold;text-shadow:.28px 0 rgba(255,255,255,.18),-.28px 0 rgba(0,0,0,.55)}.typing-cursor{display:inline-block;width:1px;height:1em;background:#bdbdbd;margin-left:2px;vertical-align:-2px;animation:blink .65s steps(1) infinite}
.input-shell{height:64px;margin:0 7px 4px;padding:6px;display:flex;gap:9px;border:1px solid #3c3c3c;background:linear-gradient(#141414,#0d0d0d)}.fake-input{flex:1;position:relative;background:#020202;border:1px solid #555;padding:7px;color:#d1d1d1;font-size:17.25px;line-height:1.4;overflow:hidden;white-space:pre-wrap;word-break:break-word}.input-text{display:inline}.caret{display:inline-block;width:1px;height:1em;background:#aaa;margin-left:2px;vertical-align:-2px;animation:blink .85s steps(1) infinite}@keyframes blink{50%{opacity:0}}.send{width:102px;border:1px solid #642020;background:linear-gradient(#2d0808,#160303);color:#d84141;display:grid;place-items:center;font-size:15px;box-shadow:inset 1px 1px #592020,inset -1px -1px #000}.send.sending{background:linear-gradient(#4a0d0d,#220404);color:#ff5a5a}
.bottom{height:62px;display:flex;align-items:center;padding:3px 28px;background:linear-gradient(#171717,#101010);border-top:1px solid #333}.tool{flex:1;text-align:center;color:#bbb;font-family:Arial,sans-serif;font-size:9px}.tool.exit-tool{cursor:pointer}.tool.exit-tool:hover{color:#fff}.tool.exit-tool:hover .icon{color:#e33}.icon{color:#ad2929;font-size:17px;margin-bottom:3px}
@media(max-width:650px){body{padding:12px}.back{display:none}.im-window{width:min(360px,94vw);height:min(540px,92vh);transform:scale(.66)}.title-text{font-size:13px}.title-icon{width:38px}.winbtn{width:27px;height:27px;font-size:15px}.menu{gap:18px;padding-left:12px;font-size:12px}.chat-log{padding:14px 12px 22px}.message{font-size:13.8px;margin-bottom:12px}.input-shell{height:70px}.send{width:82px;font-size:13px}.bottom{height:67px;padding:2px 3px}.tool{font-size:9px}.icon{font-size:18px}}
</style>
</head>
<body>
<div class="im-window">
  <div class="titlebar">
    <div class="title-icon">●</div>
    <div class="title-text">cry_nowdiel8r - Instant Message</div>
    <div class="window-buttons"><div class="winbtn">−</div><div class="winbtn">□</div><div class="winbtn close-im" id="closeIM">×</div></div>
  </div>
  <div class="menu"><span>File</span><span>Edit</span><span>Insert</span><span>People</span></div>
  <div class="chat-shell"><div id="chatLog" class="chat-log"></div></div>
  <div class="input-shell"><div class="fake-input"><span id="inputText" class="input-text"></span><span class="caret"></span></div><div id="sendButton" class="send">send</div></div>
  <div class="bottom">
    <div class="tool"><div class="icon">⊘</div>Block</div>
    <div class="tool"><div class="icon">♟+</div>Add Friend</div>
    <div class="tool"><div class="icon">▣</div>Video Chat</div>
    <div class="tool exit-tool" id="exitIM"><div class="icon">×</div>Exit</div>
  </div>
</div>
<script>
function requestClose(){
  if(window.parent && window.parent !== window){
    window.parent.postMessage({type:'closeMessages'}, '*');
  }else{
    window.location.href='archive.html';
  }
}

document.getElementById('closeIM').addEventListener('click', requestClose);
document.getElementById('exitIM').addEventListener('click', requestClose);

const conversation = [
["cry_nowdiel8r","u home"],
["im_ok_itsnotmyblood","yea"],
["cry_nowdiel8r","u good?"],
["im_ok_itsnotmyblood","no"],
["cry_nowdiel8r","whats wrong"],
["im_ok_itsnotmyblood","u know whats wrong"],
["cry_nowdiel8r","everything still worked out"],
["im_ok_itsnotmyblood","thats not the point"],
["cry_nowdiel8r","then what is"],
["im_ok_itsnotmyblood","u weren't listening to me"],
["cry_nowdiel8r","i was"],
["im_ok_itsnotmyblood","no u werent"],
["cry_nowdiel8r","alright damn"],
["im_ok_itsnotmyblood","im actually mad"],
["cry_nowdiel8r","ok"],
{draft:"u almost got us caught dipshit", final:"u almost fucked this up", pauseAfter:5000}, // types draft, erases it, sends final, then waits 5 seconds
["cry_nowdiel8r","were good ur being a dick overreacting"],
["im_ok_itsnotmyblood","whatever"],
["im_ok_itsnotmyblood","go to sleep"],
["cry_nowdiel8r","goodnight asshole"],
["im_ok_itsnotmyblood","fuck u"]
];
const chatLog=document.getElementById('chatLog');
const inputText=document.getElementById('inputText');
const sendButton=document.getElementById('sendButton');
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function charDelay(ch){
  if(ch===' ') return 28 + Math.random()*28;
  if(ch===',' || ch==='.' || ch==='?' || ch==='!') return 130 + Math.random()*120;
  return 48 + Math.random()*52;
}

function appendMessage(username,text){
  const e=document.createElement('div');
  e.className='message';

  const n=document.createElement('span');
  n.className='username';
  n.textContent=username+': ';

  const x=document.createElement('span');
  x.className='message-text';
  x.textContent=text;

  e.append(n,x);
  chatLog.appendChild(e);
  chatLog.scrollTop=chatLog.scrollHeight;
}

/* Soft incoming-message tone for cry_nowdiel8r. Uses Web Audio, so no audio file is needed. */
let audioCtx = null;
function playIncomingTone(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(660, now + 0.11);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.19);
  } catch(e) {}
}

/* Incoming messages appear in the transcript as received. */
async function receiveMessage(username,text){
  if(username === 'cry_nowdiel8r') playIncomingTone();
  appendMessage(username,text);
}

/* Your messages are typed into the message box first, then sent. */
async function typeAndSend(username,text){
  inputText.textContent='';

  for(const ch of text){
    inputText.textContent+=ch;
    await wait(charDelay(ch));
  }

  await wait(280 + Math.random()*420);
  sendButton.classList.add('sending');
  await wait(120);

  appendMessage(username,text);
  inputText.textContent='';

  await wait(90);
  sendButton.classList.remove('sending');
}

function betweenMessageDelay(){
  const roll=Math.random();
  if(roll < 0.12) return 3000 + Math.random()*2800;
  if(roll < 0.38) return 1800 + Math.random()*1800;
  return 900 + Math.random()*1500;
}

function addSystemMessage(text){
  const el=document.createElement('div');
  el.className='system-message';
  el.textContent=text;
  chatLog.appendChild(el);
  chatLog.scrollTop=chatLog.scrollHeight;
}

async function finishConversation(){
  await wait(4000);
  addSystemMessage('cry_nowdiel8r has signed off.');

  await wait(4000);
  addSystemMessage('im_ok_itsnotmyblood has signed off.');

  /* Leave the signed-off conversation visible until the window X is clicked. */
  return;
}

async function play(){
  for(let i=0;i<conversation.length;i++){
    const item=conversation[i];

    if(item.pause){
      await wait(item.pause * (1.35 + Math.random()*0.45));
      continue;
    }


    if(item.draft){
      inputText.textContent='';
      for(const ch of item.draft){
        inputText.textContent+=ch;
        await wait(charDelay(ch));
      }

      await wait(650);
      while(inputText.textContent.length){
        inputText.textContent=inputText.textContent.slice(0,-1);
        await wait(28 + Math.random()*24);
      }

      await wait(450);
      await typeAndSend('im_ok_itsnotmyblood',item.final);
      await wait(item.pauseAfter || 0);
      continue;
    }

    const username=item[0];
    const text=item[1];

    if(username==='im_ok_itsnotmyblood'){
      await typeAndSend(username,text);
    }else{
      await receiveMessage(username,text);
    }

    if(i===conversation.length-1){
      await finishConversation();
      return;
    }

    await wait(betweenMessageDelay());
  }
}

let conversationStarted=false;
function startConversationAfterPop(){
  if(conversationStarted) return;
  conversationStarted=true;
  setTimeout(play,4000);
}
window.addEventListener('message',function(event){
  if(event.data && event.data.type==='startConversation') startConversationAfterPop();
});
if(window.parent===window){
  window.addEventListener('load',function(){ setTimeout(startConversationAfterPop,750); });
}
</script>
</body>
