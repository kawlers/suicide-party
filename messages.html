<script>

const chatLog=document.getElementById('chatLog');
const inputText=document.getElementById('inputText');
const sendButton=document.getElementById('sendButton');
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function charDelay(ch){
  if(ch===' ') return 28 + Math.random()*28;
  if(ch===',' || ch==='.' || ch==='?' || ch==='!') return 130 + Math.random()*120;
  return 48 + Math.random()*52;
}

function appendMessage(username,text){
  const e=document.createElement('div');
  e.className='message';

  const n=document.createElement('span');
  n.className='username';
  n.textContent=username+': ';

  const x=document.createElement('span');
  x.className='message-text';
  x.textContent=text;

  e.append(n,x);
  chatLog.appendChild(e);
  chatLog.scrollTop=chatLog.scrollHeight;
}

/* Soft incoming-message tone for cry_nowdiel8r. Uses Web Audio, so no audio file is needed. */
let audioCtx = null;
function playIncomingTone(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(660, now + 0.11);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.19);
  } catch(e) {}
}

/* Incoming messages appear in the transcript as received. */
async function receiveMessage(username,text){
  if(username === 'cry_nowdiel8r') playIncomingTone();
  appendMessage(username,text);
}

/* Your messages are typed into the message box first, then sent. */
async function typeAndSend(username,text){
  inputText.textContent='';

  for(const ch of text){
    inputText.textContent+=ch;
    await wait(charDelay(ch));
  }

  await wait(280 + Math.random()*420);
  sendButton.classList.add('sending');
  await wait(120);

  appendMessage(username,text);
  inputText.textContent='';

  await wait(90);
  sendButton.classList.remove('sending');
}

function betweenMessageDelay(){
  const roll=Math.random();
  if(roll < 0.12) return 3000 + Math.random()*2800;
  if(roll < 0.38) return 1800 + Math.random()*1800;
  return 900 + Math.random()*1500;
}

function addSystemMessage(text){
  const el=document.createElement('div');
  el.className='system-message';
  el.textContent=text;
  chatLog.appendChild(el);
  chatLog.scrollTop=chatLog.scrollHeight;
}

async function finishConversation(){
  await wait(4300 + Math.random()*1200);
  addSystemMessage('cry_nowdiel8r has signed off.');

  await wait(5200 + Math.random()*1500);
  addSystemMessage('im_ok_itsnotmyblood has signed off.');

  /* Close the archive pop-out 10 seconds after both users are signed off. */
  await wait(10000);

  if(window.parent && window.parent !== window){
    window.parent.postMessage({type:'closeMessages'}, '*');
  }else{
    window.close();
  }
}

async function play(){
  await wait(1400);

  for(let i=0;i<conversation.length;i++){
    const item=conversation[i];

    if(item.pause){
      await wait(item.pause * (1.35 + Math.random()*0.45));
      continue;
    }


    const username=item[0];
    const text=item[1];

    if(username==='im_ok_itsnotmyblood'){
      await typeAndSend(username,text);
    }else{
      await receiveMessage(username,text);
    }

    if(i===conversation.length-1){
      await finishConversation();
      return;
    }

    await wait(betweenMessageDelay());
  }
}

window.addEventListener('load',play);
</script>
