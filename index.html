<style>

/* ENCRYPTED ROUTE EFFECT */

#encryptedRoute {
    transition: opacity 0.08s;
}

#encryptedRoute.changing {
    opacity: 0.25;
}

</style>


<script>


/* CURRENT REAL DATE + TIME */

function updateDateTime() {

    const now = new Date();


    /* DATE */

    const month =
        String(now.getMonth() + 1).padStart(2, "0");

    const day =
        String(now.getDate()).padStart(2, "0");

    const year =
        now.getFullYear();


    document.getElementById("currentDate").textContent =
        month + "." + day + "." + year;


    /* TIME */

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const seconds =
        String(now.getSeconds()).padStart(2, "0");


    document.getElementById("currentTime").textContent =
        hours + ":" + minutes + ":" + seconds;

}



/* CREATE FAKE ENCRYPTED ROUTE */

function generateEncryptedRoute() {

    const characters =
        "0123456789ABCDEF";

    let part1 = "";
    let part2 = "";
    let part3 = "";


    for (let i = 0; i < 4; i++) {

        part1 +=
            characters[
                Math.floor(
                    Math.random() * characters.length
                )
            ];

        part2 +=
            characters[
                Math.floor(
                    Math.random() * characters.length
                )
            ];

        part3 +=
            characters[
                Math.floor(
                    Math.random() * characters.length
                )
            ];

    }


    return (
        "ENC::"
        + part1
        + "-"
        + part2
        + "-"
        + part3
    );

}



/* UPDATE ENCRYPTED ROUTE */

function updateEncryptedRoute() {

    const route =
        document.getElementById("encryptedRoute");


    route.classList.add("changing");


    setTimeout(function() {

        route.textContent =
            generateEncryptedRoute();

        route.classList.remove("changing");

    }, 80);

}



/* START IMMEDIATELY */

updateDateTime();
updateEncryptedRoute();



/* UPDATE CLOCK EVERY SECOND */

setInterval(function() {

    updateDateTime();

}, 1000);



/* CHANGE ENCRYPTED ROUTE */

setInterval(function() {

    updateEncryptedRoute();

}, 650);


</script>
