<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicide party</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    min-height: 100%;
}

body {
    font-family: "Courier New", monospace;
}

.home {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}


/* BIG HOME LOGO */

.logo {
    width: 700px;
    max-width: 92vw;
    height: auto;

    display: block;

    margin-bottom: 45px;
}


/* MENU */

.nav {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 25px;
}

.nav a {
    color: #ddd;

    text-decoration: none;

    font-size: 18px;
    letter-spacing: 3px;

    position: relative;

    padding-bottom: 8px;
}

.nav a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 110px;
    height: 1px;

    background: #850000;
}

.nav a:hover {
    color: #fff;
}


/* BOTTOM TEXT */

.tagline {
    margin-top: 65px;

    color: #555;

    font-size: 13px;
    letter-spacing: 1px;
}


/* PHONE */

@media (max-width: 600px) {

    .home {
        padding: 20px;
    }

    .logo {
        width: 500px;
        max-width: 95vw;

        margin-bottom: 35px;
    }

    .nav a {
        font-size: 16px;
    }

}

</style>
</head>


<body>

<div class="home">

    <img
        class="logo"
        src="suicide-party-logo.png"
        alt="suicide party"
    >

    <div class="nav">

        <a href="archive.html">
            archive
        </a>

        <a href="audio.html">
            audio files
        </a>

        <a href="photos.html">
            photos
        </a>

    </div>


    <div class="tagline">
        just end it then.
    </div>

</div>

</body>
</html>
