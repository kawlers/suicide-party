<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicide party</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* HOME */

.home {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}


/* LOGO */

.logo {
    width: 650px;
    max-width: 90vw;
    height: auto;

    display: block;

    margin-bottom: 55px;
}


/* NAVIGATION */

.nav {
    display: flex;
    flex-direction: column;

    gap: 28px;

    align-items: center;
}

.nav a {
    color: #ddd;

    text-decoration: none;

    font-size: 18px;
    letter-spacing: 3px;

    position: relative;

    padding-bottom: 8px;
}

.nav a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 110px;
    height: 1px;

    background: #7d0000;
}

.nav a:hover {
    color: #fff;
}


/* FOOTER */

.tagline {
    margin-top: 65px;

    color: #555;

    font-size: 11px;

    line-height: 1.8;

    letter-spacing: 0.5px;
}


/* MOBILE */

@media (max-width: 600px) {

    .home {
        padding: 20px;
    }

    .logo {
        width: 450px;
        max-width: 95vw;

        margin-bottom: 45px;
    }

    .nav a {
        font-size: 16px;
    }

}

</style>

</head>


<body>


<div class="home">


    <img
        class="logo"
        src="suicide-party-logo.png"
        alt="suicide party"
    >


    <div class="nav">

        <a href="archive.html">
            files
        </a>

        <a href="audio.html">
            audio files
        </a>

    </div>


    <div class="tagline">

        <div>
            your connection has been logged.
        </div>

        <div>
            session ID: [unbound]
        </div>

        <div>
            route: <span id="route">192.168.---.---</span>
        </div>

        <div>
            time: <span id="time">--:--:--</span>
        </div>

        <div>
            unknown client
        </div>

    </div>


</div>


<script>


/* REAL CURRENT TIME */

function updateClock() {

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const seconds =
        String(now.getSeconds()).padStart(2, "0");

    document.getElementById("time").textContent =
        hours + ":" + minutes + ":" + seconds;

}


/* GENERATE FAKE IP */

function updateRoute() {

    const part1 =
        Math.floor(Math.random() * 256);

    const part2 =
        Math.floor(Math.random() * 256);

    const part3 =
        Math.floor(Math.random() * 256);

    const part4 =
        Math.floor(Math.random() * 256);


    document.getElementById("route").textContent =
        part1
        + "."
        + part2
        + "."
        + part3
        + "."
        + part4;

}


/* START */

updateClock();
updateRoute();


/* CLOCK UPDATES EVERY SECOND */

setInterval(updateClock, 1000);


/* FAKE IP CHANGES RAPIDLY */

setInterval(updateRoute, 350);


</script>


</body>

</html>
