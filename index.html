<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicide party</title>


<!-- =========================================
     WEB FONT
========================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================
   HOME
========================================= */

.home {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    overflow: hidden;
}


/* =========================================
   LOGO
========================================= */

.logo {
    width: 800px;
    max-width: 92vw;
    height: auto;

    display: block;

    margin-bottom: 0;
}


/* =========================================
   TEXT AREA
========================================= */

.text-area {
    display: flex;
    flex-direction: column;
    align-items: center;

    transform: translateY(-250px);
}


/* =========================================
   NAVIGATION
========================================= */

.nav {
    display: flex;
    flex-direction: column;

    gap: 12px;

    align-items: center;
}

.nav a {
    color: #ddd;

    text-decoration: none;

    font-size: 18px;
    letter-spacing: 3px;

    position: relative;

    padding-bottom: 8px;

    cursor: pointer;
}

.nav a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 110px;
    height: 1px;

    background: #7d0000;
}

.nav a:hover {
    color: #fff;
}


/* =========================================
   TRACKING TEXT
========================================= */

.tagline {
    margin-top: 20px;

    color: #555;

    font-size: 11px;

    line-height: 1.8;

    letter-spacing: 0.5px;

    text-align: center;
}

#route {
    color: #b00000;
}


/* =========================================
   ENCRYPTION SCREEN
========================================= */

.encrypt-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.97);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.encrypt-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================
   ENCRYPTION PANEL
========================================= */

.encrypt-panel {
    width: min(900px, 88vw);

    border: 1px solid #252525;

    background: #020202;

    padding: 42px;

    transform: scale(0.96);

    opacity: 0;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}

.encrypt-overlay.active .encrypt-panel {
    transform: scale(1);
    opacity: 1;
}


/* =========================================
   HEADER
========================================= */

.encrypt-title {
    color: #777;

    font-size: 12px;
    letter-spacing: 2px;

    margin-bottom: 28px;

    text-align: left;
}


/* =========================================
   ENCRYPTION CODE

   IBM PLEX MONO
========================================= */

.encrypt-code {
    color: #b00000;

    font-family:
        "IBM Plex Mono",
        monospace;

    font-size: clamp(22px, 4vw, 46px);

    font-weight: 500;

    letter-spacing: 5px;

    word-break: break-all;

    text-align: left;

    min-height: 110px;

    display: flex;
    align-items: center;

    border-top: 1px solid #1d1d1d;
    border-bottom: 1px solid #1d1d1d;

    padding: 25px 0;

    margin-bottom: 28px;

    text-shadow:
        0 0 2px rgba(176, 0, 0, 0.45);
}


/* =========================================
   STATUS
========================================= */

.encrypt-status {
    display: flex;
    justify-content: space-between;

    gap: 20px;

    color: #555;

    font-size: 10px;
    letter-spacing: 1px;

    margin-bottom: 14px;
}


/* =========================================
   PROGRESS BAR
========================================= */

.encrypt-bar {
    width: 100%;
    height: 4px;

    background: #151515;

    overflow: hidden;
}

.encrypt-progress {
    width: 0%;
    height: 100%;

    background: #8d0000;

    transition: width 0.06s linear;
}


/* =========================================
   BOTTOM TEXT
========================================= */

.encrypt-bottom {
    margin-top: 14px;

    color: #333;

    font-size: 9px;

    text-align: left;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .home {
        padding: 20px;
    }

    .logo {
        width: 550px;
        max-width: 95vw;
    }

    .text-area {
        transform: translateY(-135px);
    }

    .nav a {
        font-size: 16px;
    }

    .tagline {
        margin-top: 18px;
    }

    .encrypt-panel {
        width: 92vw;
        padding: 25px;
    }

    .encrypt-code {
        min-height: 90px;

        letter-spacing: 3px;

        font-size: clamp(
            20px,
            6vw,
            34px
        );
    }

}

</style>

</head>


<body>


<!-- =========================================
     HOME
========================================= -->

<div class="home">


    <!-- LOGO -->

    <img
        class="logo"
        src="suicide-party-logo.png"
        alt="suicide party"
    >


    <div class="text-area">


        <!-- NAVIGATION -->

        <div class="nav">


            <a onclick="openEncryptedPage('archive.html', 'FILE DIRECTORY')">
                files
            </a>


            <a onclick="openEncryptedPage('audio.html', 'AUDIO DIRECTORY')">
                audio files
            </a>


        </div>


        <!-- TRACKING TEXT -->

        <div class="tagline">

            <div>
                your connection has been logged.
            </div>

            <div>
                session ID: [unbound]
            </div>

            <div>

                route:

                <span id="route">
                    192.168.---.---
                </span>

            </div>

            <div>

                time:

                <span id="time">
                    --:--:-- --
                </span>

            </div>

            <div>
                unknown client
            </div>

        </div>


    </div>


</div>



<!-- =========================================
     ENCRYPTION OVERLAY
========================================= -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>


    <div class="encrypt-panel">


        <!-- TITLE -->

        <div class="encrypt-title">
            establishing channel
        </div>


        <!-- CODE -->

        <div
            id="encryptCode"
            class="encrypt-code"
        >
            0000000000000
        </div>


        <!-- STATUS -->

        <div class="encrypt-status">


            <span id="encryptStatus">
                negotiating key...
            </span>


            <span id="encryptPercent">
                0%
            </span>


        </div>


        <!-- PROGRESS BAR -->

        <div class="encrypt-bar">


            <div
                id="encryptProgress"
                class="encrypt-progress"
            ></div>


        </div>


        <!-- BOTTOM -->

        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >
            access request pending
        </div>


    </div>


</div>



<script>


/* =========================================
   CURRENT LOCAL 12-HOUR TIME
========================================= */

function updateClock() {


    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const ampm =
        hours >= 12
        ? "PM"
        : "AM";


    hours =
        hours % 12;


    hours =
        hours
        ? hours
        : 12;


    document.getElementById(
        "time"
    ).textContent =

        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm;


}



/* =========================================
   FAKE CHANGING IP
========================================= */

function updateRoute() {


    const part1 =
        Math.floor(
            Math.random() *
            256
        );


    const part2 =
        Math.floor(
            Math.random() *
            256
        );


    const part3 =
        Math.floor(
            Math.random() *
            256
        );


    const part4 =
        Math.floor(
            Math.random() *
            256
        );


    document.getElementById(
        "route"
    ).textContent =

        part1 + "." +
        part2 + "." +
        part3 + "." +
        part4;


}



/* =========================================
   START CLOCK + ROUTE
========================================= */

updateClock();

updateRoute();


setInterval(
    updateClock,
    1000
);


setInterval(
    updateRoute,
    350
);



/* =========================================
   RANDOM LETTER / NUMBER
========================================= */

function randomCharacter() {


    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


    return characters[

        Math.floor(
            Math.random()
            *
            characters.length
        )

    ];


}



/* =========================================
   BUILD ENCRYPTION CODE

   0 - 39%:
   COMPLETELY SCRAMBLED

   40 - 100%:
   FINAL WORD REVEALS
========================================= */

function makeRevealCode(
    progressValue
) {


    const finalWord =
        "KYSORDIETRYIN";


    let lockedLetters =
        0;



    /* =====================================
       START REVEAL AT 40%
    ===================================== */

    if (
        progressValue >= 40
    ) {


        /*
           CONVERT 40 - 100%
           INTO 0 - 1
        */

        const revealProgress =

            (
                progressValue - 40
            )
            /
            60;



        /*
           CALCULATE HOW MANY LETTERS
           ARE NOW PERMANENTLY REVEALED
        */

        lockedLetters =

            Math.floor(

                revealProgress
                *
                finalWord.length

            );


    }



    let output =
        "";



    /* =====================================
       BUILD THE 13 CHARACTER STRING
    ===================================== */

    for (
        let i = 0;
        i < finalWord.length;
        i++
    ) {


        /* =================================
           REVEALED CHARACTER
        ================================= */

        if (
            i < lockedLetters
        ) {


            output +=
                finalWord[i];


        }


        /* =================================
           UNREVEALED CHARACTER
           KEEPS SCRAMBLING
        ================================= */

        else {


            output +=
                randomCharacter();


        }


    }


    return output;


}



/* =========================================
   OPEN FILES OR AUDIO
========================================= */

function openEncryptedPage(
    destination,
    directoryName
) {


    const overlay =
        document.getElementById(
            "encryptOverlay"
        );


    const code =
        document.getElementById(
            "encryptCode"
        );


    const progress =
        document.getElementById(
            "encryptProgress"
        );


    const percent =
        document.getElementById(
            "encryptPercent"
        );


    const status =
        document.getElementById(
            "encryptStatus"
        );


    const bottom =
        document.getElementById(
            "encryptBottom"
        );



    /* =====================================
       RESET EVERYTHING
    ===================================== */

    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    code.textContent =
        makeRevealCode(
            0
        );


    status.textContent =
        "negotiating key...";


    bottom.textContent =
        directoryName +
        " / access request pending";



    /* =====================================
       SHOW ENCRYPTION SCREEN
    ===================================== */

    overlay.classList.add(
        "active"
    );



    /*
       CURRENT PROGRESS IS STORED
       SEPARATELY SO THE SCRAMBLING
       CODE KNOWS HOW MANY LETTERS
       SHOULD BE REVEALED
    */

    let currentProgress =
        0;



    /* =====================================
       FAST SCRAMBLING

       RANDOM CHARACTERS CHANGE
       EVERY 35 MILLISECONDS
    ===================================== */

    const codeInterval =

        setInterval(
            function() {


                code.textContent =
                    makeRevealCode(
                        currentProgress
                    );


            },
            35
        );



    /* =====================================
       WAIT 2 SECONDS BEFORE
       PROGRESS BAR STARTS
    ===================================== */

    setTimeout(
        function() {


            let value =
                0;



            /* =================================
               PROGRESS
            ================================= */

            const progressInterval =

                setInterval(
                    function() {


                        value++;


                        currentProgress =
                            value;


                        progress.style.width =
                            value + "%";


                        percent.textContent =
                            value + "%";



                        /* =================================
                           0 - 24%
                        ================================= */

                        if (
                            value < 25
                        ) {


                            status.textContent =
                                "negotiating key...";


                        }



                        /* =================================
                           25 - 49%
                        ================================= */

                        else if (
                            value < 50
                        ) {


                            status.textContent =
                                "searching for path...";


                        }



                        /* =================================
                           50 - 74%
                        ================================= */

                        else if (
                            value < 75
                        ) {


                            status.textContent =
                                "binding client...";


                        }



                        /* =================================
                           75 - 100%
                        ================================= */

                        else {


                            status.textContent =
                                "path found...";


                        }



                        /* =================================
                           COMPLETE
                        ================================= */

                        if (
                            value >= 100
                        ) {


                            /* STOP PROGRESS */

                            clearInterval(
                                progressInterval
                            );


                            /* STOP SCRAMBLING */

                            clearInterval(
                                codeInterval
                            );


                            /* FORCE 100% */

                            progress.style.width =
                                "100%";


                            percent.textContent =
                                "100%";


                            /* =================================
                               FINAL REVEAL
                            ================================= */

                            code.textContent =
                                "KYSORDIETRYIN";


                            status.textContent =
                                "path found...";


                            bottom.textContent =
                                directoryName +
                                " / channel established";



                            /* =================================
                               HOLD FINAL WORD
                               FOR 2 FULL SECONDS
                            ================================= */

                            setTimeout(
                                function() {


                                    window.location.href =
                                        destination;


                                },
                                2000
                            );


                        }


                    },
                    40
                );


        },
        2000
    );


}

</script>


</body>

</html>
