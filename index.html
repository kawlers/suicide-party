<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicideparty.com</title>

<style>


/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #000;
}

body {
    color: #d8d0e5;

    font-family:
        "Courier New",
        monospace;

    background:
        radial-gradient(
            circle at 50% 30%,
            #150529 0%,
            #07000e 35%,
            #000 75%
        );

    min-height: 100vh;

    padding: 20px;
}


/* =========================================
   MAIN WEBSITE FRAME
========================================= */

.site-frame {

    width: min(1320px, 96vw);

    min-height: calc(100vh - 40px);

    margin: 0 auto;

    border: 1px solid #542b87;

    background:
        linear-gradient(
            rgba(8, 1, 15, 0.94),
            rgba(3, 0, 8, 0.97)
        );

    box-shadow:
        0 0 22px rgba(89, 34, 145, 0.20);

}


/* =========================================
   TOP BAR
========================================= */

.topbar {

    height: 54px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;

    border-bottom: 1px solid #542b87;

    background:
        linear-gradient(
            90deg,
            #17072e,
            #0c0217,
            #18082f
        );

}


/* SITE NAME */

.site-name {

    color: #ddd6e8;

    font-size: 18px;

    letter-spacing: 1px;

    white-space: nowrap;

}


/* TOP NAV */

.top-nav {

    display: flex;

    align-items: center;

    gap: 14px;

    font-size: 13px;

}


.top-nav a {

    color: #b887e9;

    text-decoration: underline;

    cursor: pointer;

}


.top-nav a:hover {

    color: #fff;

}


.divider {

    color: #4c3460;

}


/* =========================================
   HERO AREA
========================================= */

.hero {

    position: relative;

    min-height: 480px;

    overflow: hidden;

    border-bottom: 1px solid #542b87;

    background:

        radial-gradient(
            circle at 28% 42%,
            rgba(88, 30, 160, 0.22),
            transparent 34%
        ),

        radial-gradient(
            circle at 80% 20%,
            rgba(83, 19, 150, 0.18),
            transparent 38%
        ),

        linear-gradient(
            130deg,
            #050008,
            #11031d 52%,
            #030005
        );

}


/* OLD-WEB TEXTURE */

.hero::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.14;

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(121, 63, 170, 0.18) 3px
        );

}


/* PURPLE GLOW / GRUNGE SHAPES */

.hero::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 72% 24%,
            rgba(102, 33, 190, 0.21),
            transparent 25%
        ),

        radial-gradient(
            ellipse at 20% 85%,
            rgba(77, 11, 142, 0.17),
            transparent 30%
        );

}


/* =========================================
   LOGO AREA
========================================= */

.logo-zone {

    position: relative;

    z-index: 2;

    min-height: 300px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 34px 20px 10px;

}


.logo {

    width: min(650px, 72vw);

    max-height: 295px;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            0 0 8px rgba(88, 18, 142, 0.20)
        );

}


/* =========================================
   CONNECTION PANEL
========================================= */

.connection-wrap {

    position: relative;

    z-index: 3;

    display: flex;

    justify-content: center;

    padding:
        0 30px 28px;

}


.connection-panel {

    width: min(900px, 88%);

    border: 1px solid #5c2a91;

    background:
        rgba(3, 0, 8, 0.92);

    padding:
        20px 22px;

    box-shadow:
        inset 0 0 18px
        rgba(75, 23, 123, 0.10);

}


.connection-title {

    color: #a26bd5;

    font-size: 12px;

    margin-bottom: 14px;

}


.connection-line {

    height: 1px;

    background:
        #42215f;

    margin-bottom: 14px;

}


/* CONNECTION INFO */

.connection-grid {

    display: grid;

    grid-template-columns:
        1fr auto;

    gap: 7px 35px;

    align-items: center;

    color: #9c8cae;

    font-size: 11px;

    line-height: 1.6;

}


.connection-left {

    text-align: left;

}


.connection-right {

    text-align: right;

}


/* FAKE IP */

#route {

    color: #c00018;

}


/* =========================================
   BOTTOM STRIP
========================================= */

.site-footer {

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-top: 1px solid #32174d;

    background:
        linear-gradient(
            90deg,
            #10031e,
            #19052e,
            #10031e
        );

    color: #7e55a6;

    font-size: 10px;

    letter-spacing: 0.5px;

}


/* =========================================
   ENCRYPTION SCREEN
========================================= */

.encrypt-overlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0, 0, 0, 0.97);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;

}


.encrypt-overlay.active {

    opacity: 1;

    visibility: visible;

}


/* BIG PANEL */

.encrypt-panel {

    width: min(
        900px,
        88vw
    );

    padding: 42px;

    border:
        1px solid #49236e;

    background:
        #030006;

    box-shadow:
        0 0 35px
        rgba(96, 34, 157, 0.12);

    opacity: 0;

    transform:
        scale(0.96);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;

}


.encrypt-overlay.active
.encrypt-panel {

    opacity: 1;

    transform:
        scale(1);

}


/* ENCRYPTION TITLE */

.encrypt-title {

    color: #826195;

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 28px;

}


/* CHANGING CODE */

.encrypt-code {

    min-height: 110px;

    display: flex;

    align-items: center;

    padding:
        25px 0;

    border-top:
        1px solid #29143b;

    border-bottom:
        1px solid #29143b;

    margin-bottom: 28px;

    color: #b4001b;

    font-size:
        clamp(
            22px,
            4vw,
            46px
        );

    letter-spacing:
        5px;

    word-break:
        break-all;

}


/* STATUS ROW */

.encrypt-status {

    display: flex;

    justify-content:
        space-between;

    gap: 20px;

    margin-bottom:
        14px;

    color:
        #5e5068;

    font-size:
        10px;

    letter-spacing:
        1px;

}


/* LOAD BAR */

.encrypt-bar {

    width: 100%;

    height: 4px;

    background:
        #13091c;

    overflow:
        hidden;

}


.encrypt-progress {

    width: 0%;

    height: 100%;

    background:
        #791228;

    transition:
        width 0.06s linear;

}


/* BOTTOM ENCRYPTION TEXT */

.encrypt-bottom {

    margin-top:
        14px;

    color:
        #392d41;

    font-size:
        9px;

}


/* =========================================
   MOBILE
========================================= */

@media
(max-width: 700px) {


    body {

        padding:
            8px;

    }


    .site-frame {

        width:
            100%;

        min-height:
            calc(
                100vh - 16px
            );

    }


    .topbar {

        height:
            auto;

        min-height:
            54px;

        padding:
            12px 15px;

        gap:
            12px;

    }


    .site-name {

        font-size:
            13px;

    }


    .top-nav {

        gap:
            7px;

        font-size:
            10px;

    }


    .logo {

        width:
            88vw;

    }


    .hero {

        min-height:
            430px;

    }


    .connection-wrap {

        padding:
            0 15px 22px;

    }


    .connection-panel {

        width:
            100%;

    }


    .connection-grid {

        grid-template-columns:
            1fr;

    }


    .connection-right {

        text-align:
            left;

    }


    .encrypt-panel {

        width:
            92vw;

        padding:
            25px;

    }


    .encrypt-code {

        min-height:
            90px;

        letter-spacing:
            3px;

    }


}

</style>

</head>


<body>



<!-- =========================================
     WEBSITE FRAME
========================================= -->

<div class="site-frame">



    <!-- =====================================
         TOP BAR
    ====================================== -->

    <div class="topbar">


        <div class="site-name">
            suicideparty.com
        </div>


        <div class="top-nav">


            <a href="index.html">
                home
            </a>


            <span class="divider">
                |
            </span>


            <a
                onclick="
                openEncryptedPage(
                    'archive.html',
                    'FILE DIRECTORY'
                )
                "
            >
                files
            </a>


            <span class="divider">
                |
            </span>


            <a
                onclick="
                openEncryptedPage(
                    'audio.html',
                    'AUDIO DIRECTORY'
                )
                "
            >
                audio files
            </a>


        </div>


    </div>



    <!-- =====================================
         HERO
    ====================================== -->

    <div class="hero">



        <!-- LOGO -->

        <div class="logo-zone">


            <img
                class="logo"
                src="suicide-party-logo.png"
                alt="suicide party"
            >


        </div>



        <!-- CONNECTION PANEL -->

        <div class="connection-wrap">


            <div class="connection-panel">


                <div class="connection-title">

                    your connection
                    has been logged.

                </div>


                <div class="connection-line">
                </div>



                <div class="connection-grid">



                    <div class="connection-left">

                        session ID:
                        [unbound]

                    </div>


                    <div class="connection-right">

                        time:
                        <span id="time">
                            --:--:-- --
                        </span>

                    </div>



                    <div class="connection-left">

                        route:

                        <span id="route">
                            192.168.---.---
                        </span>

                    </div>


                    <div class="connection-right">

                        unknown client

                    </div>


                </div>


            </div>


        </div>


    </div>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <div class="site-footer">

        © 2004 suicideparty.com

    </div>


</div>



<!-- =========================================
     ENCRYPTION OVERLAY
========================================= -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>


    <div class="encrypt-panel">



        <!-- TITLE -->

        <div class="encrypt-title">

            establishing
            encrypted channel_

        </div>



        <!-- CODE -->

        <div
            id="encryptCode"
            class="encrypt-code"
        >

            0000 0000 0000 0000

        </div>



        <!-- STATUS -->

        <div class="encrypt-status">


            <span id="encryptStatus">

                negotiating key...

            </span>


            <span id="encryptPercent">

                0%

            </span>


        </div>



        <!-- BAR -->

        <div class="encrypt-bar">


            <div
                id="encryptProgress"
                class="encrypt-progress"
            >
            </div>


        </div>



        <!-- BOTTOM -->

        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >

            access request pending

        </div>


    </div>


</div>



<script>



/* =========================================
   CURRENT 12-HOUR TIME
========================================= */

function updateClock() {


    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const ampm =
        hours >= 12
        ? "PM"
        : "AM";


    hours =
        hours % 12;


    hours =
        hours
        ? hours
        : 12;


    document
        .getElementById(
            "time"
        )
        .textContent =

        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm;


}



/* =========================================
   FAKE CHANGING IP
========================================= */

function updateRoute() {


    const part1 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part2 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part3 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part4 =
        Math.floor(
            Math.random()
            *
            256
        );


    document
        .getElementById(
            "route"
        )
        .textContent =

        part1 +
        "." +
        part2 +
        "." +
        part3 +
        "." +
        part4;


}



/* START */

updateClock();

updateRoute();


setInterval(
    updateClock,
    1000
);


setInterval(
    updateRoute,
    350
);



/* =========================================
   16 CHARACTER CODE
========================================= */

function makeEncryptionCode() {


    const characters =
        "0123456789ABCDEF";


    let output =
        "";


    for (
        let i = 0;
        i < 16;
        i++
    ) {


        output +=

            characters[

                Math.floor(
                    Math.random()
                    *
                    characters.length
                )

            ];


        if (
            (i + 1) % 4 === 0
            &&
            i < 15
        ) {


            output +=
                " ";


        }


    }


    return output;


}



/* =========================================
   OPEN FILES OR AUDIO
========================================= */

function openEncryptedPage(
    destination,
    directoryName
) {


    const overlay =
        document.getElementById(
            "encryptOverlay"
        );


    const code =
        document.getElementById(
            "encryptCode"
        );


    const progress =
        document.getElementById(
            "encryptProgress"
        );


    const percent =
        document.getElementById(
            "encryptPercent"
        );


    const status =
        document.getElementById(
            "encryptStatus"
        );


    const bottom =
        document.getElementById(
            "encryptBottom"
        );



    /* RESET */

    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    code.textContent =
        makeEncryptionCode();


    status.textContent =
        "negotiating key...";


    bottom.textContent =
        directoryName +
        " / access request pending";



    /* SHOW SCREEN */

    overlay.classList.add(
        "active"
    );



    /* CODE MOVES IMMEDIATELY */

    const codeInterval =

        setInterval(
            function() {


                code.textContent =
                    makeEncryptionCode();


            },
            100
        );



    /* =====================================
       WAIT 2 SECONDS
    ===================================== */

    setTimeout(
        function() {



            let value =
                0;



            /*
               THEN LOAD FOR
               ABOUT 4 SECONDS
            */

            const progressInterval =

                setInterval(
                    function() {



                        value++;



                        progress
                            .style
                            .width =

                            value +
                            "%";



                        percent
                            .textContent =

                            value +
                            "%";



                        /* STAGE 1 */

                        if (
                            value < 25
                        ) {


                            status.textContent =
                                "negotiating key...";


                        }



                        /* STAGE 2 */

                        else if (
                            value < 50
                        ) {


                            status.textContent =
                                "masking route...";


                        }



                        /* STAGE 3 */

                        else if (
                            value < 75
                        ) {


                            status.textContent =
                                "verifying access...";


                        }



                        /* STAGE 4 */

                        else {


                            status.textContent =
                                "reconstructing path...";


                        }



                        /* COMPLETE */

                        if (
                            value >= 100
                        ) {


                            clearInterval(
                                progressInterval
                            );


                            clearInterval(
                                codeInterval
                            );


                            window.location.href =
                                destination;


                        }


                    },
                    40
                );


        },
        2000
    );


}

</script>


</body>

</html>
