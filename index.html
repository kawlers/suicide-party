<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicideparty.com</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;

    background: #000;
}

body {
    display: flex;
    justify-content: center;

    font-family: "Courier New", monospace;
}


/* =====================================================
   EXACT MOCK IMAGE
===================================================== */

.mock-wrapper {
    position: relative;

    width: min(1402px, 100vw);

    aspect-ratio: 1402 / 1122;

    background-image:
        url("site-mock.png");

    background-size:
        100% 100%;

    background-repeat:
        no-repeat;

    background-position:
        center top;
}


/* =====================================================
   LIVE ROUTE + TIME
===================================================== */

/*
   THESE BLACK PATCHES COVER THE STATIC
   ROUTE/TIME FROM THE MOCK IMAGE.
*/

.live-route,
.live-time {

    position: absolute;

    z-index: 15;

    background: #030005;

    font-family:
        "Courier New",
        monospace;

    white-space: nowrap;

    display: flex;
    align-items: center;
}


/* ROUTE VALUE */

.live-route {

    left: 64.5%;
    top: 29.2%;

    width: 12.5%;
    height: 2.6%;

    color: #d0001f;

    font-size:
        clamp(
            8px,
            1.05vw,
            15px
        );
}


/* TIME VALUE */

.live-time {

    left: 64.5%;
    top: 31.8%;

    width: 13.5%;
    height: 2.6%;

    color: #c8bad3;

    font-size:
        clamp(
            8px,
            1.05vw,
            15px
        );
}


/* =====================================================
   CLICK AREAS
===================================================== */

.hotspot {

    position: absolute;

    z-index: 20;

    cursor: pointer;

    background: transparent;

    border: none;

    padding: 0;
}


/* TOP HOME */

.home-link {

    top: 2.4%;
    left: 72%;

    width: 5%;
    height: 3.4%;
}


/* TOP FILES */

.files-link {

    top: 2.4%;
    left: 77.8%;

    width: 7%;
    height: 3.4%;
}


/* TOP AUDIO */

.audio-link {

    top: 2.4%;
    left: 85.5%;

    width: 11.5%;
    height: 3.4%;
}


/* LOWER FILES PANEL */

.file-panel-link {

    top: 56%;
    left: 2%;

    width: 46%;
    height: 41%;
}


/* LOWER AUDIO PANEL */

.audio-panel-link {

    top: 56%;
    left: 50%;

    width: 47%;
    height: 41%;
}


/* =====================================================
   ENCRYPTION OVERLAY
===================================================== */

.encrypt-overlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0, 0, 0, 0.98);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}


.encrypt-overlay.active {

    opacity: 1;

    visibility: visible;
}


/* =====================================================
   ENCRYPTION WINDOW
===================================================== */

.encrypt-panel {

    width: min(
        900px,
        88vw
    );

    padding: 42px;

    border:
        1px solid #582a87;

    background:
        #030006;

    box-shadow:
        0 0 35px
        rgba(101, 30, 170, 0.15);

    opacity: 0;

    transform:
        scale(0.96);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}


.encrypt-overlay.active
.encrypt-panel {

    opacity: 1;

    transform:
        scale(1);
}


/* TITLE */

.encrypt-title {

    color: #9970b2;

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 28px;
}


/* 16 CHARACTER CODE */

.encrypt-code {

    min-height: 110px;

    display: flex;

    align-items: center;

    padding:
        25px 0;

    margin-bottom:
        28px;

    border-top:
        1px solid #331747;

    border-bottom:
        1px solid #331747;

    color:
        #b8001c;

    font-size:
        clamp(
            22px,
            4vw,
            46px
        );

    letter-spacing:
        5px;
}


/* STATUS */

.encrypt-status {

    display: flex;

    justify-content:
        space-between;

    gap: 20px;

    margin-bottom:
        14px;

    color:
        #665571;

    font-size:
        10px;

    letter-spacing:
        1px;
}


/* BAR */

.encrypt-bar {

    width: 100%;

    height: 4px;

    background:
        #160b1f;

    overflow:
        hidden;
}


.encrypt-progress {

    width: 0%;

    height: 100%;

    background:
        #87142a;

    transition:
        width 0.06s linear;
}


/* BOTTOM */

.encrypt-bottom {

    margin-top:
        14px;

    color:
        #423449;

    font-size:
        9px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .mock-wrapper {

        width: 100vw;

    }


    .encrypt-panel {

        width: 92vw;

        padding: 25px;

    }


    .encrypt-code {

        min-height: 90px;

        letter-spacing: 3px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     EXACT MOCK
===================================================== -->

<div class="mock-wrapper">


    <!-- LIVE CHANGING FAKE IP -->

    <div
        id="route"
        class="live-route"
    >
        192.168.---.---
    </div>


    <!-- LIVE CURRENT TIME -->

    <div
        id="time"
        class="live-time"
    >
        --:--:-- --
    </div>



    <!-- TOP HOME -->

    <button
        class="hotspot home-link"
        onclick="window.location.href='index.html'"
        aria-label="home"
    >
    </button>



    <!-- TOP FILES -->

    <button
        class="hotspot files-link"
        onclick="
            openEncryptedPage(
                'archive.html',
                'FILE DIRECTORY'
            )
        "
        aria-label="files"
    >
    </button>



    <!-- TOP AUDIO -->

    <button
        class="hotspot audio-link"
        onclick="
            openEncryptedPage(
                'audio.html',
                'AUDIO DIRECTORY'
            )
        "
        aria-label="audio files"
    >
    </button>



    <!-- LOWER FILES PANEL -->

    <button
        class="hotspot file-panel-link"
        onclick="
            openEncryptedPage(
                'archive.html',
                'FILE DIRECTORY'
            )
        "
        aria-label="open files"
    >
    </button>



    <!-- LOWER AUDIO PANEL -->

    <button
        class="hotspot audio-panel-link"
        onclick="
            openEncryptedPage(
                'audio.html',
                'AUDIO DIRECTORY'
            )
        "
        aria-label="open audio files"
    >
    </button>


</div>



<!-- =====================================================
     ENCRYPTION SCREEN
===================================================== -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>


    <div class="encrypt-panel">


        <!-- TITLE -->

        <div class="encrypt-title">

            establishing encrypted channel_

        </div>



        <!-- CODE -->

        <div
            id="encryptCode"
            class="encrypt-code"
        >

            0000 0000 0000 0000

        </div>



        <!-- STATUS -->

        <div class="encrypt-status">


            <span id="encryptStatus">

                negotiating key...

            </span>


            <span id="encryptPercent">

                0%

            </span>


        </div>



        <!-- BAR -->

        <div class="encrypt-bar">


            <div
                id="encryptProgress"
                class="encrypt-progress"
            >
            </div>


        </div>



        <!-- BOTTOM -->

        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >

            access request pending

        </div>


    </div>


</div>



<script>


/* =====================================================
   LIVE CURRENT 12-HOUR TIME
===================================================== */

function updateClock() {


    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const ampm =
        hours >= 12
        ? "PM"
        : "AM";


    hours =
        hours % 12;


    hours =
        hours
        ? hours
        : 12;


    document
        .getElementById(
            "time"
        )
        .textContent =

        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm;


}



/* =====================================================
   FAKE CHANGING IP
===================================================== */

function updateRoute() {


    const part1 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part2 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part3 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part4 =
        Math.floor(
            Math.random()
            *
            256
        );


    document
        .getElementById(
            "route"
        )
        .textContent =

        part1 +
        "." +
        part2 +
        "." +
        part3 +
        "." +
        part4;


}



/* START LIVE TEXT */

updateClock();

updateRoute();


setInterval(
    updateClock,
    1000
);


setInterval(
    updateRoute,
    350
);



/* =====================================================
   RANDOM 16 CHARACTER ENCRYPTION CODE
===================================================== */

function makeEncryptionCode() {


    const characters =
        "0123456789ABCDEF";


    let output =
        "";


    for (
        let i = 0;
        i < 16;
        i++
    ) {


        output +=

            characters[

                Math.floor(
                    Math.random()
                    *
                    characters.length
                )

            ];


        /* SPACE EVERY 4 CHARACTERS */

        if (
            (i + 1) % 4 === 0
            &&
            i < 15
        ) {


            output +=
                " ";


        }


    }


    return output;


}



/* =====================================================
   OPEN FILES / AUDIO
===================================================== */

function openEncryptedPage(
    destination,
    directoryName
) {


    const overlay =
        document.getElementById(
            "encryptOverlay"
        );


    const code =
        document.getElementById(
            "encryptCode"
        );


    const progress =
        document.getElementById(
            "encryptProgress"
        );


    const percent =
        document.getElementById(
            "encryptPercent"
        );


    const status =
        document.getElementById(
            "encryptStatus"
        );


    const bottom =
        document.getElementById(
            "encryptBottom"
        );



    /* RESET */

    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    code.textContent =
        makeEncryptionCode();


    status.textContent =
        "negotiating key...";


    bottom.textContent =
        directoryName +
        " / access request pending";



    /* SHOW */

    overlay
        .classList
        .add(
            "active"
        );



    /* CODE MOVES IMMEDIATELY */

    const codeInterval =

        setInterval(
            function() {


                code.textContent =
                    makeEncryptionCode();


            },
            100
        );



    /* =================================================
       KEEP BAR AT 0 FOR 2 SECONDS
    ================================================= */

    setTimeout(
        function() {


            let value =
                0;



            /* =================================================
               THEN LOAD FOR ABOUT 4 SECONDS
            ================================================= */

            const progressInterval =

                setInterval(
                    function() {


                        value++;


                        progress
                            .style
                            .width =

                            value +
                            "%";


                        percent
                            .textContent =

                            value +
                            "%";



                        /* 0 - 24 */

                        if (
                            value < 25
                        ) {


                            status.textContent =
                                "negotiating key...";


                        }



                        /* 25 - 49 */

                        else if (
                            value < 50
                        ) {


                            status.textContent =
                                "masking route...";


                        }



                        /* 50 - 74 */

                        else if (
                            value < 75
                        ) {


                            status.textContent =
                                "verifying access...";


                        }



                        /* 75 - 100 */

                        else {


                            status.textContent =
                                "reconstructing path...";


                        }



                        /* COMPLETE */

                        if (
                            value >= 100
                        ) {


                            clearInterval(
                                progressInterval
                            );


                            clearInterval(
                                codeInterval
                            );


                            window.location.href =
                                destination;


                        }


                    },
                    40
                );


        },
        2000
    );


}


</script>


</body>

</html>
