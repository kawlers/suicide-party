<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicide party</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #000;
}

body {
    font-family: "Courier New", monospace;
    color: #fff;
}


/* =========================================================
   FULL SCREEN HOME
========================================================= */

.home {
    width: 100%;
    min-height: 100vh;

    position: relative;

    overflow: hidden;

    background-image:
        url("SP-COVER-OFFICIAL-FINISHED.png");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}


/* SUBTLE DARKENING SO TEXT READS */

.home::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.02) 0%,
            rgba(0,0,0,0.04) 46%,
            rgba(0,0,0,0.26) 67%,
            rgba(0,0,0,0.40) 100%
        );

    pointer-events: none;

    z-index: 1;
}


/* SLIGHT OLD WEB TEXTURE */

.home::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 2;

    opacity: 0.06;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,0.07) 4px
        );
}


/* =========================================================
   RIGHT SIDE PANEL
========================================================= */

.interface-panel {
    position: absolute;

    z-index: 5;

    top: 24%;
    right: 3.5%;

    width: 430px;
    max-width: 36vw;

    padding: 34px 38px;

    background:
        rgba(3, 0, 8, 0.86);

    border:
        1px solid rgba(106, 45, 176, 0.88);

    box-shadow:
        0 0 30px rgba(0,0,0,0.70),
        inset 0 0 24px rgba(76,20,130,0.12);

    text-align: center;

    backdrop-filter:
        blur(2px);
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav {
    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 18px;

    margin-bottom: 30px;
}

.nav a {
    position: relative;

    min-width: 180px;

    padding-bottom: 9px;

    color: #e1d9e8;

    font-size: 24px;

    letter-spacing: 5px;

    text-decoration: none;

    cursor: pointer;

    text-shadow:
        0 1px 4px #000;
}

.nav a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 165px;
    height: 1px;

    transform:
        translateX(-50%);

    background:
        #b00016;
}

.nav a:hover {
    color: #fff;
}


/* =========================================================
   CONNECTION TEXT
========================================================= */

.connection-title {
    color: #a99bb4;

    font-size: 11px;

    line-height: 1.7;

    letter-spacing: 0.3px;

    margin-bottom: 16px;
}


/* CONNECTION DATA */

.connection-data {
    width: 100%;

    display: grid;

    grid-template-columns:
        105px 1fr;

    row-gap: 9px;

    text-align: left;

    font-size: 11px;

    line-height: 1.5;
}


.label {
    color: #8d7d99;
}


.value {
    color: #b9acbf;
}


/* RED FAKE IP */

#route {
    color: #d00018;
}


/* =========================================================
   ENCRYPTION OVERLAY
========================================================= */

.encrypt-overlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,0.48);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.encrypt-overlay.active {
    opacity: 1;

    visibility: visible;
}


/* =========================================================
   ENCRYPTION WINDOW
========================================================= */

.encrypt-panel {
    width: min(640px, 82vw);

    padding:
        34px 38px 36px;

    border:
        1px solid #4c3266;

    background:
        rgba(2, 0, 5, 0.96);

    box-shadow:
        0 0 42px rgba(0,0,0,0.88);

    opacity: 0;

    transform:
        translateY(20px)
        scale(0.97);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.encrypt-overlay.active
.encrypt-panel {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* HEADER */

.encrypt-title {
    color: #a294aa;

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 25px;

    text-align: left;
}


/* CODE AREA */

.encrypt-code {
    min-height: 105px;

    display: flex;

    align-items: center;

    padding:
        20px 8px;

    margin-bottom:
        25px;

    border-top:
        1px solid #322539;

    border-bottom:
        1px solid #322539;

    color:
        #d00018;

    font-size:
        clamp(
            26px,
            4vw,
            42px
        );

    letter-spacing:
        6px;

    white-space: nowrap;
}


/* STATUS */

.encrypt-status {
    display: flex;

    justify-content:
        space-between;

    gap: 20px;

    margin-bottom:
        12px;

    color:
        #a094a8;

    font-size:
        11px;

    letter-spacing:
        0.5px;
}


/* BAR */

.encrypt-bar {
    width: 100%;
    height: 6px;

    background:
        #140a19;

    border:
        1px solid #25182b;

    overflow:
        hidden;
}


.encrypt-progress {
    width: 0%;

    height: 100%;

    background:
        #a50017;

    transition:
        width 0.06s linear;
}


/* BOTTOM */

.encrypt-bottom {
    margin-top:
        18px;

    color:
        #5d545f;

    font-size:
        10px;

    text-align:
        left;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .home {
        min-height: 100vh;

        background-position:
            center center;
    }


    .home::before {

        background:
            rgba(0,0,0,0.18);

    }


    .interface-panel {
        top: auto;

        bottom: 25px;

        left: 50%;
        right: auto;

        transform:
            translateX(-50%);

        width: 88vw;
        max-width: none;

        padding:
            25px 25px;
    }


    .nav {
        gap: 13px;

        margin-bottom:
            22px;
    }


    .nav a {
        font-size:
            17px;

        letter-spacing:
            3px;
    }


    .connection-data {
        grid-template-columns:
            90px 1fr;

        font-size:
            10px;
    }


    .encrypt-panel {
        width:
            90vw;

        padding:
            28px 25px;
    }


    .encrypt-code {
        min-height:
            90px;

        font-size:
            clamp(
                18px,
                6vw,
                32px
            );

        letter-spacing:
            3px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HOME
========================================================= -->

<div class="home">


    <!-- RIGHT SIDE INTERFACE -->

    <div class="interface-panel">


        <!-- NAVIGATION -->

        <div class="nav">


            <a
                onclick="
                    openEncryptedPage(
                        'archive.html',
                        'FILE DIRECTORY'
                    )
                "
            >
                files
            </a>


            <a
                onclick="
                    openEncryptedPage(
                        'audio.html',
                        'AUDIO DIRECTORY'
                    )
                "
            >
                audio files
            </a>


        </div>



        <!-- CONNECTION TITLE -->

        <div class="connection-title">

            your connection has been logged.

        </div>



        <!-- CONNECTION INFO -->

        <div class="connection-data">


            <div class="label">
                session ID:
            </div>

            <div class="value">
                [unbound]
            </div>



            <div class="label">
                route:
            </div>

            <div
                class="value"
                id="route"
            >
                192.168.---.---
            </div>



            <div class="label">
                time:
            </div>

            <div
                class="value"
                id="time"
            >
                --:--:-- --
            </div>



            <div class="label">
            </div>

            <div class="value">
                unknown client
            </div>


        </div>


    </div>


</div>



<!-- =========================================================
     ENCRYPTION / LOADING SCREEN
========================================================= -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>


    <div class="encrypt-panel">


        <!-- HEADER -->

        <div class="encrypt-title">

            establishing channel

        </div>



        <!-- MOVING 16 CHARACTER CODE -->

        <div
            id="encryptCode"
            class="encrypt-code"
        >

            0000 0000 0000 0000

        </div>



        <!-- STATUS -->

        <div class="encrypt-status">


            <span
                id="encryptStatus"
            >
                negotiating key...
            </span>


            <span
                id="encryptPercent"
            >
                0%
            </span>


        </div>



        <!-- LOADING BAR -->

        <div class="encrypt-bar">


            <div
                id="encryptProgress"
                class="encrypt-progress"
            >
            </div>


        </div>



        <!-- BOTTOM -->

        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >

            access request pending

        </div>


    </div>


</div>



<script>


/* =========================================================
   CURRENT LOCAL 12-HOUR TIME
========================================================= */

function updateClock() {


    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const ampm =
        hours >= 12
        ? "PM"
        : "AM";


    hours =
        hours % 12;


    hours =
        hours
        ? hours
        : 12;


    document
        .getElementById(
            "time"
        )
        .textContent =

        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm;


}



/* =========================================================
   FAKE CHANGING IP
========================================================= */

function updateRoute() {


    const part1 =
        Math.floor(
            Math.random() * 256
        );


    const part2 =
        Math.floor(
            Math.random() * 256
        );


    const part3 =
        Math.floor(
            Math.random() * 256
        );


    const part4 =
        Math.floor(
            Math.random() * 256
        );


    document
        .getElementById(
            "route"
        )
        .textContent =

        part1 +
        "." +
        part2 +
        "." +
        part3 +
        "." +
        part4;


}



/* START */

updateClock();

updateRoute();


setInterval(
    updateClock,
    1000
);


setInterval(
    updateRoute,
    350
);



/* =========================================================
   16 CHARACTER CODE
========================================================= */

function makeEncryptionCode() {


    const characters =
        "0123456789ABCDEF";


    let output =
        "";


    for (
        let i = 0;
        i < 16;
        i++
    ) {


        output +=

            characters[

                Math.floor(
                    Math.random()
                    *
                    characters.length
                )

            ];


        if (
            (i + 1) % 4 === 0
            &&
            i < 15
        ) {


            output +=
                " ";


        }


    }


    return output;


}



/* =========================================================
   OPEN FILES / AUDIO
========================================================= */

function openEncryptedPage(
    destination,
    directoryName
) {


    const overlay =
        document.getElementById(
            "encryptOverlay"
        );


    const code =
        document.getElementById(
            "encryptCode"
        );


    const progress =
        document.getElementById(
            "encryptProgress"
        );


    const percent =
        document.getElementById(
            "encryptPercent"
        );


    const status =
        document.getElementById(
            "encryptStatus"
        );


    const bottom =
        document.getElementById(
            "encryptBottom"
        );



    /* RESET */

    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    code.textContent =
        makeEncryptionCode();


    status.textContent =
        "negotiating key...";


    bottom.textContent =
        directoryName +
        " / access request pending";



    /* SHOW SCREEN */

    overlay
        .classList
        .add(
            "active"
        );



    /* CODE SCRAMBLES IMMEDIATELY */

    const codeInterval =

        setInterval(
            function() {


                code.textContent =
                    makeEncryptionCode();


            },
            100
        );



    /* =====================================================
       WAIT 2 SECONDS BEFORE BAR STARTS
    ===================================================== */

    setTimeout(
        function() {


            let value =
                0;



            /* =================================================
               ABOUT 4 SECOND LOAD
            ================================================= */

            const progressInterval =

                setInterval(
                    function() {


                        value++;


                        progress
                            .style
                            .width =

                            value +
                            "%";


                        percent
                            .textContent =

                            value +
                            "%";



                        /* 0 - 24 */

                        if (
                            value < 25
                        ) {


                            status.textContent =
                                "negotiating key...";


                        }



                        /* 25 - 49 */

                        else if (
                            value < 50
                        ) {


                            status.textContent =
                                "searching for path...";


                        }



                        /* 50 - 74 */

                        else if (
                            value < 75
                        ) {


                            status.textContent =
                                "binding client...";


                        }



                        /* 75 - 100 */

                        else {


                            status.textContent =
                                "path found...";


                        }



                        /* COMPLETE */

                        if (
                            value >= 100
                        ) {


                            clearInterval(
                                progressInterval
                            );


                            clearInterval(
                                codeInterval
                            );


                            window.location.href =
                                destination;


                        }


                    },
                    40
                );


        },
        2000
    );


}


</script>


</body>

</html>
