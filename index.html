<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicideparty.com</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #000;
    color: #d7cbe2;
    font-family: "Courier New", monospace;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 18px;
}


/* =========================================================
   MAIN WEBSITE FRAME
========================================================= */

.site-frame {
    width: min(1400px, 98vw);

    min-height: 650px;

    border: 1px solid #5d2b88;

    background: #030005;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 0 22px rgba(74, 24, 125, 0.18);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    border-bottom: 1px solid #512679;

    background:
        linear-gradient(
            180deg,
            rgba(40, 12, 72, 0.98),
            rgba(17, 3, 31, 0.98)
        );

    position: relative;
    z-index: 10;
}


/* LEFT TITLE */

.site-name {
    color: #e1d8e8;

    font-size: 18px;

    letter-spacing: 1px;

    text-shadow:
        0 1px 3px #000;
}


/* TOP NAV */

.top-nav {
    display: flex;

    align-items: center;

    gap: 13px;

    font-size: 12px;
}

.top-nav a {
    color: #ad78d5;

    text-decoration: underline;

    cursor: pointer;
}

.top-nav a:hover {
    color: #fff;
}

.nav-separator {
    color: #67487b;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.main-content {
    min-height: 555px;

    position: relative;

    display: grid;

    grid-template-columns:
        53% 47%;

    overflow: hidden;

    /*
        SAME ARTWORK USED AS THE BASE
        ACROSS THE WHOLE CONTENT AREA
    */

    background-image:
        url("SPNEWBACKROUNDINDEX.png");

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;
}


/* DARKEN / BLEND FOR READABILITY */

.main-content::before {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.02) 0%,
            rgba(0,0,0,0.02) 44%,
            rgba(0,0,0,0.18) 58%,
            rgba(0,0,0,0.42) 100%
        );
}


/* SUBTLE CRT LINES */

.main-content::after {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    opacity: 0.06;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,0.07) 4px
        );
}


/* =========================================================
   LEFT SIDE

   The artwork is already the background, so this side
   stays mostly empty like the reference.
========================================================= */

.art-side {
    position: relative;

    z-index: 3;

    min-height: 555px;
}


/* =========================================================
   RIGHT SIDE
========================================================= */

.info-side {
    position: relative;

    z-index: 4;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        55px 55px 55px 20px;
}


/* =========================================================
   CONNECTION BOX
========================================================= */

.connection-box {
    width: 100%;

    max-width: 520px;

    min-height: 315px;

    padding:
        28px 28px;

    background:
        rgba(2, 0, 6, 0.91);

    border:
        1px solid #63319a;

    box-shadow:
        inset 0 0 26px rgba(69, 20, 118, 0.10),
        0 0 20px rgba(0,0,0,0.55);
}


/* TITLE */

.connection-title {
    color: #9c62d2;

    font-size: 12px;

    margin-bottom: 20px;
}


/* DASHED LINE */

.system-line {
    width: 100%;

    height: 1px;

    margin-bottom: 20px;

    background:
        repeating-linear-gradient(
            90deg,
            #582582 0px,
            #582582 7px,
            transparent 7px,
            transparent 12px
        );
}


/* INFO ROW */

.info-row {
    display: grid;

    grid-template-columns:
        120px 1fr;

    gap: 18px;

    margin-bottom: 11px;

    font-size: 12px;

    line-height: 1.4;
}

.info-label {
    color: #9865bc;
}

.info-value {
    color: #c5b6cf;
}


/* RED ROUTE */

#route {
    color: #cf001c;
}


/* ONLINE */

.online {
    color: #75d122;
}


/* =========================================================
   BOTTOM BAR
========================================================= */

.bottom-bar {
    height: 34px;

    border-top:
        1px solid #512679;

    background:
        linear-gradient(
            180deg,
            #150425,
            #0a0113
        );
}


/* =========================================================
   ENCRYPTION OVERLAY
========================================================= */

.encrypt-overlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,0.76);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.encrypt-overlay.active {
    opacity: 1;

    visibility: visible;
}


/* =========================================================
   ENCRYPTION PANEL
========================================================= */

.encrypt-panel {
    width: min(760px, 86vw);

    padding:
        38px 42px;

    background:
        rgba(2,0,5,0.97);

    border:
        1px solid #533071;

    box-shadow:
        0 0 45px rgba(0,0,0,0.88);

    opacity: 0;

    transform:
        translateY(16px)
        scale(0.97);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.encrypt-overlay.active
.encrypt-panel {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* ENCRYPTION TITLE */

.encrypt-title {
    color: #95849e;

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 26px;
}


/* CODE */

.encrypt-code {
    min-height: 110px;

    display: flex;

    align-items: center;

    padding:
        22px 8px;

    margin-bottom:
        26px;

    border-top:
        1px solid #322438;

    border-bottom:
        1px solid #322438;

    color: #c9001b;

    font-size:
        clamp(
            25px,
            4vw,
            43px
        );

    letter-spacing: 6px;

    white-space: nowrap;
}


/* STATUS */

.encrypt-status {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 12px;

    color: #8d808f;

    font-size: 10px;

    letter-spacing: 0.5px;
}


/* BAR */

.encrypt-bar {
    width: 100%;

    height: 5px;

    background: #120817;

    border: 1px solid #25172b;

    overflow: hidden;
}

.encrypt-progress {
    width: 0%;

    height: 100%;

    background: #990018;

    transition:
        width 0.06s linear;
}


/* BOTTOM TEXT */

.encrypt-bottom {
    margin-top: 17px;

    color: #554c58;

    font-size: 9px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    body {
        padding: 6px;

        align-items: flex-start;
    }


    .site-frame {
        width: 100%;

        min-height: 100vh;
    }


    .topbar {
        min-height: 52px;

        height: auto;

        padding:
            10px 13px;
    }


    .site-name {
        font-size: 13px;
    }


    .top-nav {
        gap: 7px;

        font-size: 9px;
    }


    .main-content {
        display: block;

        min-height: calc(100vh - 86px);

        background-size: cover;

        background-position:
            center top;
    }


    .art-side {
        min-height: 330px;
    }


    .info-side {
        padding:
            20px 18px 35px;
    }


    .connection-box {
        width: 100%;

        min-height: auto;

        padding: 22px 20px;
    }


    .info-row {
        grid-template-columns:
            100px 1fr;

        gap: 12px;

        font-size: 10px;
    }


    .encrypt-panel {
        width: 92vw;

        padding:
            28px 24px;
    }


    .encrypt-code {
        min-height: 90px;

        font-size:
            clamp(
                18px,
                6vw,
                31px
            );

        letter-spacing: 3px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     MAIN SITE
========================================================= -->

<div class="site-frame">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">


        <div class="site-name">

            suicideparty.com

        </div>


        <div class="top-nav">


            <a href="index.html">

                home

            </a>


            <span class="nav-separator">

                |

            </span>


            <a
                onclick="
                    openEncryptedPage(
                        'archive.html',
                        'FILE DIRECTORY'
                    )
                "
            >

                files

            </a>


            <span class="nav-separator">

                |

            </span>


            <a
                onclick="
                    openEncryptedPage(
                        'audio.html',
                        'AUDIO DIRECTORY'
                    )
                "
            >

                audio files

            </a>


        </div>


    </div>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <div class="main-content">


        <!-- ART SIDE -->

        <div class="art-side">
        </div>



        <!-- CONNECTION SIDE -->

        <div class="info-side">


            <div class="connection-box">


                <div class="connection-title">

                    your connection has been logged.

                </div>


                <div class="system-line">
                </div>



                <!-- SESSION -->

                <div class="info-row">


                    <div class="info-label">

                        session ID:

                    </div>


                    <div class="info-value">

                        [unbound]

                    </div>


                </div>



                <!-- ROUTE -->

                <div class="info-row">


                    <div class="info-label">

                        route:

                    </div>


                    <div
                        class="info-value"
                        id="route"
                    >

                        192.168.---.---

                    </div>


                </div>



                <!-- TIME -->

                <div class="info-row">


                    <div class="info-label">

                        time:

                    </div>


                    <div
                        class="info-value"
                        id="time"
                    >

                        --:--:-- --

                    </div>


                </div>



                <!-- UNKNOWN CLIENT -->

                <div class="info-row">


                    <div class="info-label">
                    </div>


                    <div class="info-value">

                        unknown client

                    </div>


                </div>



                <div
                    class="system-line"
                    style="margin-top:20px;"
                >
                </div>



                <!-- STATUS -->

                <div class="info-row">


                    <div class="info-label">

                        connection status:

                    </div>


                    <div class="info-value online">

                        online

                    </div>


                </div>


            </div>


        </div>


    </div>



    <!-- BOTTOM -->

    <div class="bottom-bar">
    </div>


</div>



<!-- =========================================================
     ENCRYPTION OVERLAY
========================================================= -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>


    <div class="encrypt-panel">


        <!-- TITLE -->

        <div class="encrypt-title">

            establishing channel

        </div>



        <!-- CODE -->

        <div
            id="encryptCode"
            class="encrypt-code"
        >

            0000 0000 0000 0000

        </div>



        <!-- STATUS -->

        <div class="encrypt-status">


            <span id="encryptStatus">

                negotiating key...

            </span>


            <span id="encryptPercent">

                0%

            </span>


        </div>



        <!-- BAR -->

        <div class="encrypt-bar">


            <div
                id="encryptProgress"
                class="encrypt-progress"
            >
            </div>


        </div>



        <!-- BOTTOM -->

        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >

            access request pending

        </div>


    </div>


</div>



<script>


/* =========================================================
   LIVE 12-HOUR CLOCK
========================================================= */

function updateClock() {


    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const ampm =
        hours >= 12
        ? "PM"
        : "AM";


    hours =
        hours % 12;


    hours =
        hours
        ? hours
        : 12;


    document
        .getElementById(
            "time"
        )
        .textContent =

        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm;


}



/* =========================================================
   FAKE CHANGING ROUTE
========================================================= */

function updateRoute() {


    const part1 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part2 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part3 =
        Math.floor(
            Math.random()
            *
            256
        );


    const part4 =
        Math.floor(
            Math.random()
            *
            256
        );


    document
        .getElementById(
            "route"
        )
        .textContent =

        part1 +
        "." +
        part2 +
        "." +
        part3 +
        "." +
        part4;


}



/* START */

updateClock();

updateRoute();


setInterval(
    updateClock,
    1000
);


setInterval(
    updateRoute,
    350
);



/* =========================================================
   16 CHARACTER MOVING CODE
========================================================= */

function makeEncryptionCode() {


    const characters =
        "0123456789ABCDEF";


    let output =
        "";


    for (
        let i = 0;
        i < 16;
        i++
    ) {


        output +=

            characters[

                Math.floor(
                    Math.random()
                    *
                    characters.length
                )

            ];


        if (
            (i + 1) % 4 === 0
            &&
            i < 15
        ) {


            output +=
                " ";


        }


    }


    return output;


}



/* =========================================================
   DIRECTORY TRANSITION
========================================================= */

function openEncryptedPage(
    destination,
    directoryName
) {


    const overlay =
        document.getElementById(
            "encryptOverlay"
        );


    const code =
        document.getElementById(
            "encryptCode"
        );


    const progress =
        document.getElementById(
            "encryptProgress"
        );


    const percent =
        document.getElementById(
            "encryptPercent"
        );


    const status =
        document.getElementById(
            "encryptStatus"
        );


    const bottom =
        document.getElementById(
            "encryptBottom"
        );



    /* RESET */

    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    code.textContent =
        makeEncryptionCode();


    status.textContent =
        "negotiating key...";


    bottom.textContent =
        directoryName +
        " / access request pending";



    /* SHOW */

    overlay
        .classList
        .add(
            "active"
        );



    /* MOVING CODE IMMEDIATELY */

    const codeInterval =

        setInterval(
            function() {


                code.textContent =
                    makeEncryptionCode();


            },
            100
        );



    /* =====================================================
       WAIT 2 SECONDS
    ===================================================== */

    setTimeout(
        function() {


            let value =
                0;



            /* =================================================
               THEN LOAD ~4 SECONDS
            ================================================= */

            const progressInterval =

                setInterval(
                    function() {


                        value++;


                        progress
                            .style
                            .width =

                            value +
                            "%";


                        percent
                            .textContent =

                            value +
                            "%";



                        /* 0 - 24 */

                        if (
                            value < 25
                        ) {


                            status.textContent =
                                "negotiating key...";


                        }



                        /* 25 - 49 */

                        else if (
                            value < 50
                        ) {


                            status.textContent =
                                "searching for path...";


                        }



                        /* 50 - 74 */

                        else if (
                            value < 75
                        ) {


                            status.textContent =
                                "binding client...";


                        }



                        /* 75 - 100 */

                        else {


                            status.textContent =
                                "path found...";


                        }



                        /* COMPLETE */

                        if (
                            value >= 100
                        ) {


                            clearInterval(
                                progressInterval
                            );


                            clearInterval(
                                codeInterval
                            );


                            window.location.href =
                                destination;


                        }


                    },
                    40
                );


        },
        2000
    );


}


</script>


</body>

</html>
