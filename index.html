<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicide party</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* HOME */

.home {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}


/* LOGO */

.logo {
    width: 650px;
    max-width: 90vw;
    height: auto;

    display: block;

    margin-bottom: 0;
}


/* TEXT AREA */

.text-area {
    display: flex;
    flex-direction: column;
    align-items: center;

    transform: translateY(-45px);
}


/* NAVIGATION */

.nav {
    display: flex;
    flex-direction: column;

    gap: 14px;

    align-items: center;
}

.nav a {
    color: #ddd;

    text-decoration: none;

    font-size: 18px;
    letter-spacing: 3px;

    position: relative;

    padding-bottom: 8px;

    cursor: pointer;
}

.nav a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 110px;
    height: 1px;

    background: #7d0000;
}

.nav a:hover {
    color: #fff;
}


/* TRACKING TEXT */

.tagline {
    margin-top: 25px;

    color: #555;

    font-size: 11px;

    line-height: 1.8;

    letter-spacing: 0.5px;

    text-align: center;
}


/* RED CHANGING FAKE IP */

#route {
    color: #b00000;
}


/* =========================================
   ENCRYPTION SCREEN
========================================= */

.encrypt-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.97);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.encrypt-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* LARGE PANEL */

.encrypt-panel {
    width: min(900px, 88vw);

    border: 1px solid #252525;

    background: #020202;

    padding: 42px;

    transform: scale(0.96);

    opacity: 0;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}

.encrypt-overlay.active .encrypt-panel {
    transform: scale(1);
    opacity: 1;
}


/* HEADER */

.encrypt-title {
    color: #777;

    font-size: 12px;
    letter-spacing: 2px;

    margin-bottom: 28px;

    text-align: left;
}


/* 16 CHARACTER CHANGING CODE */

.encrypt-code {
    color: #b00000;

    font-size: clamp(22px, 4vw, 46px);

    letter-spacing: 5px;

    word-break: break-all;

    text-align: left;

    min-height: 110px;

    display: flex;
    align-items: center;

    border-top: 1px solid #1d1d1d;
    border-bottom: 1px solid #1d1d1d;

    padding: 25px 0;

    margin-bottom: 28px;
}


/* STATUS */

.encrypt-status {
    display: flex;
    justify-content: space-between;

    gap: 20px;

    color: #555;

    font-size: 10px;
    letter-spacing: 1px;

    margin-bottom: 14px;
}


/* PROGRESS BAR */

.encrypt-bar {
    width: 100%;
    height: 4px;

    background: #151515;

    overflow: hidden;
}

.encrypt-progress {
    width: 0%;
    height: 100%;

    background: #8d0000;

    transition: width 0.06s linear;
}


/* BOTTOM TEXT */

.encrypt-bottom {
    margin-top: 14px;

    color: #333;

    font-size: 9px;

    text-align: left;
}


/* MOBILE */

@media (max-width: 600px) {

    .home {
        padding: 20px;
    }

    .logo {
        width: 450px;
        max-width: 95vw;
    }

    .text-area {
        transform: translateY(-35px);
    }

    .nav a {
        font-size: 16px;
    }

    .tagline {
        margin-top: 22px;
    }

    .encrypt-panel {
        width: 92vw;
        padding: 25px;
    }

    .encrypt-code {
        min-height: 90px;
        letter-spacing: 3px;
    }

}

</style>

</head>


<body>


<div class="home">


    <img
        class="logo"
        src="suicide-party-logo.png"
        alt="suicide party"
    >


    <div class="text-area">


        <div class="nav">

            <a onclick="openEncryptedPage('archive.html', 'FILE DIRECTORY')">
                files
            </a>

            <a onclick="openEncryptedPage('audio.html', 'AUDIO DIRECTORY')">
                audio files
            </a>

        </div>


        <div class="tagline">

            <div>
                your connection has been logged.
            </div>

            <div>
                session ID: [unbound]
            </div>

            <div>
                route:
                <span id="route">
                    192.168.---.---
                </span>
            </div>

            <div>
                time:
                <span id="time">
                    --:--:--
                </span>
            </div>

            <div>
                unknown client
            </div>

        </div>


    </div>


</div>



<!-- ENCRYPTION SCREEN -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>

    <div class="encrypt-panel">


        <div class="encrypt-title">
            establishing encrypted channel_
        </div>


        <div
            id="encryptCode"
            class="encrypt-code"
        >
            0000 0000 0000 0000
        </div>


        <div class="encrypt-status">

            <span id="encryptStatus">
                negotiating key...
            </span>

            <span id="encryptPercent">
                0%
            </span>

        </div>


        <div class="encrypt-bar">

            <div
                id="encryptProgress"
                class="encrypt-progress"
            ></div>

        </div>


        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >
            access request pending
        </div>


    </div>

</div>



<script>


/* =========================================
   CURRENT TIME
========================================= */

function updateClock() {

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const seconds =
        String(now.getSeconds()).padStart(2, "0");


    document.getElementById("time").textContent =
        hours + ":" + minutes + ":" + seconds;

}



/* =========================================
   FAKE CHANGING IP
========================================= */

function updateRoute() {

    const part1 =
        Math.floor(Math.random() * 256);

    const part2 =
        Math.floor(Math.random() * 256);

    const part3 =
        Math.floor(Math.random() * 256);

    const part4 =
        Math.floor(Math.random() * 256);


    document.getElementById("route").textContent =
        part1 + "." +
        part2 + "." +
        part3 + "." +
        part4;

}


updateClock();
updateRoute();

setInterval(updateClock, 1000);

setInterval(updateRoute, 350);



/* =========================================
   16 CHARACTER CODE
========================================= */

function makeEncryptionCode() {

    const characters =
        "0123456789ABCDEF";

    let output = "";


    for (let i = 0; i < 16; i++) {

        output +=
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];


        if (
            (i + 1) % 4 === 0
            &&
            i < 15
        ) {

            output += " ";

        }

    }


    return output;

}



/* =========================================
   OPEN ENCRYPTED PAGE
========================================= */

function openEncryptedPage(destination, directoryName) {


    const overlay =
        document.getElementById("encryptOverlay");

    const code =
        document.getElementById("encryptCode");

    const progress =
        document.getElementById("encryptProgress");

    const percent =
        document.getElementById("encryptPercent");

    const status =
        document.getElementById("encryptStatus");

    const bottom =
        document.getElementById("encryptBottom");


    /* RESET */

    progress.style.width =
        "0%";

    percent.textContent =
        "0%";

    code.textContent =
        makeEncryptionCode();

    status.textContent =
        "negotiating key...";

    bottom.textContent =
        directoryName +
        " / access request pending";


    /* SHOW SCREEN IMMEDIATELY */

    overlay.classList.add("active");


    /*
       CODE STARTS MOVING IMMEDIATELY
       BUT PROGRESS DOES NOT
    */

    const codeInterval =
        setInterval(function() {

            code.textContent =
                makeEncryptionCode();

        }, 100);



    /* =====================================
       WAIT 2 SECONDS BEFORE LOADING
    ===================================== */

    setTimeout(function() {


        let value = 0;


        const progressInterval =
            setInterval(function() {


                value++;


                progress.style.width =
                    value + "%";


                percent.textContent =
                    value + "%";



                /* 0 - 24% */

                if (value < 25) {

                    status.textContent =
                        "negotiating key...";

                }


                /* 25 - 49% */

                else if (value < 50) {

                    status.textContent =
                        "masking route...";

                }


                /* 50 - 74% */

                else if (value < 75) {

                    status.textContent =
                        "verifying access...";

                }


                /* 75 - 100% */

                else {

                    status.textContent =
                        "reconstructing path...";

                }



                /* OPEN PAGE */

                if (value >= 100) {


                    clearInterval(
                        progressInterval
                    );


                    clearInterval(
                        codeInterval
                    );


                    window.location.href =
                        destination;

                }


            }, 40);


    }, 2000);


}

</script>


</body>

</html>
