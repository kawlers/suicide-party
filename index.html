<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>suicideparty.com</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #000;

    font-family: "Courier New", monospace;
}


/* =========================================================
   FULL PAGE
========================================================= */

.site-frame {
    width: 100vw;
    min-height: 100vh;

    position: relative;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   ARTWORK BACKGROUND
========================================================= */

.artwork-bg {
    position: absolute;

    top: 0;
    left: 0;

    width: 72vw;
    height: 100vh;

    z-index: 0;

    background-image:
        url("SP-COVER-OFFICIAL-FINISHED(3).png");

    background-size: contain;

    background-repeat: no-repeat;

    background-position:
        left center;
}


/* FADE ART INTO RIGHT SIDE */

.artwork-bg::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,

            rgba(0,0,0,0.00) 0%,
            rgba(0,0,0,0.00) 55%,
            rgba(0,0,0,0.08) 68%,
            rgba(0,0,0,0.40) 85%,
            rgba(0,0,0,0.92) 100%
        );
}


/* =========================================================
   DARK RIGHT AREA
========================================================= */

.site-frame::before {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 46vw;
    height: 100%;

    z-index: 0;

    background:
        radial-gradient(
            circle at 35% 45%,
            rgba(54, 15, 96, 0.23),
            transparent 48%
        ),
        #020003;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        0 22px;

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    z-index: 20;

    border-bottom:
        1px solid rgba(105, 42, 160, 0.85);

    background:
        linear-gradient(
            180deg,
            rgba(44, 10, 80, 0.96),
            rgba(18, 2, 32, 0.93)
        );
}


/* SITE NAME */

.site-name {
    color: #e2d8e9;

    font-size: 17px;

    letter-spacing: 1px;

    text-shadow:
        0 1px 3px #000;
}


/* NAVIGATION */

.top-nav {
    display: flex;

    align-items: center;

    gap: 12px;

    font-size: 11px;
}

.top-nav a {
    color: #ae78d8;

    text-decoration: underline;

    cursor: pointer;
}

.top-nav a:hover {
    color: #fff;
}

.nav-separator {
    color: #68487d;
}


/* =========================================================
   CONNECTION BOX
========================================================= */

.connection-box {
    position: absolute;

    z-index: 10;

    top: 50%;
    right: 7.5%;

    transform:
        translateY(-43%);

    width: 500px;
    max-width: 34vw;

    min-height: 295px;

    padding:
        27px 28px;

    background:
        rgba(2, 0, 6, 0.91);

    border:
        1px solid #63319a;

    box-shadow:
        inset 0 0 26px rgba(69,20,118,0.10),
        0 0 22px rgba(0,0,0,0.55);
}


/* TITLE */

.connection-title {
    color: #9f65d5;

    font-size: 12px;

    margin-bottom: 19px;
}


/* DASHED LINE */

.system-line {
    width: 100%;

    height: 1px;

    margin-bottom: 19px;

    background:
        repeating-linear-gradient(
            90deg,
            #582582 0px,
            #582582 7px,
            transparent 7px,
            transparent 12px
        );
}


/* INFO */

.info-row {
    display: grid;

    grid-template-columns:
        120px 1fr;

    gap: 18px;

    margin-bottom: 10px;

    font-size: 11px;

    line-height: 1.4;
}

.info-label {
    color: #9966bd;
}

.info-value {
    color: #c7b8d0;
}


/* ROUTE */

#route {
    color: #cf001c;
}


/* ONLINE */

.online {
    color: #75d122;
}


/* =========================================================
   ENCRYPTION OVERLAY
========================================================= */

.encrypt-overlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,0.76);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.encrypt-overlay.active {
    opacity: 1;

    visibility: visible;
}


/* =========================================================
   ENCRYPTION PANEL
========================================================= */

.encrypt-panel {
    width: min(760px, 86vw);

    padding:
        38px 42px;

    background:
        rgba(2,0,5,0.97);

    border:
        1px solid #533071;

    box-shadow:
        0 0 45px rgba(0,0,0,0.88);

    opacity: 0;

    transform:
        translateY(16px)
        scale(0.97);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.encrypt-overlay.active
.encrypt-panel {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* ENCRYPTION TITLE */

.encrypt-title {
    color: #95849e;

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 26px;
}


/* CODE */

.encrypt-code {
    min-height: 110px;

    display: flex;

    align-items: center;

    padding:
        22px 8px;

    margin-bottom:
        26px;

    border-top:
        1px solid #322438;

    border-bottom:
        1px solid #322438;

    color: #c9001b;

    font-size:
        clamp(
            25px,
            4vw,
            43px
        );

    letter-spacing: 6px;

    white-space: nowrap;
}


/* STATUS */

.encrypt-status {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 12px;

    color: #8d808f;

    font-size: 10px;

    letter-spacing: 0.5px;
}


/* BAR */

.encrypt-bar {
    width: 100%;

    height: 5px;

    background: #120817;

    border:
        1px solid #25172b;

    overflow: hidden;
}

.encrypt-progress {
    width: 0%;

    height: 100%;

    background: #990018;

    transition:
        width 0.06s linear;
}


/* BOTTOM */

.encrypt-bottom {
    margin-top: 17px;

    color: #554c58;

    font-size: 9px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .artwork-bg {
        width: 100vw;
        height: 60vh;

        background-size: contain;

        background-position:
            center top;
    }


    .site-frame::before {
        width: 100vw;
        height: 100vh;

        background:
            linear-gradient(
                180deg,
                rgba(0,0,0,0.00) 0%,
                rgba(0,0,0,0.20) 45%,
                rgba(0,0,0,0.95) 75%
            );
    }


    .topbar {
        height: auto;

        min-height: 48px;

        padding:
            10px 12px;
    }


    .site-name {
        font-size: 12px;
    }


    .top-nav {
        gap: 6px;

        font-size: 9px;
    }


    .connection-box {
        top: auto;

        bottom: 24px;

        left: 50%;
        right: auto;

        transform:
            translateX(-50%);

        width: 88vw;
        max-width: none;

        min-height: auto;

        padding:
            22px 20px;
    }


    .info-row {
        grid-template-columns:
            100px 1fr;

        gap: 12px;

        font-size: 10px;
    }


    .encrypt-panel {
        width: 92vw;

        padding:
            28px 24px;
    }


    .encrypt-code {
        min-height: 90px;

        font-size:
            clamp(
                18px,
                6vw,
                31px
            );

        letter-spacing: 3px;
    }

}

</style>

</head>


<body>


<div class="site-frame">


    <!-- =====================================================
         ARTWORK
    ====================================================== -->

    <div class="artwork-bg">
    </div>



    <!-- =====================================================
         CONNECTION BOX
    ====================================================== -->

    <div class="connection-box">


        <div class="connection-title">

            your connection has been logged.

        </div>


        <div class="system-line">
        </div>



        <div class="info-row">

            <div class="info-label">
                session ID:
            </div>

            <div class="info-value">
                [unbound]
            </div>

        </div>



        <div class="info-row">

            <div class="info-label">
                route:
            </div>

            <div
                class="info-value"
                id="route"
            >
                192.168.---.---
            </div>

        </div>



        <div class="info-row">

            <div class="info-label">
                time:
            </div>

            <div
                class="info-value"
                id="time"
            >
                --:--:-- --
            </div>

        </div>



        <div class="info-row">

            <div class="info-label">
            </div>

            <div class="info-value">
                unknown client
            </div>

        </div>



        <div
            class="system-line"
            style="margin-top:20px;"
        >
        </div>



        <div class="info-row">

            <div class="info-label">
                connection status:
            </div>

            <div class="info-value online">
                online
            </div>

        </div>


    </div>



    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">


        <div class="site-name">

            suicideparty.com

        </div>


        <div class="top-nav">


            <a href="index.html">
                home
            </a>


            <span class="nav-separator">
                |
            </span>


            <a
                onclick="
                    openEncryptedPage(
                        'archive.html',
                        'FILE DIRECTORY'
                    )
                "
            >
                files
            </a>


            <span class="nav-separator">
                |
            </span>


            <a
                onclick="
                    openEncryptedPage(
                        'audio.html',
                        'AUDIO DIRECTORY'
                    )
                "
            >
                audio files
            </a>


        </div>


    </div>


</div>



<!-- =========================================================
     ENCRYPTION OVERLAY
========================================================= -->

<div
    id="encryptOverlay"
    class="encrypt-overlay"
>


    <div class="encrypt-panel">


        <div class="encrypt-title">

            establishing channel

        </div>


        <div
            id="encryptCode"
            class="encrypt-code"
        >

            0000 0000 0000 0000

        </div>


        <div class="encrypt-status">


            <span id="encryptStatus">
                negotiating key...
            </span>


            <span id="encryptPercent">
                0%
            </span>


        </div>


        <div class="encrypt-bar">


            <div
                id="encryptProgress"
                class="encrypt-progress"
            >
            </div>


        </div>


        <div
            id="encryptBottom"
            class="encrypt-bottom"
        >

            access request pending

        </div>


    </div>


</div>



<script>


/* =========================================================
   LIVE 12-HOUR CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );

    const ampm =
        hours >= 12
        ? "PM"
        : "AM";

    hours =
        hours % 12;

    hours =
        hours
        ? hours
        : 12;


    document
        .getElementById(
            "time"
        )
        .textContent =

        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm;

}



/* =========================================================
   FAKE CHANGING ROUTE
========================================================= */

function updateRoute() {

    const part1 =
        Math.floor(
            Math.random() * 256
        );

    const part2 =
        Math.floor(
            Math.random() * 256
        );

    const part3 =
        Math.floor(
            Math.random() * 256
        );

    const part4 =
        Math.floor(
            Math.random() * 256
        );


    document
        .getElementById(
            "route"
        )
        .textContent =

        part1 +
        "." +
        part2 +
        "." +
        part3 +
        "." +
        part4;

}


updateClock();

updateRoute();


setInterval(
    updateClock,
    1000
);


setInterval(
    updateRoute,
    350
);



/* =========================================================
   16 CHARACTER CODE
========================================================= */

function makeEncryptionCode() {

    const characters =
        "0123456789ABCDEF";

    let output =
        "";


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        output +=
            characters[
                Math.floor(
                    Math.random()
                    *
                    characters.length
                )
            ];


        if (
            (i + 1) % 4 === 0
            &&
            i < 15
        ) {

            output +=
                " ";

        }

    }


    return output;

}



/* =========================================================
   DIRECTORY TRANSITION
========================================================= */

function openEncryptedPage(
    destination,
    directoryName
) {

    const overlay =
        document.getElementById(
            "encryptOverlay"
        );

    const code =
        document.getElementById(
            "encryptCode"
        );

    const progress =
        document.getElementById(
            "encryptProgress"
        );

    const percent =
        document.getElementById(
            "encryptPercent"
        );

    const status =
        document.getElementById(
            "encryptStatus"
        );

    const bottom =
        document.getElementById(
            "encryptBottom"
        );


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    code.textContent =
        makeEncryptionCode();


    status.textContent =
        "negotiating key...";


    bottom.textContent =
        directoryName +
        " / access request pending";


    overlay
        .classList
        .add(
            "active"
        );


    const codeInterval =

        setInterval(
            function() {

                code.textContent =
                    makeEncryptionCode();

            },
            100
        );


    /* WAIT 2 SECONDS */

    setTimeout(
        function() {

            let value =
                0;


            /* THEN ~4 SECOND LOAD */

            const progressInterval =

                setInterval(
                    function() {

                        value++;


                        progress
                            .style
                            .width =

                            value +
                            "%";


                        percent
                            .textContent =

                            value +
                            "%";


                        if (
                            value < 25
                        ) {

                            status.textContent =
                                "negotiating key...";

                        }

                        else if (
                            value < 50
                        ) {

                            status.textContent =
                                "searching for path...";

                        }

                        else if (
                            value < 75
                        ) {

                            status.textContent =
                                "binding client...";

                        }

                        else {

                            status.textContent =
                                "path found...";

                        }


                        if (
                            value >= 100
                        ) {

                            clearInterval(
                                progressInterval
                            );


                            clearInterval(
                                codeInterval
                            );


                            window.location.href =
                                destination;

                        }


                    },
                    40
                );


        },
        2000
    );

}

</script>


</body>

</html>
