<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================
   PAGE
========================================= */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0 80px;
}


/* =========================================
   BACK
========================================= */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* =========================================
   DIRECTORY HEADER
========================================= */

.directory-header {
    margin-top: 48px;
    margin-bottom: 32px;
}

.directory-path {
    display: inline-block;

    color: #d00000;

    border: 1px solid #520000;

    padding: 8px 16px;

    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 24px;
}

.section-title {
    color: #666;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================
   DIRECTORY
========================================= */

.directory-list {
    width: 100%;

    margin-top: 18px;

    border-top: 1px solid #1d1d1d;
}


/* =========================================
   FILE ROW
========================================= */

.directory-file {
    display: flex;

    align-items: center;

    gap: 14px;

    min-height: 46px;

    padding: 0 8px;

    border-bottom: 1px solid #161616;

    color: #999;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease,
        background 0.15s ease;
}

.directory-file:hover {
    color: #fff;

    padding-left: 14px;

    background: rgba(120, 0, 0, 0.04);
}


/* =========================================
   FILE SYMBOL
========================================= */

.file-icon {
    color: #666;

    width: 18px;

    font-size: 15px;

    text-align: center;

    flex-shrink: 0;
}


/* =========================================
   NUMBER
========================================= */

.number {
    display: inline-block;

    width: 28px;

    color: #d00000;

    margin-right: 8px;
}


/* =========================================
   FILE NAME
========================================= */

.file-name {
    white-space: nowrap;
}


/* =========================================
   EMPTY FILES
========================================= */

.directory-file.empty {
    color: #333;

    cursor: default;
}

.directory-file.empty .number {
    color: #650000;
}

.directory-file.empty .file-icon {
    color: #292929;
}

.directory-file.empty:hover {
    color: #333;

    padding-left: 8px;

    background: none;
}


/* =========================================
   VIDEO OVERLAY
========================================= */

.video-overlay {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.75);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}

.video-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================
   VIDEO WINDOW
========================================= */

.video-window {
    position: relative;

    width: 1000px;

    max-width: 90vw;

    opacity: 0;

    transform:
        translateX(80px)
        scale(0.96);

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

.video-overlay.active .video-window {
    opacity: 1;

    transform:
        translateX(0)
        scale(1);
}


/* =========================================
   CLOSE
========================================= */

.close-video {
    position: absolute;

    top: -32px;
    right: 0;

    padding: 0;

    border: none;

    background: none;

    color: #888;

    font-family: "Courier New", monospace;

    font-size: 24px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}


/* =========================================
   LOADING SCREEN
========================================= */

.loading-screen {
    width: 100%;
    height: 180px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 30px;

    background: #000;

    border: 1px solid #333;
}

.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* =========================================
   LOADING BAR
========================================= */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #222;

    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;

    background: #b00000;
}

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}


/* =========================================
   VIDEO
========================================= */

#videoPlayer {
    display: none;

    width: 100%;

    max-height: 72vh;

    background: #000;

    border: 1px solid #333;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .page {
        width: 90%;

        padding-top: 28px;
    }

    .directory-header {
        margin-top: 35px;
    }

    .directory-file {
        font-size: 11px;

        gap: 8px;
    }

    .directory-path {
        font-size: 16px;
    }

    .number {
        width: 24px;

        margin-right: 4px;
    }

    .video-window {
        width: 90vw;

        max-width: 90vw;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- BACK -->

    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>



    <!-- HEADER -->

    <div class="directory-header">


        <div class="directory-path">
            /files
        </div>


        <div class="section-title">
            video files (.mp4)
        </div>


    </div>



    <!-- FILE LIST -->

    <div class="directory-list">


        <!-- 01 -->

        <div
            class="directory-file"
            onclick="openVideo('purge-xtra2k25.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">01</span>
                purge-xtra2k25.mp4
            </span>

        </div>



        <!-- 02 -->

        <div
            class="directory-file"
            onclick="openVideo('scenebitch-lcut.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">02</span>
                scenebitch-lcut.mp4
            </span>

        </div>



        <!-- 03 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">03</span>
                ------
            </span>

        </div>



        <!-- 04 -->

        <div
            class="directory-file"
            onclick="openVideo('untitled_04.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">04</span>
                untitled_04.mp4
            </span>

        </div>



        <!-- 05 -->

        <div
            class="directory-file"
            onclick="openVideo('sp_005.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">05</span>
                sp_005.mp4
            </span>

        </div>



        <!-- 06 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">06</span>
                ------
            </span>

        </div>



        <!-- 07 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">07</span>
                ------
            </span>

        </div>



        <!-- 08 -->

        <div
            class="directory-file"
            onclick="openVideo('957229577.mp4', true)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">
                <span class="number">08</span>
                957229577.mp4
            </span>

        </div>


    </div>


</div>



<!-- =========================================
     VIDEO OVERLAY
========================================= -->

<div
    id="videoOverlay"
    class="video-overlay"
    onclick="backgroundClose(event)"
>


    <div class="video-window">


        <button
            class="close-video"
            onclick="closeVideo()"
        >
            ×
        </button>



        <!-- LOADING -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >


            <div
                id="loadingText"
                class="loading-text"
            >
                loading file...
            </div>


            <div class="loading-bar">

                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>

            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>


        </div>



        <!-- VIDEO -->

        <video
            id="videoPlayer"
            controls
            preload="metadata"
        >

            <source
                id="videoSource"
                src=""
                type="video/mp4"
            >

            your browser does not support video playback.

        </video>


    </div>


</div>



<script>


let loadingInterval;
let stallTimeout;


/* =========================================
   OPEN VIDEO
========================================= */

function openVideo(
    fileName,
    shouldStall
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );



    /* RESET */

    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    video.pause();


    source.src =
        fileName;


    video.load();


    video.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "loading file...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";



    overlay.classList.add(
        "active"
    );


    let value = 0;

    let hasStalled = false;



    /* =====================================
       LOAD
    ===================================== */

    loadingInterval =

        setInterval(function() {


            value++;


            progress.style.width =
                value + "%";


            percent.textContent =
                value + "%";



            /* =================================
               FILE 08 STALL
            ================================= */

            if (
                shouldStall === true
                &&
                value === 82
                &&
                hasStalled === false
            ) {


                hasStalled =
                    true;


                clearInterval(
                    loadingInterval
                );


                stallTimeout =

                    setTimeout(function() {


                        loadingInterval =

                            setInterval(function() {


                                value++;


                                progress.style.width =
                                    value + "%";


                                percent.textContent =
                                    value + "%";


                                if (
                                    value >= 100
                                ) {


                                    clearInterval(
                                        loadingInterval
                                    );


                                    showVideo();


                                }


                            }, 20);


                    }, 2000);


                return;


            }



            if (
                value >= 100
            ) {


                clearInterval(
                    loadingInterval
                );


                showVideo();


            }


        }, 20);


}



/* =========================================
   SHOW VIDEO
========================================= */

function showVideo() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    setTimeout(function() {


        loadingScreen.style.display =
            "none";


        video.style.display =
            "block";


        video.play();


    }, 100);


}



/* =========================================
   CLOSE VIDEO
========================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    overlay.classList.remove(
        "active"
    );


    video.pause();


}



/* =========================================
   BACKGROUND CLOSE
========================================= */

function backgroundClose(event) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {


        closeVideo();


    }


}



/* =========================================
   ESC CLOSE
========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeVideo();


        }


    }
);


</script>


</body>

</html>
