<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0 80px;
}


/* =========================================================
   BACK
========================================================= */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* =========================================================
   DIRECTORY HEADER
========================================================= */

.directory-header {
    margin-top: 48px;
    margin-bottom: 32px;
}

.directory-path {
    display: inline-block;

    color: #d00000;

    border: 1px solid #520000;

    padding: 8px 16px;

    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 24px;
}

.section-title {
    color: #666;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================================
   DIRECTORY LIST
========================================================= */

.directory-list {
    width: 100%;
    margin-top: 18px;
    border-top: 1px solid #1d1d1d;
}


/* =========================================================
   FILE ROW
========================================================= */

.directory-file {
    display: flex;
    align-items: center;
    gap: 14px;

    min-height: 46px;

    padding: 0 8px;

    border-bottom: 1px solid #161616;

    color: #999;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease,
        background 0.15s ease;
}

.directory-file:hover {
    color: #fff;

    padding-left: 14px;

    background: rgba(120, 0, 0, 0.04);
}


/* =========================================================
   FILE SYMBOL
========================================================= */

.file-icon {
    color: #666;

    width: 18px;

    font-size: 15px;

    text-align: center;

    flex-shrink: 0;
}


/* =========================================================
   NUMBER
========================================================= */

.number {
    display: inline-block;

    width: 28px;

    color: #d00000;

    margin-right: 8px;
}


/* =========================================================
   FILE NAME
========================================================= */

.file-name {
    white-space: nowrap;
}


/* =========================================================
   EMPTY FILES
========================================================= */

.directory-file.empty {
    color: #333;
    cursor: default;
}

.directory-file.empty .number {
    color: #650000;
}

.directory-file.empty .file-icon {
    color: #292929;
}

.directory-file.empty:hover {
    color: #333;
    padding-left: 8px;
    background: none;
}


/* =========================================================
   VIDEO OVERLAY
========================================================= */

.video-overlay {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.9);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.22s ease,
        visibility 0.22s ease;
}

.video-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   VIDEO WINDOW
========================================================= */

.video-window {
    position: relative;

    width: 1000px;
    max-width: 92vw;

    opacity: 0;

    transform:
        translateY(12px)
        scale(0.985);

    transition:
        transform 0.22s ease,
        opacity 0.22s ease;
}

.video-overlay.active .video-window {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   CLOSE
========================================================= */

.close-video {
    position: absolute;

    top: -34px;
    right: 0;

    padding: 0;

    border: none;
    background: none;

    color: #777;

    font-family: "Courier New", monospace;
    font-size: 22px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen {
    width: 100%;
    height: 180px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 30px;

    background: #000;

    border: 1px solid #2b2b2b;
}

.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* =========================================================
   LOADING BAR
========================================================= */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #1a1a1a;

    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;

    background: #a00000;
}

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}


/* =========================================================
   STYLE D — QUICKTIME 6 INSPIRED
========================================================= */

.retro-player {
    display: none;

    width: 100%;

    padding: 8px 8px 10px;

    background:
        linear-gradient(
            to bottom,
            #f5f5f5 0%,
            #dadada 45%,
            #c3c3c3 100%
        );

    border-top: 2px solid #ffffff;
    border-left: 2px solid #eeeeee;

    border-right: 2px solid #777;
    border-bottom: 2px solid #666;

    border-radius: 10px;

    box-shadow:
        0 0 0 1px #444,
        0 10px 30px rgba(0,0,0,0.75);
}


/* =========================================================
   VIDEO SCREEN
========================================================= */

.player-screen {
    position: relative;

    width: 100%;

    overflow: hidden;

    background: #000;

    border-top: 3px solid #555;
    border-left: 3px solid #555;

    border-right: 2px solid #fafafa;
    border-bottom: 2px solid #fafafa;

    border-radius: 4px;
}

#videoPlayer {
    display: block;

    width: 100%;

    max-height: 72vh;

    background: #000;
}


/* =========================================================
   CONTROL BAR
========================================================= */

.player-controls {
    min-height: 68px;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 10px 12px 2px;

    background:
        linear-gradient(
            to bottom,
            #eeeeee,
            #cfcfcf
        );
}


/* =========================================================
   PLAY / PAUSE BUTTON
========================================================= */

.toggle-button {
    width: 54px;
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    padding: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #eeeeee 30%,
            #c8c8c8 70%,
            #aaa 100%
        );

    border: 2px solid #777;

    box-shadow:
        inset 0 0 0 1px #fff,
        0 1px 2px rgba(0,0,0,0.35);

    cursor: pointer;
}

.toggle-button:hover {
    filter: brightness(1.04);
}

.toggle-button:active {
    background:
        radial-gradient(
            circle at 50% 60%,
            #bcbcbc 0%,
            #d5d5d5 65%,
            #eee 100%
        );
}


/* PLAY SYMBOL */

.play-symbol {
    width: 0;
    height: 0;

    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;

    border-left: 13px solid #333;

    margin-left: 3px;
}


/* PAUSE SYMBOL */

.pause-symbol {
    display: none;

    gap: 4px;
}

.pause-symbol span {
    width: 5px;
    height: 17px;

    background: #333;
}


/* =========================================================
   SEEK BAR
========================================================= */

.timeline-area {
    flex: 1;

    min-width: 0;

    display: flex;
    align-items: center;
}

#seekBar {
    width: 100%;

    appearance: none;
    -webkit-appearance: none;

    height: 12px;

    border-radius: 7px;

    background:
        linear-gradient(
            to bottom,
            #9e9e9e,
            #d8d8d8
        );

    border-top: 1px solid #888;
    border-left: 1px solid #999;

    border-right: 1px solid #eee;
    border-bottom: 1px solid #eee;

    box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.25);

    cursor: pointer;
}


/* SEEK THUMB */

#seekBar::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 17px;
    height: 27px;

    border-radius: 5px;

    background:
        linear-gradient(
            to right,
            #aaa,
            #f5f5f5,
            #aaa
        );

    border: 1px solid #777;

    box-shadow:
        inset 0 0 0 1px #eee,
        0 1px 2px rgba(0,0,0,0.35);

    cursor: pointer;
}

#seekBar::-moz-range-thumb {
    width: 15px;
    height: 25px;

    border-radius: 5px;

    background:
        linear-gradient(
            to right,
            #aaa,
            #f5f5f5,
            #aaa
        );

    border: 1px solid #777;

    box-shadow:
        inset 0 0 0 1px #eee,
        0 1px 2px rgba(0,0,0,0.35);

    cursor: pointer;
}


/* =========================================================
   VOLUME BUTTON
========================================================= */

.volume-button {
    position: relative;

    width: 54px;
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    padding: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #eeeeee 30%,
            #c8c8c8 70%,
            #aaa 100%
        );

    border: 2px solid #777;

    box-shadow:
        inset 0 0 0 1px #fff,
        0 1px 2px rgba(0,0,0,0.35);

    cursor: pointer;
}

.volume-button:hover {
    filter: brightness(1.04);
}


/* SPEAKER */

.speaker-icon {
    position: relative;

    width: 22px;
    height: 18px;
}

.speaker-icon::before {
    content: "";

    position: absolute;

    left: 0;
    top: 6px;

    width: 7px;
    height: 7px;

    background: #333;
}

.speaker-icon::after {
    content: "";

    position: absolute;

    left: 6px;
    top: 3px;

    width: 0;
    height: 0;

    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;

    border-right: 9px solid #333;
}


/* WAVES */

.wave-one {
    position: absolute;

    right: 1px;
    top: 5px;

    width: 7px;
    height: 9px;

    border-right: 2px solid #333;

    border-radius: 50%;
}

.wave-two {
    position: absolute;

    right: -4px;
    top: 2px;

    width: 10px;
    height: 15px;

    border-right: 2px solid #333;

    border-radius: 50%;
}


/* =========================================================
   VOLUME STATES
========================================================= */

.volume-button.medium .wave-two {
    display: none;
}

.volume-button.low .wave-two {
    display: none;
}

.volume-button.low .wave-one {
    opacity: 0.4;
}

.volume-button.muted .wave-one,
.volume-button.muted .wave-two {
    display: none;
}

.volume-button.muted .speaker-icon {
    opacity: 0.35;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .page {
        width: 90%;
        padding-top: 28px;
    }

    .directory-header {
        margin-top: 35px;
    }

    .directory-file {
        font-size: 11px;
        gap: 8px;
    }

    .directory-path {
        font-size: 16px;
    }

    .number {
        width: 24px;
        margin-right: 4px;
    }

    .video-window {
        width: 94vw;
        max-width: 94vw;
    }

    .player-controls {
        gap: 9px;
        padding-left: 8px;
        padding-right: 8px;
    }

    .toggle-button,
    .volume-button {
        width: 44px;
        height: 44px;
    }

}

</style>

</head>


<body>


<div class="page">


    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>



    <div class="directory-header">

        <div class="directory-path">
            /files
        </div>

        <div class="section-title">
            video files (.mp4)
        </div>

    </div>



    <div class="directory-list">


        <!-- 01 -->

        <div
            class="directory-file"
            onclick="openVideo('purge-xtra2k25.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">01</span>

                purge-xtra2k25.mp4

            </span>

        </div>



        <!-- 02 -->

        <div
            class="directory-file"
            onclick="openVideo('scenebitch-lcut.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">02</span>

                scenebitch-lcut.mp4

            </span>

        </div>



        <!-- 03 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">03</span>

                ------

            </span>

        </div>



        <!-- 04 -->

        <div
            class="directory-file"
            onclick="openVideo('untitled_04.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">04</span>

                untitled_04.mp4

            </span>

        </div>



        <!-- 05 -->

        <div
            class="directory-file"
            onclick="openVideo('sp_005.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">05</span>

                sp_005.mp4

            </span>

        </div>



        <!-- 06 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">06</span>

                ------

            </span>

        </div>



        <!-- 07 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">07</span>

                ------

            </span>

        </div>



        <!-- 08 -->

        <div
            class="directory-file"
            onclick="openVideo('957229577.mp4', true)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">08</span>

                957229577.mp4

            </span>

        </div>


    </div>


</div>



<!-- =========================================================
     VIDEO OVERLAY
========================================================= -->

<div
    id="videoOverlay"
    class="video-overlay"
    onclick="backgroundClose(event)"
>


    <div class="video-window">


        <button
            class="close-video"
            onclick="closeVideo()"
        >
            ×
        </button>



        <!-- LOADING -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >


            <div
                id="loadingText"
                class="loading-text"
            >
                loading file...
            </div>


            <div class="loading-bar">

                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>

            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>


        </div>



        <!-- QUICKTIME STYLE PLAYER -->

        <div
            id="retroPlayer"
            class="retro-player"
        >


            <div
                class="player-screen"
                onclick="togglePlay()"
            >


                <video
                    id="videoPlayer"
                    preload="metadata"
                >

                    <source
                        id="videoSource"
                        src=""
                        type="video/mp4"
                    >

                </video>


            </div>



            <div class="player-controls">


                <!-- PLAY / PAUSE -->

                <button
                    id="playPauseButton"
                    class="toggle-button"
                    onclick="togglePlay()"
                >


                    <span
                        id="playIcon"
                        class="play-symbol"
                    ></span>


                    <span
                        id="pauseIcon"
                        class="pause-symbol"
                    >

                        <span></span>
                        <span></span>

                    </span>


                </button>



                <!-- SEEK -->

                <div class="timeline-area">


                    <input
                        id="seekBar"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                    >


                </div>



                <!-- VOLUME -->

                <button
                    id="volumeButton"
                    class="volume-button"
                    onclick="cycleVolume()"
                >


                    <span class="speaker-icon">

                        <span class="wave-one"></span>

                        <span class="wave-two"></span>

                    </span>


                </button>


            </div>


        </div>


    </div>


</div>



<script>


let loadingInterval;
let stallTimeout;


const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const seekBar =
    document.getElementById(
        "seekBar"
    );


const volumeButton =
    document.getElementById(
        "volumeButton"
    );


let volumeState =
    0;


/* =========================================================
   OPEN VIDEO
========================================================= */

function openVideo(
    fileName,
    shouldStall
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const retroPlayer =
        document.getElementById(
            "retroPlayer"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    source.src =
        fileName;


    videoPlayer.load();


    seekBar.value =
        0;


    volumeState =
        0;


    setVolumeState();


    updatePlayPauseIcon();


    retroPlayer.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "loading file...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    overlay.classList.add(
        "active"
    );


    let value =
        0;


    let hasStalled =
        false;


    loadingInterval =

        setInterval(function() {


            value++;


            progress.style.width =
                value + "%";


            percent.textContent =
                value + "%";


            /* FILE 08 STALL */

            if (
                shouldStall === true
                &&
                value === 82
                &&
                hasStalled === false
            ) {


                hasStalled =
                    true;


                clearInterval(
                    loadingInterval
                );


                stallTimeout =

                    setTimeout(function() {


                        loadingInterval =

                            setInterval(function() {


                                value++;


                                progress.style.width =
                                    value + "%";


                                percent.textContent =
                                    value + "%";


                                if (
                                    value >= 100
                                ) {


                                    clearInterval(
                                        loadingInterval
                                    );


                                    showVideoPlayer();


                                }


                            }, 20);


                    }, 2000);


                return;


            }


            if (
                value >= 100
            ) {


                clearInterval(
                    loadingInterval
                );


                showVideoPlayer();


            }


        }, 20);


}



/* =========================================================
   SHOW PLAYER
========================================================= */

function showVideoPlayer() {


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const retroPlayer =
        document.getElementById(
            "retroPlayer"
        );


    setTimeout(function() {


        loadingScreen.style.display =
            "none";


        retroPlayer.style.display =
            "block";


        videoPlayer.play();


    }, 100);


}



/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {


    if (
        videoPlayer.paused
    ) {


        videoPlayer.play();


    }


    else {


        videoPlayer.pause();


    }


}



/* =========================================================
   PLAY / PAUSE ICON
========================================================= */

function updatePlayPauseIcon() {


    const playIcon =
        document.getElementById(
            "playIcon"
        );


    const pauseIcon =
        document.getElementById(
            "pauseIcon"
        );


    if (
        videoPlayer.paused
    ) {


        playIcon.style.display =
            "block";


        pauseIcon.style.display =
            "none";


    }


    else {


        playIcon.style.display =
            "none";


        pauseIcon.style.display =
            "flex";


    }


}


videoPlayer.addEventListener(
    "play",
    updatePlayPauseIcon
);


videoPlayer.addEventListener(
    "pause",
    updatePlayPauseIcon
);


videoPlayer.addEventListener(
    "ended",
    updatePlayPauseIcon
);



/* =========================================================
   SEEK UPDATE
========================================================= */

videoPlayer.addEventListener(
    "timeupdate",
    function() {


        if (
            Number.isFinite(
                videoPlayer.duration
            )
            &&
            videoPlayer.duration > 0
        ) {


            seekBar.value =

                (
                    videoPlayer.currentTime
                    /
                    videoPlayer.duration
                )

                *
                100;


        }


    }
);



/* =========================================================
   SEEK CONTROL
========================================================= */

seekBar.addEventListener(
    "input",
    function() {


        if (
            Number.isFinite(
                videoPlayer.duration
            )
        ) {


            videoPlayer.currentTime =

                (
                    Number(
                        seekBar.value
                    )
                    /
                    100
                )

                *
                videoPlayer.duration;


        }


    }
);



/* =========================================================
   VOLUME CYCLE

   100
   70
   35
   MUTE
========================================================= */

function cycleVolume() {


    volumeState++;


    if (
        volumeState > 3
    ) {


        volumeState =
            0;


    }


    setVolumeState();


}



/* =========================================================
   APPLY VOLUME
========================================================= */

function setVolumeState() {


    volumeButton.classList.remove(
        "medium",
        "low",
        "muted"
    );


    /* 100% */

    if (
        volumeState === 0
    ) {


        videoPlayer.muted =
            false;


        videoPlayer.volume =
            1;


    }


    /* 70% */

    else if (
        volumeState === 1
    ) {


        videoPlayer.muted =
            false;


        videoPlayer.volume =
            0.7;


        volumeButton.classList.add(
            "medium"
        );


    }


    /* 35% */

    else if (
        volumeState === 2
    ) {


        videoPlayer.muted =
            false;


        videoPlayer.volume =
            0.35;


        volumeButton.classList.add(
            "low"
        );


    }


    /* MUTE */

    else {


        videoPlayer.muted =
            true;


        volumeButton.classList.add(
            "muted"
        );


    }


}



/* =========================================================
   CLOSE
========================================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    overlay.classList.remove(
        "active"
    );


}



/* =========================================================
   BACKGROUND CLOSE
========================================================= */

function backgroundClose(
    event
) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {


        closeVideo();


    }


}



/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeVideo();


        }


    }
);
