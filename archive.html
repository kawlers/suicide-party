<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0 80px;
}


/* =========================================================
   BACK
========================================================= */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* =========================================================
   DIRECTORY HEADER
========================================================= */

.directory-header {
    margin-top: 48px;
    margin-bottom: 32px;
}

.directory-path {
    display: inline-block;

    color: #d00000;

    border: 1px solid #520000;

    padding: 8px 16px;

    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 24px;
}

.section-title {
    color: #666;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================================
   DIRECTORY LIST
========================================================= */

.directory-list {
    width: 100%;

    margin-top: 18px;

    border-top: 1px solid #1d1d1d;
}


/* =========================================================
   FILE ROW
========================================================= */

.directory-file {
    display: flex;

    align-items: center;

    gap: 14px;

    min-height: 46px;

    padding: 0 8px;

    border-bottom: 1px solid #161616;

    color: #999;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease,
        background 0.15s ease;
}

.directory-file:hover {
    color: #fff;

    padding-left: 14px;

    background: rgba(120, 0, 0, 0.04);
}


/* =========================================================
   FILE SYMBOL
========================================================= */

.file-icon {
    color: #666;

    width: 18px;

    font-size: 15px;

    text-align: center;

    flex-shrink: 0;
}


/* =========================================================
   NUMBER
========================================================= */

.number {
    display: inline-block;

    width: 28px;

    color: #d00000;

    margin-right: 8px;
}


/* =========================================================
   FILE NAME
========================================================= */

.file-name {
    white-space: nowrap;
}


/* =========================================================
   EMPTY FILES
========================================================= */

.directory-file.empty {
    color: #333;

    cursor: default;
}

.directory-file.empty .number {
    color: #650000;
}

.directory-file.empty .file-icon {
    color: #292929;
}

.directory-file.empty:hover {
    color: #333;

    padding-left: 8px;

    background: none;
}


/* =========================================================
   VIDEO OVERLAY
========================================================= */

.video-overlay {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.82);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.22s ease,
        visibility 0.22s ease;
}

.video-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   WINDOW WRAPPER
========================================================= */

.video-window {
    position: relative;

    width: 1000px;

    max-width: 92vw;

    opacity: 0;

    transform:
        translateY(18px)
        scale(0.97);

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}

.video-overlay.active .video-window {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   CLOSE
========================================================= */

.close-video {
    position: absolute;

    top: -32px;
    right: 0;

    padding: 0;

    border: none;
    background: none;

    color: #777;

    font-family: "Courier New", monospace;

    font-size: 22px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen {
    width: 100%;
    height: 180px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 30px;

    background: #000;

    border:
        1px solid #333;
}

.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* =========================================================
   LOADING BAR
========================================================= */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #222;

    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;

    background: #b00000;
}

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}


/* =========================================================
   2000s PLAYER SHELL
========================================================= */

.retro-player {
    display: none;

    width: 100%;

    background: #292929;

    border-top: 2px solid #666;
    border-left: 2px solid #555;

    border-right: 2px solid #111;
    border-bottom: 2px solid #111;

    box-shadow:
        0 0 0 1px #000,
        0 8px 30px rgba(0, 0, 0, 0.8);
}


/* =========================================================
   TITLE BAR
========================================================= */

.player-titlebar {
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 8px;

    background:
        linear-gradient(
            to bottom,
            #3c3c3c,
            #242424
        );

    border-bottom: 1px solid #080808;

    color: #aaa;

    font-size: 10px;

    letter-spacing: 0.5px;
}

.player-title {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.player-window-buttons {
    display: flex;

    gap: 4px;
}

.fake-window-button {
    width: 12px;
    height: 11px;

    background: #333;

    border-top: 1px solid #777;
    border-left: 1px solid #666;

    border-right: 1px solid #111;
    border-bottom: 1px solid #111;
}


/* =========================================================
   VIDEO SCREEN
========================================================= */

.player-screen {
    position: relative;

    width: 100%;

    background: #000;

    border:
        4px solid #181818;
}

#videoPlayer {
    display: block;

    width: 100%;

    max-height: 72vh;

    background: #000;
}


/* SUBTLE OLD DISPLAY SCANLINES */

.player-screen::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.012) 0px,
            rgba(255, 255, 255, 0.012) 1px,
            rgba(0, 0, 0, 0.025) 1px,
            rgba(0, 0, 0, 0.025) 3px
        );
}


/* =========================================================
   CONTROL PANEL
========================================================= */

.player-controls {
    min-height: 64px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 9px 10px;

    background:
        linear-gradient(
            to bottom,
            #444,
            #292929
        );

    border-top: 1px solid #666;
}


/* =========================================================
   OLD BUTTONS
========================================================= */

.retro-button {
    width: 38px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    padding: 0;

    color: #111;

    background: #888;

    border-top: 2px solid #bbb;
    border-left: 2px solid #aaa;

    border-right: 2px solid #333;
    border-bottom: 2px solid #333;

    font-family: Arial, sans-serif;

    font-size: 15px;

    cursor: pointer;
}

.retro-button:active {
    border-top:
        2px solid #333;

    border-left:
        2px solid #333;

    border-right:
        2px solid #aaa;

    border-bottom:
        2px solid #aaa;

    transform:
        translate(1px, 1px);
}


/* PLAY TRIANGLE */

.play-symbol {
    width: 0;
    height: 0;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-left:
        11px solid #111;

    margin-left: 2px;
}


/* PAUSE */

.pause-symbol {
    display: flex;

    gap: 3px;
}

.pause-symbol span {
    width: 4px;
    height: 14px;

    background: #111;
}


/* STOP */

.stop-symbol {
    width: 12px;
    height: 12px;

    background: #111;
}


/* =========================================================
   TIMELINE AREA
========================================================= */

.timeline-area {
    flex: 1;

    min-width: 0;

    display: flex;

    align-items: center;

    gap: 10px;

    margin-left: 5px;
}


/* CUSTOM RANGE */

#seekBar {
    flex: 1;

    min-width: 80px;

    appearance: none;
    -webkit-appearance: none;

    height: 14px;

    background: #151515;

    border-top: 2px solid #080808;
    border-left: 2px solid #080808;

    border-right: 1px solid #666;
    border-bottom: 1px solid #666;

    cursor: pointer;
}


/* CHROME / EDGE */

#seekBar::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 12px;
    height: 20px;

    background: #888;

    border-top: 2px solid #bbb;
    border-left: 2px solid #aaa;

    border-right: 2px solid #333;
    border-bottom: 2px solid #333;

    cursor: pointer;
}


/* FIREFOX */

#seekBar::-moz-range-thumb {
    width: 10px;
    height: 18px;

    border-radius: 0;

    background: #888;

    border-top: 2px solid #bbb;
    border-left: 2px solid #aaa;

    border-right: 2px solid #333;
    border-bottom: 2px solid #333;

    cursor: pointer;
}


/* =========================================================
   TIME DISPLAY
========================================================= */

.player-time {
    flex-shrink: 0;

    min-width: 105px;

    padding: 7px 8px;

    background: #080808;

    border-top: 2px solid #000;
    border-left: 2px solid #000;

    border-right: 1px solid #555;
    border-bottom: 1px solid #555;

    color: #aaa;

    font-family: "Courier New", monospace;

    font-size: 11px;

    text-align: center;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .page {
        width: 90%;

        padding-top: 28px;
    }

    .directory-header {
        margin-top: 35px;
    }

    .directory-file {
        font-size: 11px;

        gap: 8px;
    }

    .directory-path {
        font-size: 16px;
    }

    .number {
        width: 24px;

        margin-right: 4px;
    }

    .video-window {
        width: 94vw;

        max-width: 94vw;
    }

    .player-controls {
        gap: 5px;

        padding:
            7px 6px;
    }

    .retro-button {
        width: 31px;
        height: 29px;
    }

    .player-time {
        min-width: 85px;

        font-size: 9px;

        padding:
            6px 4px;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- BACK -->

    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>



    <!-- HEADER -->

    <div class="directory-header">


        <div class="directory-path">
            /files
        </div>


        <div class="section-title">
            video files (.mp4)
        </div>


    </div>



    <!-- FILE LIST -->

    <div class="directory-list">


        <!-- 01 -->

        <div
            class="directory-file"
            onclick="openVideo(
                'purge-xtra2k25.mp4',
                false
            )"
        >

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    01
                </span>

                purge-xtra2k25.mp4

            </span>

        </div>



        <!-- 02 -->

        <div
            class="directory-file"
            onclick="openVideo(
                'scenebitch-lcut.mp4',
                false
            )"
        >

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    02
                </span>

                scenebitch-lcut.mp4

            </span>

        </div>



        <!-- 03 -->

        <div class="directory-file empty">

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    03
                </span>

                ------

            </span>

        </div>



        <!-- 04 -->

        <div
            class="directory-file"
            onclick="openVideo(
                'untitled_04.mp4',
                false
            )"
        >

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    04
                </span>

                untitled_04.mp4

            </span>

        </div>



        <!-- 05 -->

        <div
            class="directory-file"
            onclick="openVideo(
                'sp_005.mp4',
                false
            )"
        >

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    05
                </span>

                sp_005.mp4

            </span>

        </div>



        <!-- 06 -->

        <div class="directory-file empty">

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    06
                </span>

                ------

            </span>

        </div>



        <!-- 07 -->

        <div class="directory-file empty">

            <span class="file-icon">
                ⌑
            </span>

            <span class="file-name">

                <span class="number">
                    07
                </span>

                ------

            </span>

        </div>



        <!-- 08 -->

        <div

                </span>

    </div>


</div>



<!-- =========================================================
     VIDEO OVERLAY
========================================================= -->

<div
    id="videoOverlay"
    class="video-overlay"
    onclick="backgroundClose(event)"
>


    <div class="video-window">


        <!-- CLOSE -->

        <button
            class="close-video"
            onclick="closeVideo()"
        >
            ×
        </button>



        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >


            <div
                id="loadingText"
                class="loading-text"
            >
                loading file...
            </div>


            <div class="loading-bar">

                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>

            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>


        </div>



        <!-- =================================================
             CUSTOM 2000s PLAYER
        ================================================== -->

        <div
            id="retroPlayer"
            class="retro-player"
        >


            <!-- TITLE BAR -->

            <div class="player-titlebar">


                <div
                    id="playerFilename"
                    class="player-title"
                >
                    video.mp4
                </div>


                <div class="player-window-buttons">

                    <div class="fake-window-button"></div>

                    <div class="fake-window-button"></div>

                    <div class="fake-window-button"></div>

                </div>


            </div>



            <!-- VIDEO -->

            <div
                class="player-screen"
                onclick="togglePlay()"
            >


                <video
                    id="videoPlayer"
                    preload="metadata"
                >

                    <source
                        id="videoSource"
                        src=""
                        type="video/mp4"
                    >

                </video>


            </div>



            <!-- CONTROLS -->

            <div class="player-controls">


                <!-- PLAY -->

                <button
                    class="retro-button"
                    onclick="playVideo()"
                    title="play"
                >

                    <span class="play-symbol"></span>

                </button>



                <!-- PAUSE -->

                <button
                    class="retro-button"
                    onclick="pauseVideo()"
                    title="pause"
                >

                    <span class="pause-symbol">

                        <span></span>
                        <span></span>

                    </span>

                </button>



                <!-- STOP -->

                <button
                    class="retro-button"
                    onclick="stopVideo()"
                    title="stop"
                >

                    <span class="stop-symbol"></span>

                </button>



                <!-- SEEK -->

                <div class="timeline-area">


                    <input
                        id="seekBar"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                    >


                    <div
                        id="playerTime"
                        class="player-time"
                    >
                        00:00 / 00:00
                    </div>


                </div>


            </div>


        </div>


    </div>


</div>



<script>


let loadingInterval;

let stallTimeout;


/* =========================================================
   OPEN VIDEO
========================================================= */

function openVideo(
    fileName,
    shouldStall
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const retroPlayer =
        document.getElementById(
            "retroPlayer"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );


    const filename =
        document.getElementById(
            "playerFilename"
        );


    const seekBar =
        document.getElementById(
            "seekBar"
        );



    /* RESET TIMERS */

    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );



    /* RESET VIDEO */

    video.pause();


    source.src =
        fileName;


    video.load();



    filename.textContent =
        fileName;


    seekBar.value =
        0;



    /* SHOW LOADING FIRST */

    retroPlayer.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "loading file...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";



    overlay.classList.add(
        "active"
    );



    let value =
        0;


    let hasStalled =
        false;



    /* =====================================================
       LOADING
    ===================================================== */

    loadingInterval =

        setInterval(function() {


            value++;


            progress.style.width =
                value + "%";


            percent.textContent =
                value + "%";



            /* =================================================
               FILE 08 STALLS AT 82%
            ================================================= */

            if (
                shouldStall === true
                &&
                value === 82
                &&
                hasStalled === false
            ) {


                hasStalled =
                    true;


                clearInterval(
                    loadingInterval
                );


                stallTimeout =

                    setTimeout(function() {


                        loadingInterval =

                            setInterval(function() {


                                value++;


                                progress.style.width =
                                    value + "%";


                                percent.textContent =
                                    value + "%";


                                if (
                                    value >= 100
                                ) {


                                    clearInterval(
                                        loadingInterval
                                    );


                                    showVideoPlayer();


                                }


                            }, 20);


                    }, 2000);


                return;


            }



            /* NORMAL FINISH */

            if (
                value >= 100
            ) {


                clearInterval(
                    loadingInterval
                );


                showVideoPlayer();


            }


        }, 20);


}



/* =========================================================
   SHOW CUSTOM PLAYER
========================================================= */

function showVideoPlayer() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const retroPlayer =
        document.getElementById(
            "retroPlayer"
        );


    setTimeout(function() {


        loadingScreen.style.display =
            "none";


        retroPlayer.style.display =
            "block";


        updateTimeDisplay();


        video.play();


    }, 100);


}



/* =========================================================
   PLAY
========================================================= */

function playVideo() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.play();


}



/* =========================================================
   PAUSE
========================================================= */

function pauseVideo() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.pause();


}



/* =========================================================
   STOP
========================================================= */

function stopVideo() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.pause();


    video.currentTime =
        0;


}



/* =========================================================
   CLICK VIDEO TO PLAY / PAUSE
========================================================= */

function togglePlay() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    if (
        video.paused
    ) {


        video.play();


    }


    else {


        video.pause();


    }


}



/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    seconds
) {


    if (
        !Number.isFinite(
            seconds
        )
    ) {


        return "00:00";


    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        Math.floor(
            seconds % 60
        );


    return (

        String(
            minutes
        ).padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(
            remainingSeconds
        ).padStart(
            2,
            "0"
        )

    );


}



/* =========================================================
   UPDATE TIME DISPLAY
========================================================= */

function updateTimeDisplay() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const display =
        document.getElementById(
            "playerTime"
        );


    display.textContent =

        formatTime(
            video.currentTime
        )

        +

        " / "

        +

        formatTime(
            video.duration
        );


}



/* =========================================================
   VIDEO TIME UPDATE
========================================================= */

const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const seekBar =
    document.getElementById(
        "seekBar"
    );



videoPlayer.addEventListener(
    "timeupdate",
    function() {


        updateTimeDisplay();


        if (
            Number.isFinite(
                videoPlayer.duration
            )
            &&
            videoPlayer.duration > 0
        ) {


            seekBar.value =

                (
                    videoPlayer.currentTime
                    /
                    videoPlayer.duration
                )

                *
                100;


        }


    }
);



videoPlayer.addEventListener(
    "loadedmetadata",
    function() {


        updateTimeDisplay();


    }
);



/* =========================================================
   SCRUB VIDEO
========================================================= */

seekBar.addEventListener(
    "input",
    function() {


        if (
            Number.isFinite(
                videoPlayer.duration
            )
        ) {


            videoPlayer.currentTime =

                (
                    seekBar.value
                    /
                    100
                )

                *
                videoPlayer.duration;


        }


    }
);



/* =========================================================
   CLOSE VIDEO
========================================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    overlay.classList.remove(
        "active"
    );


    video.pause();


}



/* =========================================================
   CLICK OUTSIDE
========================================================= */

function backgroundClose(
    event
) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {


        closeVideo();


    }


}



/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeVideo();


        }


    }
);


</script>
