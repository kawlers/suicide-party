<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================
   PAGE
========================================= */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0 80px;
}


/* =========================================
   BACK
========================================= */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* =========================================
   DIRECTORY HEADER
========================================= */

.directory-header {
    margin-top: 48px;
    margin-bottom: 32px;
}

.directory-path {
    display: inline-block;

    color: #d00000;

    border: 1px solid #520000;

    padding: 8px 16px;

    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 24px;
}

.section-title {
    color: #666;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================
   DIRECTORY LIST
========================================= */

.directory-list {
    width: 100%;

    margin-top: 18px;

    border-top: 1px solid #1d1d1d;
}


/* =========================================
   FILE ROW
========================================= */

.directory-file {
    display: flex;
    align-items: center;

    gap: 14px;

    min-height: 46px;

    padding: 0 8px;

    border-bottom: 1px solid #161616;

    color: #999;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease,
        background 0.15s ease;
}

.directory-file:hover {
    color: #fff;

    padding-left: 14px;

    background: rgba(120, 0, 0, 0.04);
}


/* =========================================
   FILE SYMBOL
========================================= */

.file-icon {
    color: #666;

    width: 18px;

    font-size: 15px;

    text-align: center;

    flex-shrink: 0;
}


/* =========================================
   NUMBER
========================================= */

.number {
    display: inline-block;

    width: 28px;

    color: #d00000;

    margin-right: 8px;
}


/* =========================================
   FILE NAME
========================================= */

.file-name {
    white-space: nowrap;
}


/* =========================================
   EMPTY FILES
========================================= */

.directory-file.empty {
    color: #333;
    cursor: default;
}

.directory-file.empty .number {
    color: #650000;
}

.directory-file.empty .file-icon {
    color: #292929;
}

.directory-file.empty:hover {
    color: #333;

    padding-left: 8px;

    background: none;
}


/* =========================================
   AUTHORIZATION OVERLAY
========================================= */

.auth-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.96);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 20000;
}


/* =========================================
   AUTH BOX
========================================= */

.auth-box {
    width: min(430px, 88vw);

    background: #050505;

    border: 1px solid #3a0000;

    box-shadow:
        0 0 0 1px #111,
        0 18px 60px rgba(0, 0, 0, 0.9);
}


/* =========================================
   TOP RED STRIP
========================================= */

.auth-strip {
    height: 6px;

    background: #700000;

    border-bottom: 1px solid #1c0000;
}


/* =========================================
   AUTH CONTENT
========================================= */

.auth-content {
    padding: 30px 30px 26px;
}


/* =========================================
   TITLE
========================================= */

.auth-title {
    color: #cfcfcf;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 8px;
}


/* =========================================
   SUBTEXT
========================================= */

.auth-subtext {
    color: #444;

    font-size: 9px;

    letter-spacing: 0.7px;

    margin-bottom: 22px;
}


/* =========================================
   PASSWORD INPUT
========================================= */

.auth-input {
    width: 100%;

    height: 40px;

    padding: 0 12px;

    background: #000;

    color: #aaa;

    font-family: "Courier New", monospace;

    font-size: 14px;

    letter-spacing: 3px;

    outline: none;

    border-top: 1px solid #0b0b0b;
    border-left: 1px solid #0b0b0b;

    border-right: 1px solid #333;
    border-bottom: 1px solid #333;
}

.auth-input:focus {
    border-right-color: #5b0000;
    border-bottom-color: #5b0000;
}


/* =========================================
   AUTH BOTTOM
========================================= */

.auth-bottom {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-top: 16px;

    min-height: 26px;
}


/* =========================================
   AUTH STATUS
========================================= */

.auth-status {
    color: #3e3e3e;

    font-size: 9px;

    letter-spacing: 1px;
}

.auth-status.error {
    color: #b00000;
}


/* =========================================
   AUTH BUTTON
========================================= */

.auth-button {
    padding: 7px 15px;

    background: #0b0b0b;

    color: #777;

    font-family: "Courier New", monospace;

    font-size: 10px;

    letter-spacing: 1px;

    border: 1px solid #292929;

    cursor: pointer;
}

.auth-button:hover {
    color: #ddd;

    border-color: #540000;
}

.auth-button:active {
    background: #140000;
}

.auth-button:disabled {
    cursor: default;

    opacity: 0.3;
}


/* =========================================
   AUTH LOADER
========================================= */

.auth-loader {
    display: none;

    align-items: center;
    justify-content: center;

    height: 40px;

    margin-top: 15px;
}

.auth-loader.visible {
    display: flex;
}


/* =========================================
   LOADING SYMBOL
========================================= */

.loader-symbol {
    width: 18px;
    height: 18px;

    border: 1px solid #292929;

    border-top-color: #8d0000;

    border-radius: 50%;

    animation:
        authSpin 0.55s linear infinite;
}

@keyframes authSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   ERROR SHAKE
========================================= */

.auth-box.shake {
    animation:
        authShake 0.22s linear;
}

@keyframes authShake {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    50% {
        transform: translateX(5px);
    }

    75% {
        transform: translateX(-3px);
    }

    100% {
        transform: translateX(0);
    }

}


/* =========================================
   VIDEO OVERLAY
========================================= */

.video-overlay {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.94);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.video-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================
   VIDEO WINDOW
========================================= */

.video-window {
    position: relative;

    width: 1000px;

    max-width: 92vw;

    opacity: 0;

    transform:
        translateY(10px)
        scale(0.99);

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.video-overlay.active .video-window {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================
   CLOSE
========================================= */

.close-video {
    position: absolute;

    top: -34px;
    right: 0;

    padding: 0;

    border: none;

    background: none;

    color: #666;

    font-family: "Courier New", monospace;

    font-size: 22px;

    cursor: pointer;

    z-index: 20;
}

.close-video:hover {
    color: #fff;
}


/* =========================================
   FILE LOADING SCREEN
========================================= */

.loading-screen {
    width: 100%;

    height: 180px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 30px;

    background: #000;

    border: 1px solid #292929;
}

.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* =========================================
   FILE LOADING BAR
========================================= */

.loading-bar {
    width: 100%;

    height: 2px;

    background: #181818;

    overflow: hidden;
}

.loading-progress {
    width: 0%;

    height: 100%;

    background: #a00000;
}

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}


/* =========================================
   RAW VIDEO
========================================= */

.video-container {
    display: none;

    width: 100%;

    background: #000;

    border: 1px solid #252525;

    box-shadow:
        0 0 30px rgba(0, 0, 0, 0.9);
}

#videoPlayer {
    display: block;

    width: 100%;

    max-height: 82vh;

    background: #000;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .page {
        width: 90%;

        padding-top: 28px;
    }

    .directory-header {
        margin-top: 35px;
    }

    .directory-file {
        font-size: 11px;

        gap: 8px;
    }

    .directory-path {
        font-size: 16px;
    }

    .number {
        width: 24px;

        margin-right: 4px;
    }

    .video-window {
        width: 94vw;

        max-width: 94vw;
    }

    .auth-content {
        padding: 26px 22px 22px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     AUTHORIZATION
========================================= -->

<div
    id="authOverlay"
    class="auth-overlay"
>


    <div
        id="authBox"
        class="auth-box"
    >


        <div class="auth-strip"></div>


        <div class="auth-content">


            <div class="auth-title">
                authorization required
            </div>


            <div class="auth-subtext">
                protected directory / credentials required
            </div>


            <input
                id="passwordInput"
                class="auth-input"
                type="password"
                autocomplete="off"
                spellcheck="false"
                maxlength="20"
                aria-label="password"
            >


            <div class="auth-bottom">


                <div
                    id="authStatus"
                    class="auth-status"
                >
                    awaiting authorization
                </div>


                <button
                    id="authButton"
                    class="auth-button"
                    onclick="submitPassword()"
                >
                    submit
                </button>


            </div>


            <div
                id="authLoader"
                class="auth-loader"
            >

                <div class="loader-symbol"></div>

            </div>


        </div>


    </div>


</div>



<!-- =========================================
     ARCHIVE
========================================= -->

<div class="page">


    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>


    <div class="directory-header">


        <div class="directory-path">
            /files
        </div>


        <div class="section-title">
            video files (.mp4)
        </div>


    </div>


    <div class="directory-list">


        <!-- 01 -->

        <div
            class="directory-file"
            onclick="openVideo('purge-xtra2k25.mp4', false, 20)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">01</span>

                purge-xtra2k25.mp4

            </span>

        </div>


        <!-- 02 -->

        <div
            class="directory-file"
            onclick="openVideo('scenebitch-lcut.mp4', false, 20)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">02</span>

                scenebitch-lcut.mp4

            </span>

        </div>


        <!-- 03 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">03</span>

                ------

            </span>

        </div>


        <!-- 04 -->

        <div
            class="directory-file"
            onclick="openVideo('untitled_04.mp4', false, 20)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">04</span>

                untitled_04.mp4

            </span>

        </div>


        <!-- 05 -->

        <div
            class="directory-file"
            onclick="openVideo('sp_005.mp4', false, 20)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">05</span>

                sp_005.mp4

            </span>

        </div>


        <!-- 06 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">06</span>

                ------

            </span>

        </div>


        <!-- =================================
             07 — NEW FILE

             SAME STALL AS 08
             BUT SLIGHTLY SLOWER
        ================================== -->

        <div
            class="directory-file"
            onclick="openVideo('im_ok_itsnotmyblood.mp4', true, 26)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">07</span>

                im_ok_itsnotmyblood.mp4

            </span>

        </div>


        <!-- 08 -->

        <div
            class="directory-file"
            onclick="openVideo('957229577.mp4', true, 20)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">08</span>

                957229577.mp4

            </span>

        </div>


    </div>


</div>



<!-- =========================================
     VIDEO OVERLAY
========================================= -->

<div
    id="videoOverlay"
    class="video-overlay"
    onclick="backgroundClose(event)"
>


    <div class="video-window">


        <button
            class="close-video"
            onclick="closeVideo()"
        >
            ×
        </button>


        <div
            id="loadingScreen"
            class="loading-screen"
        >


            <div
                id="loadingText"
                class="loading-text"
            >
                loading file...
            </div>


            <div class="loading-bar">


                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>


            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>


        </div>


        <div
            id="videoContainer"
            class="video-container"
        >


            <video
                id="videoPlayer"
                controls
                preload="metadata"
            >


                <source
                    id="videoSource"
                    src=""
                    type="video/mp4"
                >


            </video>


        </div>


    </div>


</div>



<script>


/* =========================================
   AUTHORIZATION
========================================= */

let failedAttempts =
    0;


const maxAttempts =
    3;


const correctPassword =
    "notmyblood";


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const authStatus =
    document.getElementById(
        "authStatus"
    );


const authBox =
    document.getElementById(
        "authBox"
    );


const authOverlay =
    document.getElementById(
        "authOverlay"
    );


const authButton =
    document.getElementById(
        "authButton"
    );


const authLoader =
    document.getElementById(
        "authLoader"
    );



/* =========================================
   AUTO FOCUS
========================================= */

window.addEventListener(
    "load",
    function() {


        setTimeout(
            function() {


                passwordInput.focus();


            },
            100
        );


    }
);



/* =========================================
   BLOCK SPACES
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === " "
        ) {


            event.preventDefault();


        }


    }
);



/* =========================================
   REMOVE SPACES FROM PASTE
========================================= */

passwordInput.addEventListener(
    "input",
    function() {


        passwordInput.value =
            passwordInput.value.replace(
                /\s/g,
                ""
            );


    }
);



/* =========================================
   ENTER TO SUBMIT
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter"
        ) {


            event.preventDefault();


            submitPassword();


        }


    }
);



/* =========================================
   SUBMIT PASSWORD
========================================= */

function submitPassword() {


    const enteredPassword =
        passwordInput.value;



    /* =====================================
       CORRECT PASSWORD
    ===================================== */

    if (
        enteredPassword ===
        correctPassword
    ) {


        passwordInput.disabled =
            true;


        authButton.disabled =
            true;


        authStatus.classList.remove(
            "error"
        );


        authStatus.textContent =
            "";


        authLoader.classList.add(
            "visible"
        );


        /* =================================
           SPINNER FOR 2 SECONDS
        ================================= */

        setTimeout(
            function() {


                authOverlay.style.display =
                    "none";


            },
            2000
        );


        return;


    }



    /* =====================================
       WRONG PASSWORD
    ===================================== */

    failedAttempts++;


    authStatus.textContent =
        "authorization error";


    authStatus.classList.add(
        "error"
    );


    passwordInput.value =
        "";


    passwordInput.focus();


    authBox.classList.remove(
        "shake"
    );


    void authBox.offsetWidth;


    authBox.classList.add(
        "shake"
    );



    /* =====================================
       THIRD WRONG ATTEMPT
    ===================================== */

    if (
        failedAttempts >=
        maxAttempts
    ) {


        passwordInput.disabled =
            true;


        authButton.disabled =
            true;


        setTimeout(
            function() {


                window.location.href =
                    "index.html";


            },
            700
        );


    }


}



/* =========================================
   VIDEO LOADING
========================================= */

let loadingInterval;

let stallTimeout;


const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const videoSource =
    document.getElementById(
        "videoSource"
    );



/* =========================================
   OPEN VIDEO

   loadSpeed:
   20 = NORMAL
   26 = SLIGHTLY SLOWER
========================================= */

function openVideo(
    fileName,
    shouldStall,
    loadSpeed
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    videoSource.src =
        fileName;


    videoPlayer.load();


    videoContainer.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "loading file...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    overlay.classList.add(
        "active"
    );


    let value =
        0;


    let hasStalled =
        false;



    loadingInterval =

        setInterval(
            function() {


                value++;


                progress.style.width =
                    value + "%";


                percent.textContent =
                    value + "%";



                /* =================================
                   SPECIAL STALL

                   FILE 07 + FILE 08
                   STOP AT 82%
                ================================= */

                if (
                    shouldStall === true
                    &&
                    value === 82
                    &&
                    hasStalled === false
                ) {


                    hasStalled =
                        true;


                    clearInterval(
                        loadingInterval
                    );


                    loadingText.textContent =
                        "loading file...";


                    /* =================================
                       HOLD AT 82%
                       FOR 2 SECONDS
                    ================================= */

                    stallTimeout =

                        setTimeout(
                            function() {


                                loadingInterval =

                                    setInterval(
                                        function() {


                                            value++;


                                            progress.style.width =
                                                value + "%";


                                            percent.textContent =
                                                value + "%";


                                            if (
                                                value >= 100
                                            ) {


                                                clearInterval(
                                                    loadingInterval
                                                );


                                                showVideo();


                                            }


                                        },
                                        loadSpeed
                                    );


                            },
                            2000
                        );


                    return;


                }



                /* =================================
                   NORMAL FINISH
                ================================= */

                if (
                    value >= 100
                ) {


                    clearInterval(
                        loadingInterval
                    );


                    showVideo();


                }


            },
            loadSpeed
        );


}



/* =========================================
   SHOW VIDEO
========================================= */

function showVideo() {


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    setTimeout(
        function() {


            loadingScreen.style.display =
                "none";


            videoContainer.style.display =
                "block";


            const playAttempt =
                videoPlayer.play();


            if (
                playAttempt !== undefined
            ) {


                playAttempt.catch(
                    function() {

                        /* autoplay blocked */

                    }
                );


            }


        },
        100
    );


}



/* =========================================
   CLOSE VIDEO
========================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    videoPlayer.currentTime =
        0;


    overlay.classList.remove(
        "active"
    );


}



/* =========================================
   CLICK OUTSIDE
========================================= */

function backgroundClose(
    event
) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {


        closeVideo();


    }


}



/* =========================================
   ESC
========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
            &&
            authOverlay.style.display === "none"
        ) {


            closeVideo();


        }


    }
);


</script>


</body>

</html>
