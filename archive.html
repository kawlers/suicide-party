<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* PAGE */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 35px 0 70px;
}


/* BACK */

.back {
    color: #aaa;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* HEADER */

.header {
    text-align: center;
}

.title {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 2px;
}


/* LINE */

.line {
    height: 1px;
    background: #333;
    margin: 18px 0 45px;
}


/* SECTION TITLE */

.section-title {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 18px;
}


/* VIDEO LIST */

.video-list {
    width: 500px;
    max-width: 100%;
}

.video-file {
    display: flex;
    align-items: center;
    gap: 22px;

    padding: 14px 4px;

    border-top: 1px solid #222;

    color: #aaa;
    font-size: 13px;

    cursor: pointer;

    transition: 0.15s;
}

.video-file:last-child {
    border-bottom: 1px solid #222;
}

.video-file:hover {
    color: #fff;
    padding-left: 10px;
}


/* EMPTY FILES */

.video-file.empty {
    cursor: default;
    color: #333;
}

.video-file.empty:hover {
    color: #333;
    padding-left: 4px;
}


/* RED NUMBERS */

.number {
    color: #d00000;
    width: 24px;
}


/* FOOTER */

.footer {
    margin-top: 80px;

    color: #555;

    font-size: 11px;
    line-height: 1.8;

    white-space: pre-line;
}


/* =========================================
   VIDEO OVERLAY
========================================= */

.video-overlay {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.75);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}

.video-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* VIDEO WINDOW */

.video-window {
    position: relative;

    width: 1000px;
    max-width: 90vw;

    opacity: 0;

    transform:
        translateX(80px)
        scale(0.96);

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}


/* OPEN ANIMATION */

.video-overlay.active .video-window {
    opacity: 1;

    transform:
        translateX(0)
        scale(1);
}


/* CLOSE */

.close-video {
    position: absolute;

    top: -32px;
    right: 0;

    padding: 0;

    border: none;
    background: none;

    color: #888;

    font-family: "Courier New", monospace;
    font-size: 24px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}


/* =========================================
   VIDEO LOADING SCREEN
========================================= */

.loading-screen {
    width: 100%;
    height: 180px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 30px;

    background: #000;

    border: 1px solid #333;
}


.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* BAR */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #222;

    overflow: hidden;
}


.loading-progress {
    width: 0%;
    height: 100%;

    background: #b00000;
}


/* PERCENT */

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}


/* VIDEO */

#videoPlayer {
    display: none;

    width: 100%;

    max-height: 72vh;

    background: #000;

    border: 1px solid #333;
}


/* MOBILE */

@media (max-width: 700px) {

    .page {
        width: 90%;
    }

    .video-list {
        width: 100%;
    }

    .video-window {
        width: 90vw;
        max-width: 90vw;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- BACK -->

    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>


    <!-- HEADER -->

    <div class="header">

        <div class="title">
            files
        </div>

    </div>


    <div class="line"></div>


    <!-- VIDEO FILES -->

    <div class="section-title">
        video files (.mp4)
    </div>


    <div class="video-list">


        <!-- 01 -->

        <div
            class="video-file"
            onclick="openVideo('purge-xtra2k25.mp4', false)"
        >

            <span class="number">
                01
            </span>

            <span>
                purge-xtra2k25.mp4
            </span>

        </div>



        <!-- 02 -->

        <div
            class="video-file"
            onclick="openVideo('scenebitch-lcut.mp4', false)"
        >

            <span class="number">
                02
            </span>

            <span>
                scenebitch-lcut.mp4
            </span>

        </div>



        <!-- 03 EMPTY -->

        <div class="video-file empty">

            <span class="number">
                03
            </span>

            <span>
                ------
            </span>

        </div>



        <!-- 04 -->

        <div
            class="video-file"
            onclick="openVideo('untitled_04.mp4', false)"
        >

            <span class="number">
                04
            </span>

            <span>
                untitled_04.mp4
            </span>

        </div>



        <!-- 05 -->

        <div
            class="video-file"
            onclick="openVideo('sp_005.mp4', false)"
        >

            <span class="number">
                05
            </span>

            <span>
                sp_005.mp4
            </span>

        </div>



        <!-- 06 EMPTY -->

        <div class="video-file empty">

            <span class="number">
                06
            </span>

            <span>
                ------
            </span>

        </div>



        <!-- 07 EMPTY -->

        <div class="video-file empty">

            <span class="number">
                07
            </span>

            <span>
                ------
            </span>

        </div>



        <!-- 08 - STALLS DURING LOADING -->

        <div
            class="video-file"
            onclick="openVideo('957229577.mp4', true)"
        >

            <span class="number">
                08
            </span>

            <span>
                957229577.mp4
            </span>

        </div>


    </div>



    <!-- FOOTER -->

    <div class="footer">your connection has been logged.
session ID: [unbound]
unknown client</div>


</div>



<!-- =========================================
     FLOATING VIDEO
========================================= -->

<div
    id="videoOverlay"
    class="video-overlay"
    onclick="backgroundClose(event)"
>


    <div class="video-window">


        <!-- CLOSE -->

        <button
            class="close-video"
            onclick="closeVideo()"
        >
            ×
        </button>



        <!-- LOADING -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >

            <div
                id="loadingText"
                class="loading-text"
            >
                loading file...
            </div>


            <div class="loading-bar">

                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>

            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>


        </div>



        <!-- VIDEO -->

        <video
            id="videoPlayer"
            controls
            preload="metadata"
        >

            <source
                id="videoSource"
                src=""
                type="video/mp4"
            >

            your browser does not support video playback.

        </video>


    </div>


</div>



<script>

let loadingInterval;
let stallTimeout;


/* =========================================
   OPEN VIDEO
========================================= */

function openVideo(fileName, shouldStall) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );



    /* RESET */

    clearInterval(
        loadingInterval
    );

    clearTimeout(
        stallTimeout
    );


    video.pause();


    source.src =
        fileName;


    video.load();


    video.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "loading file...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";



    /* OPEN WINDOW */

    overlay.classList.add(
        "active"
    );



    let value = 0;
    let hasStalled = false;



    /* =====================================
       LOADING
    ===================================== */

    loadingInterval =
        setInterval(function() {


            value++;


            progress.style.width =
                value + "%";


            percent.textContent =
                value + "%";



            /* =================================
               ONLY FILE 08 STALLS AT 82%
            ================================= */

            if (
                shouldStall === true
                &&
                value === 82
                &&
                hasStalled === false
            ) {


                hasStalled =
                    true;


                clearInterval(
                    loadingInterval
                );


                /*
                   BAR STAYS FROZEN AT 82%
                   FOR 2 SECONDS
                */

                stallTimeout =
                    setTimeout(function() {


                        /* RESUME */

                        loadingInterval =
                            setInterval(function() {


                                value++;


                                progress.style.width =
                                    value + "%";


                                percent.textContent =
                                    value + "%";


                                if (value >= 100) {


                                    clearInterval(
                                        loadingInterval
                                    );


                                    showVideo();


                                }


                            }, 20);


                    }, 2000);


                return;

            }



            /* NORMAL COMPLETION */

            if (value >= 100) {


                clearInterval(
                    loadingInterval
                );


                showVideo();


            }


        }, 20);


}



/* =========================================
   SHOW VIDEO
========================================= */

function showVideo() {


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    setTimeout(function() {


        loadingScreen.style.display =
            "none";


        video.style.display =
            "block";


        video.play();


    }, 100);


}



/* =========================================
   CLOSE VIDEO
========================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    overlay.classList.remove(
        "active"
    );


    video.pause();


}



/* CLICK OUTSIDE */

function backgroundClose(event) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {

        closeVideo();

    }


}



/* ESC CLOSE */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {

            closeVideo();

        }


    }
);

</script>


</body>

</html>
