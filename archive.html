<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>archive / suicide party</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: min(900px, 90%);
            margin: auto;
            padding: 40px 0 80px;
        }

        .back {
            color: #555;
            text-decoration: none;
            font-size: 11px;
        }

        .back:hover {
            color: #fff;
        }

        h1 {
            margin-top: 50px;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .line {
            height: 1px;
            background: #333;
            margin: 30px 0;
        }

        .section {
            margin-top: 50px;
        }

        .section-title {
            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        /* VIDEO */

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0a0a0a;
            border: 1px solid #222;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #333;
            font-size: 11px;
        }

        /* FILES */

        .file {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #222;
            padding: 17px 5px;
            font-size: 14px;
        }

        .file:last-child {
            border-bottom: 1px solid #222;
        }

        .file span:last-child {
            color: #555;
            font-size: 10px;
        }

        /* PHOTOS */

        .photos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo {
            aspect-ratio: 1 / 1;
            background: #0a0a0a;
            border: 1px solid #222;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #333;
            font-size: 10px;
        }

        /* TRACKLIST */

        .track {
            border-top: 1px solid #222;
            padding: 15px 5px;
            font-size: 14px;
            color: #888;
        }

        .track:last-child {
            border-bottom: 1px solid #222;
        }

        @media (max-width: 600px) {

            .photos {
                grid-template-columns: 1fr 1fr;
            }

        }
    </style>
</head>

<body>

<div class="page">

    <a class="back" href="index.html">← back</a>

    <h1>archive</h1>

    <div class="line"></div>


    <!-- MUSIC VIDEO -->

        </div>

    </div>


    <!-- PHOTOS -->

    <div class="section">

        </div>

        <div class="photos">

            <div class="photo">
                IMAGE

            <div class="photo">

            <div class="photo">

            <div class="photo">

            </div>

            <div class="photo">
                IMAGE
            </div>

            <div class="photo">
                IMAGE
            </div>

        </div>

    </div>


    <!-- TRACKLIST -->

    <div class="section">

</div>

</body>
</html>
