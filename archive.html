<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;

    font-family:
        "Courier New",
        monospace;
}


/* =========================================
   PAGE
========================================= */

.page {
    width: min(980px, 92%);

    margin: auto;

    padding:
        45px 0 80px;
}


/* =========================================
   BACK
========================================= */

.back {
    color: #777;

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 1px;
}

.back:hover {
    color: #fff;
}


/* =========================================
   DIRECTORY HEADER
========================================= */

.directory-header {
    margin-top: 50px;
    margin-bottom: 40px;
}


/* /FILES BOX */

.directory-path {
    display: inline-block;

    padding:
        10px 18px;

    border:
        1px solid #650000;

    color: #d00000;

    font-size: 22px;

    letter-spacing: 2px;

    margin-bottom: 25px;
}


/* SECTION */

.section-title {
    color: #777;

    font-size: 12px;

    letter-spacing: 1px;
}


/* =========================================
   DIRECTORY LIST
========================================= */

.directory-list {
    width: 100%;

    margin-top: 22px;

    border-top:
        1px solid #1d1d1d;
}


/* EACH ROW */

.directory-file {
    display: grid;

    grid-template-columns:
        34px
        1fr
        auto;

    align-items: center;

    gap: 12px;

    min-height: 48px;

    padding:
        0 10px;

    border-bottom:
        1px solid #171717;

    color: #aaa;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        background 0.15s ease,
        padding-left 0.15s ease;
}


/* HOVER */

.directory-file:hover {
    color: #fff;

    background:
        rgba(120, 0, 0, 0.05);

    padding-left: 15px;
}


/* =========================================
   FILE ICON
========================================= */

.file-icon {
    color: #555;

    font-size: 14px;
}


/* =========================================
   FILE NAME
========================================= */

.file-name {
    display: flex;

    align-items: center;

    min-width: 0;
}


/* NUMBER */

.number {
    color: #d00000;

    margin-right: 10px;
}


/* =========================================
   DOT LEADER
========================================= */

.file-dots {
    overflow: hidden;

    white-space: nowrap;

    color: #282828;

    flex: 1;

    margin-left: 10px;
}

.file-dots::after {
    content:
        "...........................................................................................................";
}


/* =========================================
   STATUS
========================================= */

.file-status {
    color: #800000;

    font-size: 11px;

    min-width: 60px;

    text-align: right;
}


/* =========================================
   EMPTY FILES
========================================= */

.directory-file.empty {
    cursor: default;

    color: #333;
}

.directory-file.empty .number {
    color: #650000;
}

.directory-file.empty .file-icon {
    color: #222;
}

.directory-file.empty .file-status {
    color: #333;
}

.directory-file.empty:hover {
    color: #333;

    background: none;

    padding-left: 10px;
}


/* =========================================
   BOTTOM INFO
========================================= */

.directory-footer {
    margin-top: 55px;

    padding-top: 18px;

    border-top:
        1px solid #1c1c1c;

    color: #444;

    font-size: 10px;

    line-height: 1.8;

    text-align: center;

    letter-spacing: 0.5px;
}


/* =========================================
   VIDEO OVERLAY
========================================= */

.video-overlay {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(
            0,
            0,
            0,
            0.78
        );

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}


.video-overlay.active {
    opacity: 1;

    visibility: visible;
}


/* =========================================
   VIDEO WINDOW
========================================= */

.video-window {
    position: relative;

    width: 1000px;

    max-width: 90vw;

    opacity: 0;

    transform:
        translateX(80px)
        scale(0.96);

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}


.video-overlay.active
.video-window {
    opacity: 1;

    transform:
        translateX(0)
        scale(1);
}


/* =========================================
   CLOSE BUTTON
========================================= */

.close-video {
    position: absolute;

    top: -32px;
    right: 0;

    padding: 0;

    border: none;

    background: none;

    color: #888;

    font-family:
        "Courier New",
        monospace;

    font-size: 24px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}


/* =========================================
   LOADING SCREEN
========================================= */

.loading-screen {
    width: 100%;
    height: 180px;

    display: flex;
    flex-direction: column;

    justify-content: center;

    padding: 30px;

    background: #000;

    border:
        1px solid #333;
}


.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* LOADING BAR */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #222;

    overflow: hidden;
}


.loading-progress {
    width: 0%;
    height: 100%;

    background: #b00000;
}


/* PERCENT */

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}
