<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>files</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0 80px;
}


/* =========================================================
   BACK
========================================================= */

.back {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #fff;
}


/* =========================================================
   DIRECTORY HEADER
========================================================= */

.directory-header {
    margin-top: 48px;
    margin-bottom: 32px;
}

.directory-path {
    display: inline-block;

    color: #d00000;

    border: 1px solid #520000;

    padding: 8px 16px;

    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 24px;
}

.section-title {
    color: #666;

    font-size: 12px;
    letter-spacing: 1px;
}


/* =========================================================
   DIRECTORY LIST
========================================================= */

.directory-list {
    width: 100%;
    margin-top: 18px;
    border-top: 1px solid #1d1d1d;
}


/* =========================================================
   FILE ROW
========================================================= */

.directory-file {
    display: flex;
    align-items: center;
    gap: 14px;

    min-height: 46px;

    padding: 0 8px;

    border-bottom: 1px solid #161616;

    color: #999;

    font-size: 13px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease,
        background 0.15s ease;
}

.directory-file:hover {
    color: #fff;

    padding-left: 14px;

    background: rgba(120, 0, 0, 0.04);
}


/* =========================================================
   FILE SYMBOL
========================================================= */

.file-icon {
    color: #666;

    width: 18px;

    font-size: 15px;

    text-align: center;

    flex-shrink: 0;
}


/* =========================================================
   NUMBER
========================================================= */

.number {
    display: inline-block;

    width: 28px;

    color: #d00000;

    margin-right: 8px;
}


/* =========================================================
   FILE NAME
========================================================= */

.file-name {
    white-space: nowrap;
}


/* =========================================================
   EMPTY FILES
========================================================= */

.directory-file.empty {
    color: #333;
    cursor: default;
}

.directory-file.empty .number {
    color: #650000;
}

.directory-file.empty .file-icon {
    color: #292929;
}

.directory-file.empty:hover {
    color: #333;
    padding-left: 8px;
    background: none;
}


/* =========================================================
   VIDEO OVERLAY
========================================================= */

.video-overlay {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.9);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.22s ease,
        visibility 0.22s ease;
}

.video-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   VIDEO WINDOW
========================================================= */

.video-window {
    position: relative;

    width: 1000px;
    max-width: 92vw;

    opacity: 0;

    transform:
        translateY(14px)
        scale(0.98);

    transition:
        transform 0.22s ease,
        opacity 0.22s ease;
}

.video-overlay.active .video-window {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   CLOSE
========================================================= */

.close-video {
    position: absolute;

    top: -32px;
    right: 0;

    padding: 0;

    border: none;
    background: none;

    color: #666;

    font-family: "Courier New", monospace;
    font-size: 22px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen {
    width: 100%;
    height: 180px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 30px;

    background: #000;

    border: 1px solid #2b2b2b;
}

.loading-text {
    color: #777;

    font-size: 11px;

    margin-bottom: 15px;
}


/* =========================================================
   LOADING BAR
========================================================= */

.loading-bar {
    width: 100%;
    height: 2px;

    background: #1a1a1a;

    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;

    background: #a00000;
}

.loading-percent {
    margin-top: 10px;

    color: #555;

    font-size: 10px;

    text-align: right;
}


/* =========================================================
   2004 STYLE PLAYER
========================================================= */

.retro-player {
    display: none;

    width: 100%;

    padding: 7px;

    background:
        linear-gradient(
            to bottom,
            #282828,
            #111
        );

    border-top: 2px solid #555;
    border-left: 2px solid #4b4b4b;

    border-right: 2px solid #050505;
    border-bottom: 2px solid #050505;

    box-shadow:
        0 0 0 1px #000,
        0 12px 35px rgba(0, 0, 0, 0.9);
}


/* =========================================================
   VIDEO SCREEN
========================================================= */

.player-screen {
    position: relative;

    width: 100%;

    overflow: hidden;

    background: #000;

    border-top: 2px solid #050505;
    border-left: 2px solid #050505;

    border-right: 1px solid #555;
    border-bottom: 1px solid #555;
}

#videoPlayer {
    display: block;

    width: 100%;

    max-height: 72vh;

    background: #000;
}


/* CRT TEXTURE */

.player-screen::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.012) 0px,
            rgba(255, 255, 255, 0.012) 1px,
            rgba(0, 0, 0, 0.025) 1px,
            rgba(0, 0, 0, 0.025) 3px
        );
}


/* =========================================================
   CONTROL BAR
========================================================= */

.player-controls {
    min-height: 64px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 9px 8px 3px;

    background:
        linear-gradient(
            to bottom,
            #252525,
            #111
        );
}


/* =========================================================
   PLAY / PAUSE BUTTON
========================================================= */

.toggle-button {
    width: 58px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    padding: 0;

    background:
        linear-gradient(
            to bottom,
            #d2d2d2 0%,
            #8b8b8b 45%,
            #555 55%,
            #aaa 100%
        );

    border-top: 2px solid #eee;
    border-left: 2px solid #d0d0d0;

    border-right: 2px solid #292929;
    border-bottom: 2px solid #292929;

    cursor: pointer;

    box-shadow:
        inset 0 0 4px rgba(255, 255, 255, 0.5);
}

.toggle-button:hover {
    filter: brightness(1.1);
}

.toggle-button:active {
    border-top: 2px solid #292929;
    border-left: 2px solid #292929;

    border-right: 2px solid #ddd;
    border-bottom: 2px solid #ddd;
}


/* PLAY */

.play-symbol {
    width: 0;
    height: 0;

    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;

    border-left: 13px solid #111;

    margin-left: 3px;
}


/* PAUSE */

.pause-symbol {
    display: none;

    gap: 4px;
}

.pause-symbol span {
    width: 5px;
    height: 16px;

    background: #111;
}


/* =========================================================
   SEEK / FORWARD / REVERSE SLIDER
========================================================= */

.timeline-area {
    flex: 1;

    min-width: 0;

    display: flex;
    align-items: center;
}

#seekBar {
    width: 100%;

    appearance: none;
    -webkit-appearance: none;

    height: 12px;

    background:
        linear-gradient(
            to bottom,
            #050505,
            #111
        );

    border-top: 2px solid #000;
    border-left: 2px solid #000;

    border-right: 1px solid #555;
    border-bottom: 1px solid #555;

    cursor: pointer;
}


/* SEEK THUMB */

#seekBar::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 14px;
    height: 24px;

    background:
        linear-gradient(
            to right,
            #555,
            #bbb,
            #555
        );

    border-top: 1px solid #ddd;
    border-left: 1px solid #aaa;

    border-right: 1px solid #222;
    border-bottom: 1px solid #222;

    cursor: pointer;
}

#seekBar::-moz-range-thumb {
    width: 12px;
    height: 22px;

    border-radius: 0;

    background:
        linear-gradient(
            to right,
            #555,
            #bbb,
            #555
        );

    border-top: 1px solid #ddd;
    border-left: 1px solid #aaa;

    border-right: 1px solid #222;
    border-bottom: 1px solid #222;

    cursor: pointer;
}


/* =========================================================
   SPEAKER / VOLUME BUTTON
========================================================= */

.volume-button {
    position: relative;

    width: 42px;
    height: 34px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    background:
        linear-gradient(
            to bottom,
            #777,
            #444
        );

    border-top: 1px solid #aaa;
    border-left: 1px solid #999;

    border-right: 1px solid #222;
    border-bottom: 1px solid #222;

    cursor: pointer;
}

.volume-button:hover {
    filter: brightness(1.1);
}


/* SPEAKER */

.speaker-icon {
    position: relative;

    width: 20px;
    height: 18px;
}

.speaker-icon::before {
    content: "";

    position: absolute;

    left: 1px;
    top: 6px;

    width: 7px;
    height: 7px;

    background: #111;
}

.speaker-icon::after {
    content: "";

    position: absolute;

    left: 7px;
    top: 3px;

    width: 0;
    height: 0;

    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;

    border-right: 8px solid #111;
}


/* SOUND WAVE 1 */

.wave-one {
    position: absolute;

    right: 1px;
    top: 5px;

    width: 6px;
    height: 8px;

    border-right: 2px solid #111;

    border-radius: 50%;
}


/* SOUND WAVE 2 */

.wave-two {
    position: absolute;

    right: -3px;
    top: 2px;

    width: 9px;
    height: 14px;

    border-right: 2px solid #111;

    border-radius: 50%;
}


/* =========================================================
   VOLUME STATES
========================================================= */


/* 70% */

.volume-button.medium .wave-two {
    display: none;
}


/* 35% */

.volume-button.low .wave-two {
    display: none;
}

.volume-button.low .wave-one {
    opacity: 0.45;
}


/* MUTED */

.volume-button.muted .wave-one,
.volume-button.muted .wave-two {
    display: none;
}

.volume-button.muted .speaker-icon {
    opacity: 0.35;
}


/* LITTLE RED VOLUME INDICATOR */

.volume-light {
    position: absolute;

    bottom: 3px;
    left: 5px;

    width: 30px;
    height: 2px;

    background: #7d0000;

    transition: width 0.15s ease;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .page {
        width: 90%;
        padding-top: 28px;
    }

    .directory-header {
        margin-top: 35px;
    }

    .directory-file {
        font-size: 11px;
        gap: 8px;
    }

    .directory-path {
        font-size: 16px;
    }

    .number {
        width: 24px;
        margin-right: 4px;
    }

    .video-window {
        width: 94vw;
        max-width: 94vw;
    }

    .player-controls {
        gap: 8px;
    }

    .toggle-button {
        width: 48px;
        height: 32px;
    }

    .volume-button {
        width: 38px;
        height: 31px;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- BACK -->

    <a
        class="back"
        href="index.html"
    >
        ← back
    </a>



    <!-- HEADER -->

    <div class="directory-header">


        <div class="directory-path">
            /files
        </div>


        <div class="section-title">
            video files (.mp4)
        </div>


    </div>



    <!-- DIRECTORY -->

    <div class="directory-list">


        <!-- 01 -->

        <div
            class="directory-file"
            onclick="openVideo('purge-xtra2k25.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">01</span>

                purge-xtra2k25.mp4

            </span>

        </div>



        <!-- 02 -->

        <div
            class="directory-file"
            onclick="openVideo('scenebitch-lcut.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">02</span>

                scenebitch-lcut.mp4

            </span>

        </div>



        <!-- 03 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">03</span>

                ------

            </span>

        </div>



        <!-- 04 -->

        <div
            class="directory-file"
            onclick="openVideo('untitled_04.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">04</span>

                untitled_04.mp4

            </span>

        </div>



        <!-- 05 -->

        <div
            class="directory-file"
            onclick="openVideo('sp_005.mp4', false)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">05</span>

                sp_005.mp4

            </span>

        </div>



        <!-- 06 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">06</span>

                ------

            </span>

        </div>



        <!-- 07 -->

        <div class="directory-file empty">

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">07</span>

                ------

            </span>

        </div>



        <!-- 08 -->

        <div
            class="directory-file"
            onclick="openVideo('957229577.mp4', true)"
        >

            <span class="file-icon">⌑</span>

            <span class="file-name">

                <span class="number">08</span>

                957229577.mp4

            </span>

        </div>


    </div>


</div>



<!-- =========================================================
     VIDEO OVERLAY
========================================================= -->

<div
    id="videoOverlay"
    class="video-overlay"
    onclick="backgroundClose(event)"
>


    <div class="video-window">


        <!-- CLOSE -->

        <button
            class="close-video"
            onclick="closeVideo()"
        >
            ×
        </button>



        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >


            <div
                id="loadingText"
                class="loading-text"
            >
                loading file...
            </div>


            <div class="loading-bar">

                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>

            </div>


            <div
                id="loadingPercent"
                class="loading-percent"
            >
                0%
            </div>


        </div>



        <!-- =================================================
             PLAYER
        ================================================== -->

        <div
            id="retroPlayer"
            class="retro-player"
        >


            <!-- VIDEO -->

            <div
                class="player-screen"
                onclick="togglePlay()"
            >


                <video
                    id="videoPlayer"
                    preload="metadata"
                >

                    <source
                        id="videoSource"
                        src=""
                        type="video/mp4"
                    >

                </video>


            </div>



            <!-- CONTROLS -->

            <div class="player-controls">


                <!-- PLAY / PAUSE -->

                <button
                    id="playPauseButton"
                    class="toggle-button"
                    onclick="togglePlay()"
                    title="play / pause"
                >


                    <span
                        id="playIcon"
                        class="play-symbol"
                    ></span>


                    <span
                        id="pauseIcon"
                        class="pause-symbol"
                    >

                        <span></span>
                        <span></span>

                    </span>


                </button>



                <!-- SEEK / FORWARD / REVERSE -->

                <div class="timeline-area">


                    <input
                        id="seekBar"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        title="seek"
                    >


                </div>



                <!-- VOLUME BUTTON -->

                <button
                    id="volumeButton"
                    class="volume-button"
                    onclick="cycleVolume()"
                    title="volume"
                >


                    <span class="speaker-icon">

                        <span class="wave-one"></span>

                        <span class="wave-two"></span>

                    </span>


                    <span
                        id="volumeLight"
                        class="volume-light"
                    ></span>


                </button>


            </div>


        </div>


    </div>


</div>



<script>


let loadingInterval;

let stallTimeout;


/* =========================================================
   VIDEO REFERENCES
========================================================= */

const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const seekBar =
    document.getElementById(
        "seekBar"
    );


const volumeButton =
    document.getElementById(
        "volumeButton"
    );


const volumeLight =
    document.getElementById(
        "volumeLight"
    );



/* =========================================================
   VOLUME LEVEL

   0 = 100%
   1 = 70%
   2 = 35%
   3 = MUTED
========================================================= */

let volumeState =
    0;



/* =========================================================
   OPEN VIDEO
========================================================= */

function openVideo(
    fileName,
    shouldStall
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const retroPlayer =
        document.getElementById(
            "retroPlayer"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );



    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    source.src =
        fileName;


    videoPlayer.load();


    seekBar.value =
        0;


    updatePlayPauseIcon();


    /* DEFAULT VOLUME */

    volumeState =
        0;


    setVolumeState();



    retroPlayer.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "loading file...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    overlay.classList.add(
        "active"
    );


    let value =
        0;


    let hasStalled =
        false;



    loadingInterval =

        setInterval(function() {


            value++;


            progress.style.width =
                value + "%";


            percent.textContent =
                value + "%";



            /* =================================================
               FILE 08 STALL
            ================================================= */

            if (
                shouldStall === true
                &&
                value === 82
                &&
                hasStalled === false
            ) {


                hasStalled =
                    true;


                clearInterval(
                    loadingInterval
                );


                stallTimeout =

                    setTimeout(function() {


                        loadingInterval =

                            setInterval(function() {


                                value++;


                                progress.style.width =
                                    value + "%";


                                percent.textContent =
                                    value + "%";


                                if (
                                    value >= 100
                                ) {


                                    clearInterval(
                                        loadingInterval
                                    );


                                    showVideoPlayer();


                                }


                            }, 20);


                    }, 2000);


                return;


            }



            if (
                value >= 100
            ) {


                clearInterval(
                    loadingInterval
                );


                showVideoPlayer();


            }


        }, 20);


}



/* =========================================================
   SHOW PLAYER
========================================================= */

function showVideoPlayer() {


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const retroPlayer =
        document.getElementById(
            "retroPlayer"
        );


    setTimeout(function() {


        loadingScreen.style.display =
            "none";


        retroPlayer.style.display =
            "block";


        videoPlayer.play();


    }, 100);


}



/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {


    if (
        videoPlayer.paused
    ) {


        videoPlayer.play();


    }


    else {


        videoPlayer.pause();


    }


}



/* =========================================================
   PLAY / PAUSE ICON
========================================================= */

function updatePlayPauseIcon() {


    const playIcon =
        document.getElementById(
            "playIcon"
        );


    const pauseIcon =
        document.getElementById(
            "pauseIcon"
        );


    if (
        videoPlayer.paused
    ) {


        playIcon.style.display =
            "block";


        pauseIcon.style.display =
            "none";


    }


    else {


        playIcon.style.display =
            "none";


        pauseIcon.style.display =
            "flex";


    }


}



/* =========================================================
   PLAYER EVENTS
========================================================= */

videoPlayer.addEventListener(
    "play",
    updatePlayPauseIcon
);


videoPlayer.addEventListener(
    "pause",
    updatePlayPauseIcon
);


videoPlayer.addEventListener(
    "ended",
    updatePlayPauseIcon
);



/* =========================================================
   UPDATE SEEK POSITION
========================================================= */

videoPlayer.addEventListener(
    "timeupdate",
    function() {


        if (
            Number.isFinite(
                videoPlayer.duration
            )
            &&
            videoPlayer.duration > 0
        ) {


            seekBar.value =

                (
                    videoPlayer.currentTime
                    /
                    videoPlayer.duration
                )

                *
                100;


        }


    }
);



/* =========================================================
   SEEK FORWARD / REVERSE
========================================================= */

seekBar.addEventListener(
    "input",
    function() {


        if (
            Number.isFinite(
                videoPlayer.duration
            )
        ) {


            videoPlayer.currentTime =

                (
                    Number(
                        seekBar.value
                    )
                    /
                    100
                )

                *
                videoPlayer.duration;


        }


    }
);



/* =========================================================
   CYCLE VOLUME

   100%
   70%
   35%
   MUTE
   BACK TO 100%
========================================================= */

function cycleVolume() {


    volumeState++;


    if (
        volumeState > 3
    ) {


        volumeState =
            0;


    }


    setVolumeState();


}



/* =========================================================
   APPLY VOLUME STATE
========================================================= */

function setVolumeState() {


    volumeButton.classList.remove(
        "medium",
        "low",
        "muted"
    );



    /* 100% */

    if (
        volumeState === 0
    ) {


        videoPlayer.muted =
            false;


        videoPlayer.volume =
            1;


        volumeLight.style.width =
            "30px";


    }



    /* 70% */

    else if (
        volumeState === 1
    ) {


        videoPlayer.muted =
            false;


        videoPlayer.volume =
            0.7;


        volumeButton.classList.add(
            "medium"
        );


        volumeLight.style.width =
            "22px";


    }



    /* 35% */

    else if (
        volumeState === 2
    ) {


        videoPlayer.muted =
            false;


        videoPlayer.volume =
            0.35;


        volumeButton.classList.add(
            "low"
        );


        volumeLight.style.width =
            "12px";


    }



    /* MUTE */

    else {


        videoPlayer.muted =
            true;


        volumeButton.classList.add(
            "muted"
        );


        volumeLight.style.width =
            "0px";


    }


}



/* =========================================================
   CLOSE VIDEO
========================================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    overlay.classList.remove(
        "active"
    );


}



/* =========================================================
   CLICK OUTSIDE
========================================================= */

function backgroundClose(
    event
) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {


        closeVideo();


    }


}



/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeVideo();


        }


    }
);


</script>
