<!-- VIDEO OPEN / CLOSE -->

<script>

function toggleVideo(id) {

    const videoBox = document.getElementById(id);

    if (videoBox.style.display === "block") {

        videoBox.style.display = "none";

    } else {

        videoBox.style.display = "block";

    }

}

</script>
