<script>


let loadingInterval;

let stallTimeout;



/* =========================================
   VIDEO REFERENCES
========================================= */

const videoPlayer =
    document.getElementById(
        "videoPlayer"
    );


const videoSource =
    document.getElementById(
        "videoSource"
    );



/* =========================================
   UPDATE LOADING STATUS

   0 - 24%
   searching for path...

   25 - 54%
   loading file...

   55 - 84%
   path found...

   85 - 100%
   file ready...
========================================= */

function updateLoadingStatus(
    value,
    loadingText
) {


    if (
        value < 25
    ) {

        loadingText.textContent =
            "searching for path...";

    }


    else if (
        value < 55
    ) {

        loadingText.textContent =
            "loading file...";

    }


    else if (
        value < 85
    ) {

        loadingText.textContent =
            "path found...";

    }


    else {

        loadingText.textContent =
            "file ready...";

    }

}



/* =========================================
   OPEN VIDEO
========================================= */

function openVideo(
    fileName,
    shouldStall
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );



    /* =====================================
       CLEAR OLD LOADING
    ===================================== */

    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );



    /* =====================================
       RESET VIDEO
    ===================================== */

    videoPlayer.pause();


    videoSource.src =
        fileName;


    videoPlayer.load();



    /* =====================================
       RESET DISPLAY
    ===================================== */

    videoContainer.style.display =
        "none";


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "searching for path...";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";



    /* =====================================
       OPEN OVERLAY
    ===================================== */

    overlay.classList.add(
        "active"
    );



    let value =
        0;


    let hasStalled =
        false;



    /* =====================================
       MAIN LOADING LOOP
    ===================================== */

    loadingInterval =

        setInterval(
            function() {


                value++;



                /* UPDATE BAR */

                progress.style.width =
                    value + "%";


                percent.textContent =
                    value + "%";



                /* UPDATE STATUS */

                updateLoadingStatus(
                    value,
                    loadingText
                );



                /* =================================
                   FILE 08 STALL

                   STOPS AT 82%
                   DOES NOT GO BACKWARDS
                ================================= */

                if (
                    shouldStall === true
                    &&
                    value === 82
                    &&
                    hasStalled === false
                ) {


                    hasStalled =
                        true;



                    /* STOP PROGRESS */

                    clearInterval(
                        loadingInterval
                    );



                    /* =================================
                       SHOW BUFFERING DURING STALL
                    ================================= */

                    loadingText.textContent =
                        "buffering...";



                    /* =================================
                       HOLD AT 82% FOR 2 SECONDS
                    ================================= */

                    stallTimeout =

                        setTimeout(
                            function() {



                                /* =========================
                                   RESUME LOADING
                                ========================= */

                                loadingInterval =

                                    setInterval(
                                        function() {


                                            value++;



                                            progress.style.width =
                                                value + "%";


                                            percent.textContent =
                                                value + "%";



                                            /* =================================
                                               BUFFERING IS OVER

                                               RETURN TO NORMAL
                                               STATUS SEQUENCE
                                            ================================= */

                                            updateLoadingStatus(
                                                value,
                                                loadingText
                                            );



                                            /* =================================
                                               FINISHED
                                            ================================= */

                                            if (
                                                value >= 100
                                            ) {


                                                clearInterval(
                                                    loadingInterval
                                                );


                                                /* FORCE FINAL STATE */

                                                progress.style.width =
                                                    "100%";


                                                percent.textContent =
                                                    "100%";


                                                loadingText.textContent =
                                                    "file ready...";


                                                showVideo();


                                            }


                                        },
                                        20
                                    );


                            },
                            2000
                        );



                    return;

                }



                /* =================================
                   NORMAL FILE FINISH
                ================================= */

                if (
                    value >= 100
                ) {


                    clearInterval(
                        loadingInterval
                    );


                    progress.style.width =
                        "100%";


                    percent.textContent =
                        "100%";


                    loadingText.textContent =
                        "file ready...";


                    showVideo();


                }


            },
            20
        );


}



/* =========================================
   SHOW RAW VIDEO
========================================= */

function showVideo() {


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    setTimeout(
        function() {


            loadingScreen.style.display =
                "none";


            videoContainer.style.display =
                "block";



            /* ATTEMPT AUTOPLAY */

            const playAttempt =
                videoPlayer.play();


            if (
                playAttempt !== undefined
            ) {


                playAttempt.catch(
                    function() {

                        /* browser blocked autoplay */

                    }
                );


            }


        },
        100
    );


}



/* =========================================
   CLOSE VIDEO
========================================= */

function closeVideo() {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    clearInterval(
        loadingInterval
    );


    clearTimeout(
        stallTimeout
    );


    videoPlayer.pause();


    videoPlayer.currentTime =
        0;


    overlay.classList.remove(
        "active"
    );


}



/* =========================================
   CLICK OUTSIDE VIDEO
========================================= */

function backgroundClose(
    event
) {


    if (
        event.target.id ===
        "videoOverlay"
    ) {


        closeVideo();


    }


}



/* =========================================
   ESC CLOSE
========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeVideo();


        }


    }
);


</script>
