* {

html,

========================================================= */

<script>

/* =========================================================
   MOUSE CLICK SOUND — USER-SUPPLIED FILE ONLY
   ZERO-DELAY WEB AUDIO VERSION
========================================================= */

const mouseClickSoundFile = "mouse-click-instant.wav";

let mouseClickAudioContext = null;
let mouseClickBuffer = null;

async function preloadMouseClickSound() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            return;
        }

        if (!mouseClickAudioContext) {
            mouseClickAudioContext = new AudioContextClass();
        }

        const response = await fetch(mouseClickSoundFile, { cache: "force-cache" });
        const arrayBuffer = await response.arrayBuffer();
        mouseClickBuffer = await mouseClickAudioContext.decodeAudioData(arrayBuffer);
    } catch (error) {}
}

preloadMouseClickSound();

function playMouseClickSound() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            return;
        }

        if (!mouseClickAudioContext) {
            mouseClickAudioContext = new AudioContextClass();
        }

        const playBuffer = function() {
            if (!mouseClickBuffer) {
                return;
            }

            const source = mouseClickAudioContext.createBufferSource();
            const gain = mouseClickAudioContext.createGain();

            source.buffer = mouseClickBuffer;
            gain.gain.value = 0.55;

            source.connect(gain);
            gain.connect(mouseClickAudioContext.destination);

            source.start(0);
        };

        if (mouseClickAudioContext.state === "suspended") {
            mouseClickAudioContext.resume().then(playBuffer).catch(function() {});
        } else {
            playBuffer();
        }
    } catch (error) {}
}

/* Fire on the initial press, not the later click event. */

document.addEventListener("pointerdown", function(event) {
    const clickable = event.target.closest(
        ".directory-file:not(.empty), button, a, input[type='range'], .qt-progress-hit, video"
    );

    if (clickable) {
        playMouseClickSound();
    }
}, { passive: true });


/* =========================================================
   AUTHORIZATION
========================================================= */

let failedAttempts = 0;

const maxAttempts = 3;

const correctPassword =
    "notmyblood";


const passwordInput =
    document.getElementById(
        "passwordInput"
    );

const fakeCursor =
    document.getElementById(
        "fakeCursor"
    );

const authStatus =
    document.getElementById(
        "authStatus"
    );

const authBox =
    document.getElementById(
        "authBox"
    );

const authOverlay =
    document.getElementById(
        "authOverlay"
    );

const authButton =
    document.getElementById(
        "authButton"
    );

const authLoader =
    document.getElementById(
        "authLoader"
    );


window.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                passwordInput.focus();

                updateCursor();

            },
            100
        );

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === " "
        ) {

            event.preventDefault();

        }

    }
);


passwordInput.addEventListener(
    "input",
    function() {

        passwordInput.value =
            passwordInput.value.replace(
                /\s/g,
                ""
            );

        updateCursor();

    }
);


function updateCursor() {

    const characterWidth =
        11;

    const startPosition =
        13;

    let cursorPosition =
        startPosition +
        (
            passwordInput.value.length *
            characterWidth
        );


    const maximumPosition =
        passwordInput.clientWidth -
        18;


    if (
        cursorPosition >
        maximumPosition
    ) {

        cursorPosition =
            maximumPosition;

    }


    fakeCursor.style.left =
        cursorPosition +
        "px";

}


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            submitPassword();

        }

    }
);


function submitPassword() {

    const enteredPassword =
        passwordInput.value;


    if (
        enteredPassword ===
        correctPassword
    ) {

        passwordInput.disabled =
            true;

        authButton.disabled =
            true;

        fakeCursor.style.display =
            "none";

        authStatus.classList.remove(
            "error"
        );

        authStatus.textContent =
            "";

        authLoader.classList.add(
            "visible"
        );


        setTimeout(
            function() {

                authOverlay.style.display =
                    "none";

            },
            2000
        );

        return;

    }


    failedAttempts++;


    authStatus.textContent =
        "authorization error";

    authStatus.classList.add(
        "error"
    );


    passwordInput.value =
        "";

    updateCursor();

    passwordInput.focus();


    authBox.classList.remove(
        "shake"
    );

    void authBox.offsetWidth;

    authBox.classList.add(
        "shake"
    );


    if (
        failedAttempts >=
        maxAttempts
    ) {

        passwordInput.disabled =
            true;

        authButton.disabled =
            true;

        fakeCursor.style.display =
            "none";


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            700
        );

    }

}

/* =========================================================
   VIDEO SIZING

   NORMAL FILES:
   EXACT SAME FITTING BEHAVIOR AS BEFORE.

   FILE 08:
   TAKES THAT NORMAL DISPLAY SIZE AND DOUBLES IT.
========================================================= */

function fitQuickTimeWindow() {


    if (
        !videoPlayer.videoWidth
        ||
        !videoPlayer.videoHeight
    ) {

        return;

    }


    const naturalWidth =
        videoPlayer.videoWidth;


    const naturalHeight =
        videoPlayer.videoHeight;


    /*
       THESE ARE THE ORIGINAL LIMITS.
       DO NOT CHANGE THESE FOR NORMAL FILES.
    */

    const originalMaxWidth =
        Math.min(
            960,
            window.innerWidth *
            0.90
        );


    const originalMaxVideoHeight =
        Math.max(
            180,
            window.innerHeight -
            135
        );


    /*
       ORIGINAL FIT SCALE.
    */

    const normalScale =
        Math.min(
            1,
            originalMaxWidth /
            naturalWidth,
            originalMaxVideoHeight /
            naturalHeight
        );


    /*
       THIS IS THE EXACT ORIGINAL
       DISPLAYED SIZE.
    */

    let fittedWidth =
        Math.max(
            220,
            Math.round(
                naturalWidth *
                normalScale
            )
        );


    let fittedHeight =
        Math.max(
            124,
            Math.round(
                naturalHeight *
                normalScale
            )
        );


    /*
       ONLY FILE 08 CHANGES SIZE.

       FIRST WE TAKE ITS NORMAL FITTED SIZE,
       THEN DOUBLE IT.
    */

    if (
        currentFileName ===
        "957229577.mp4"
    ) {

        let doubledWidth =
            fittedWidth *
            2;


        let doubledHeight =
            fittedHeight *
            2;


        /*
           KEEP DOUBLED FILE 08 INSIDE SCREEN.
        */

        const fileEightMaxWidth =
            window.innerWidth *
            0.94;


        const fileEightMaxHeight =
            Math.max(
                180,
                window.innerHeight -
                110
            );


        const fileEightScreenScale =
            Math.min(
                1,
                fileEightMaxWidth /
                doubledWidth,
                fileEightMaxHeight /
                doubledHeight
            );


        fittedWidth =
            Math.round(
                doubledWidth *
                fileEightScreenScale
            );


        fittedHeight =
            Math.round(
                doubledHeight *
                fileEightScreenScale
            );

    }


    qtShell.style.width =
        fittedWidth +
        "px";


    /* Keep the video stage locked to the QuickTime shell's inner width.
       The shell has a 1px border on both sides, so assigning the same
       pixel width to both made the stage stick out 2px on the right. */

    qtStage.style.width =
        "100%";


    qtStage.style.height =
        fittedHeight +
        "px";

}

function openVideo(
    fileName,
    loadMode,
    loadSpeed
) {


    const overlay =
        document.getElementById(
            "videoOverlay"
        );


    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );


    const progress =
        document.getElementById(
            "loadingProgress"
        );


    const percent =
        document.getElementById(
            "loadingPercent"
        );


    clearTimeout(
        loadingTimer
    );

    clearTimeout(
        stallTimer
    );

    clearTimeout(
        errorTimer
    );


    currentFileName =
        fileName;


    qtFileName.textContent =
        fileName;


    qtProgressFill.style.width =
        "0%";


    qtPlay.textContent =
        "▶";


    videoPlayer.pause();


    videoPlayer.currentTime =
        0;


    videoContainer.style.display =
        "none";


    corruptOverlay.classList.remove(
        "active"
    );


    if (
        loadMode === "corrupt"
    ) {

        videoSource.src =
            "";

        videoPlayer.load();

    }

    else {

        videoSource.src =
            fileName;

        videoPlayer.load();

    }


    loadingScreen.style.display =
        "flex";


    loadingText.textContent =
        "file found..";


    progress.style.width =
        "0%";


    percent.textContent =
        "0%";


    overlay.classList.add(
        "active"
    );


    let value =
        0;


    let hasStalled =
        false;


    function step() {


        value++;


        progress.style.width =
            value +
            "%";


        percent.textContent =
            value +
            "%";


        updateLoadingText(
            value,
            loadingText
        );


        /*
           FILE 09 STALLS AT 82%
        */

        if (
            loadMode === "stall82"
            &&
            value === 82
            &&
            !hasStalled
        ) {

            hasStalled =
                true;


            stallTimer =
                setTimeout(
                    function() {

                        step();

                    },
                    2000
                );


            return;

        }


        /*
           FILE 12 STALLS AT 30% FOR 4 SECONDS
        */

        if (
            loadMode === "stall30"
            &&
            value === 30
            &&
            !hasStalled
        ) {

            hasStalled =
                true;


            stallTimer =
                setTimeout(
                    function() {

                        step();

                    },
                    4000
                );


            return;

        }


        if (
            value >= 100
        ) {

            progress.style.width =
                "100%";


            percent.textContent =
                "100%";


            loadingText.textContent =
                "opening file..";


            setTimeout(
                function() {

                    if (
                        loadMode === "corrupt"
                    ) {

                        loadingScreen.style.display =
                            "none";


                        videoContainer.style.display =
                            "block";


                        corruptOverlay.classList.add(
                            "active"
                        );

                    }

                    else {

                        loadingScreen.style.display =
                            "none";


                        videoContainer.style.display =
                            "block";


                        qtShell.classList.remove(
                            "player-pop-in"
                        );


                        void qtShell.offsetWidth;


                        qtShell.classList.add(
                            "player-pop-in"
                        );


                        videoPlayer.play().catch(
                            function() {}
                        );

                    }

                },
                90
            );


            return;

        }


        loadingTimer =
            setTimeout(
                step,
                loadSpeed
            );

    }


    loadingTimer =
        setTimeout(
            step,
            loadSpeed
        );

}

        const rect =
            qtProgressHit.getBoundingClientRect();


        const ratio =

                Math.max(

                        rect.left

                    rect.width

            ratio *
            videoPlayer.duration;

    }
);

/* =========================================================
   DRAGGABLE / STACKABLE DESKTOP WINDOWS
========================================================= */

let desktopZIndex = 1;

function getDesktopLayer() {
    return document.getElementById('desktopWindowLayer');
}

function bringDesktopWindowToFront(win) {
    desktopZIndex++;
    win.style.zIndex = desktopZIndex;
}

function resetDesktopWindowPosition(win) {
    if (!win || !document.body.contains(win)) return;

    /*
       Hard-center from the window's REAL rendered size.
       Using pixel coordinates here prevents any previous drag offset,
       transform, animation, or reopened-window drift from accumulating.
    */

    win.style.transform = 'none';

    const rect = win.getBoundingClientRect();
    const left = Math.max(0, Math.round((window.innerWidth - rect.width) / 2));
    const top = Math.max(0, Math.round((window.innerHeight - rect.height) / 2));

    win.style.left = left + 'px';
    win.style.top = top + 'px';
}

function placeDesktopWindow(win) {

    /*
       Start centered immediately, then each window is hard-recentered
       again after its real size/content has loaded.
    */

    win.style.left = '50%';
    win.style.top = '50%';
    win.style.transform = 'translate(-50%, -50%)';

    bringDesktopWindowToFront(win);
}

function makeDesktopWindowDraggable(win, handle, ignoreSelector) {
    if (!win || !handle) return;

    handle.addEventListener('mousedown', function(event) {
        if (event.button !== 0) return;
        if (ignoreSelector && event.target.closest(ignoreSelector)) return;

        event.preventDefault();
        bringDesktopWindowToFront(win);

        const rect = win.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        const offsetY = event.clientY - rect.top;

        win.style.transform = 'none';
        win.style.left = rect.left + 'px';
        win.style.top = rect.top + 'px';

        function move(moveEvent) {
            const currentRect = win.getBoundingClientRect();
            const minLeft = Math.min(0, window.innerWidth - currentRect.width);
            const maxLeft = Math.max(0, window.innerWidth - Math.min(80, currentRect.width));
            const minTop = 0;
            const maxTop = Math.max(0, window.innerHeight - Math.min(34, currentRect.height));

            let nextLeft = moveEvent.clientX - offsetX;
            let nextTop = moveEvent.clientY - offsetY;

            nextLeft = Math.max(minLeft, Math.min(maxLeft, nextLeft));
            nextTop = Math.max(minTop, Math.min(maxTop, nextTop));

            win.style.left = nextLeft + 'px';
            win.style.top = nextTop + 'px';
        }

        function stop() {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', stop);
        }

        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', stop);
    });
}

function fitDesktopQuickTimeWindow(win, shell, stage, player, fileName) {
    if (!player.videoWidth || !player.videoHeight) return;

    const naturalWidth = player.videoWidth;
    const naturalHeight = player.videoHeight;

    const originalMaxWidth = Math.min(960, window.innerWidth * 0.90);
    const originalMaxVideoHeight = Math.max(180, window.innerHeight - 135);

    const normalScale = Math.min(
        1,
        originalMaxWidth / naturalWidth,
        originalMaxVideoHeight / naturalHeight
    );

    let fittedWidth = Math.max(220, Math.round(naturalWidth * normalScale));
    let fittedHeight = Math.max(124, Math.round(naturalHeight * normalScale));

    if (fileName === '957229577.mp4') {
        const doubledWidth = fittedWidth * 2;
        const doubledHeight = fittedHeight * 2;
        const fileEightMaxWidth = window.innerWidth * 0.94;
        const fileEightMaxHeight = Math.max(180, window.innerHeight - 110);

        const screenScale = Math.min(
            1,
            fileEightMaxWidth / doubledWidth,
            fileEightMaxHeight / doubledHeight
        );

        fittedWidth = Math.round(doubledWidth * screenScale);
        fittedHeight = Math.round(doubledHeight * screenScale);
    }

    shell.style.width = fittedWidth + 'px';

    /* Match the stage to the shell's INNER content width.
       Because .qt-shell uses border-box with a 1px border on both sides,
       giving the stage the same raw pixel width makes it protrude 2px on
       the right. 100% uses the shell content box, keeping both edges flush. */

    stage.style.width = '100%';
    stage.style.height = fittedHeight + 'px';
}
    function spawnDesktopVideoWindow(fileName) {
    const layer = getDesktopLayer();
    const win = document.createElement('div');
    win.className = 'desktop-window desktop-video-window';

    win.innerHTML = `
        <div class="qt-shell">
            <div class="qt-titlebar">
                <span class="qt-title-icon"></span>
                <span class="desktop-qt-filename"></span>
                <button class="qt-close" type="button" aria-label="close video"></button>
            </div>
            <div class="qt-stage">
                <video class="desktop-video-element" preload="metadata" playsinline disablepictureinpicture></video>
                <div class="desktop-buffer-overlay" aria-hidden="true">
                    <div class="desktop-buffer-spinner"></div>
                </div>
            </div>
            <div class="qt-controls-wrap">
                <div class="qt-progress-hit" aria-label="seek video">
                    <div class="qt-progress-track">
                        <div class="qt-progress-fill"></div>
                    </div>
                </div>
                <div class="qt-controls">
                    <div class="qt-volume-group">
                        <input class="qt-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="volume">
                    </div>
                    <div class="qt-transport">
                        <button class="qt-btn desktop-back" type="button" aria-label="rewind">◀◀</button>
                        <button class="qt-btn play desktop-play" type="button" aria-label="play pause">▶</button>
                        <button class="qt-btn desktop-forward" type="button" aria-label="fast forward">▶▶</button>
                    </div>
                </div>
            </div>
        </div>`;

    layer.appendChild(win);
    placeDesktopWindow(win);

    const shell = win.querySelector('.qt-shell');
    const titlebar = win.querySelector('.qt-titlebar');
    const closeButton = win.querySelector('.qt-close');
    const fileLabel = win.querySelector('.desktop-qt-filename');
    const stage = win.querySelector('.qt-stage');
    const player = win.querySelector('.desktop-video-element');
    const bufferOverlay = win.querySelector('.desktop-buffer-overlay');
    const progressHit = win.querySelector('.qt-progress-hit');
    const progressFill = win.querySelector('.qt-progress-fill');
    const volume = win.querySelector('.qt-volume');
    const back = win.querySelector('.desktop-back');
    const play = win.querySelector('.desktop-play');
    const forward = win.querySelector('.desktop-forward');

    fileLabel.textContent = fileName;
    makeDesktopWindowDraggable(win, titlebar, '.qt-close');

    win.addEventListener('mousedown', function() {
        bringDesktopWindowToFront(win);
    });

    closeButton.addEventListener('click', function(event) {
        event.stopPropagation();
        player.pause();
        win.remove();
    });

    function togglePlayback() {
        if (player.paused || player.ended) {
            const attempt = player.play();
            if (attempt !== undefined) attempt.catch(function() {});
        } else {
            player.pause();
        }
    }

    play.addEventListener('click', togglePlayback);
    player.addEventListener('click', togglePlayback);

    player.addEventListener('play', function() { play.textContent = '❚❚'; });
    player.addEventListener('pause', function() { play.textContent = '▶'; });
    player.addEventListener('ended', function() { play.textContent = '▶'; });

    back.addEventListener('click', function() {
        player.currentTime = Math.max(0, player.currentTime - 5);
    });

    forward.addEventListener('click', function() {
        const duration = Number.isFinite(player.duration) ? player.duration : player.currentTime + 5;
        player.currentTime = Math.min(duration, player.currentTime + 5);
    });

    volume.addEventListener('input', function() {
        player.volume = Number(volume.value);
    });

    player.addEventListener('timeupdate', function() {
        if (!Number.isFinite(player.duration) || player.duration <= 0) return;
        progressFill.style.width = ((player.currentTime / player.duration) * 100) + '%';
    });

    progressHit.addEventListener('click', function(event) {
        if (!Number.isFinite(player.duration) || player.duration <= 0) return;
        const rect = progressHit.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        player.currentTime = ratio * player.duration;
    });

    player.addEventListener('loadedmetadata', function() {
        fitDesktopQuickTimeWindow(win, shell, stage, player, fileName);

        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                resetDesktopWindowPosition(win);
            });
        });
    });

    window.addEventListener('resize', function resizeDesktopVideo() {
        if (!document.body.contains(win)) {
            window.removeEventListener('resize', resizeDesktopVideo);
            return;
        }
        fitDesktopQuickTimeWindow(win, shell, stage, player, fileName);
    });

    shell.classList.remove('player-pop-in');
    void shell.offsetWidth;
    shell.classList.add('player-pop-in');

    player.src = fileName;
    player.load();
    player.pause();

    /* Only files 01, 05, 09, 10, and 12 use the buffer-during-pop start. */
    const useBufferStart = [
        'purge-xtra2k25.mp4',
        'sp_005.mp4',
        '957229577.mp4',
        'dont_say_a_word (1).mp4',
        'i_lie_k_drugz.mp4'
    ].includes(fileName);

    if (!useBufferStart) {
        bufferOverlay.style.display = 'none';
    }

    let popPlaybackStarted = false;

    function startPlaybackAfterPop() {
        if (popPlaybackStarted || !document.body.contains(win)) return;
        popPlaybackStarted = true;

        /* Recenter one final time at the exact stock position, then play. */
        resetDesktopWindowPosition(win);
        bufferOverlay.style.display = 'none';

        const attempt = player.play();
        if (attempt !== undefined) attempt.catch(function() {});
    }

    if (useBufferStart) {
        shell.addEventListener('animationend', function popInFinished(event) {
            if (event.animationName !== 'playerPopFromBottomLeft') return;
            shell.removeEventListener('animationend', popInFinished);
            startPlaybackAfterPop();
        });

        /* Fallback in case animationend is skipped by the browser. */
        setTimeout(startPlaybackAfterPop, 850);
    } else {
        /* Other videos keep the original behavior: no buffer-start treatment. */
        const attempt = player.play();
        if (attempt !== undefined) attempt.catch(function() {});
    }
}


/* =========================================================
   MESSAGE FILE POP-OUT
========================================================= */

function openMessages(messageSrc = 'messages.html', loadSpeed = 20, messageTitle = 'see-u-l8r-(IM)') {
    const videoOverlay = document.getElementById('videoOverlay');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingText = document.getElementById('loadingText');
    const progress = document.getElementById('loadingProgress');
    const percent = document.getElementById('loadingPercent');

    clearTimeout(loadingTimer);

    videoContainer.style.display = 'none';
    loadingScreen.style.display = 'flex';
    loadingText.textContent = 'file found..';
    progress.style.width = '0%';
    percent.textContent = '0%';
    videoOverlay.classList.add('active');

    let value = 0;

    function step() {
        value++;
        progress.style.width = value + '%';
        percent.textContent = value + '%';
        updateLoadingText(value, loadingText);

        if (value >= 100) {
            progress.style.width = '100%';
            percent.textContent = '100%';
            loadingText.textContent = 'opening file..';

            setTimeout(function() {
                videoOverlay.classList.remove('active');
                loadingScreen.style.display = 'none';
                spawnDesktopMessageWindow(messageSrc, messageTitle);
            }, 90);

            return;
        }

        loadingTimer = setTimeout(step, loadSpeed);
    }

    loadingTimer = setTimeout(step, loadSpeed);
}


function spawnDesktopMessageWindow(messageSrc, messageTitle) {
    const layer = getDesktopLayer();
    const win = document.createElement('div');

    win.className = 'desktop-window desktop-message-window';

    const shell = document.createElement('div');
    shell.className = 'message-pop-shell';

    const frame = document.createElement('iframe');
    frame.className = 'message-frame';
    frame.title = messageTitle;
    frame.allow = 'autoplay';

    shell.appendChild(frame);
    win.appendChild(shell);
    layer.appendChild(win);

    placeDesktopWindow(win);

    win.addEventListener('mousedown', function() {
        bringDesktopWindowToFront(win);
    });

    frame.onload = function() {
        shell.classList.remove('player-pop-in');

        void shell.offsetWidth;

        shell.classList.add('player-pop-in');

        /* Always restore the exact stock centered position on reopen. */
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                resetDesktopWindowPosition(win);
            });
        });

        try {
            const titlebar = frame.contentDocument.querySelector('.titlebar');

            if (titlebar) {
                makeDesktopWindowDraggable(win, titlebar, '.window-buttons');
            }
        } catch (error) {}

        setTimeout(function() {
            resetDesktopWindowPosition(win);

            if (frame.contentWindow) {
                frame.contentWindow.postMessage(
                    {type:'startConversation'},
                    '*'
                );
            }
        }, 760);
    };

    const separator = messageSrc.includes('?') ? '&' : '?';

    frame.src =
        messageSrc +
        separator +
        'imcache=' +
        Date.now();
}


function closeMessages(animated = false) {
    const windows =
        Array.from(
            document.querySelectorAll('.desktop-message-window')
        );

    if (!windows.length) {
        const legacyOverlay =
            document.getElementById('messageOverlay');

        if (legacyOverlay) {
            legacyOverlay.classList.remove('active');
            legacyOverlay.style.display = 'none';
        }

        return;
    }

    const win = windows.reduce(function(top, item) {
        return Number(item.style.zIndex || 0) >
            Number(top.style.zIndex || 0)
            ? item
            : top;
    }, windows[0]);

    if (!animated) {
        win.remove();
        return;
    }

    const shell =
        win.querySelector('.message-pop-shell');

    shell.classList.remove('player-pop-in');
    shell.classList.remove('player-pop-out');

    void shell.offsetWidth;

    shell.classList.add('player-pop-out');

    setTimeout(function() {
        win.remove();
    }, 720);
}


window.addEventListener('message', function(event) {
    if (!(event.data && event.data.type === 'closeMessages')) {
        return;
    }

    const windows =
        document.querySelectorAll('.desktop-message-window');

    for (const win of windows) {
        const frame = win.querySelector('iframe');

        if (
            frame &&
            frame.contentWindow === event.source
        ) {
            win.remove();
            return;
        }
    }

    closeMessages(false);
});


function backgroundCloseMessages(event) {

}


/* Escape closes whichever draggable desktop window is currently on top. */

document.addEventListener('keydown', function(event) {
    if (
        event.key !== 'Escape' ||
        authOverlay.style.display !== 'none'
    ) {
        return;
    }

    const windows =
        Array.from(
            document.querySelectorAll('.desktop-window')
        );

    if (!windows.length) {
        return;
    }

    const top = windows.reduce(function(a, b) {
        return Number(a.style.zIndex || 0) >
            Number(b.style.zIndex || 0)
            ? a
            : b;
    });

    const player =
        top.querySelector('.desktop-video-element');

    if (player) {
        player.pause();
    }

    top.remove();
});
