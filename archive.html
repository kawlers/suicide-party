<!-- FLOATING VIDEO WINDOW -->

<div id="videoOverlay" class="video-overlay" onclick="closeVideoFromBackground(event)">

    <div class="floating-player">

        <button class="close-video" onclick="closeVideo()">×</button>

        <video id="mainVideo" controls preload="metadata">
            <source src="scenebitch-lcut.mp4" type="video/mp4">
            your browser does not support video playback.
        </video>

    </div>

</div>


<style>

.video-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.72);

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 0;

    transition: opacity 0.2s ease;
}

.video-overlay.open {
    display: flex;
    opacity: 1;
}

.floating-player {
    position: relative;

    width: 760px;
    max-width: 82vw;

    transform: translateY(25px) scale(0.97);
    opacity: 0;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}

.video-overlay.open .floating-player {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.floating-player video {
    display: block;

    width: 100%;
    max-height: 75vh;

    background: #000;

    border: 1px solid #333;
}

.close-video {
    position: absolute;

    top: -30px;
    right: 0;

    background: none;
    border: 0;

    color: #aaa;

    font-family: "Courier New", monospace;
    font-size: 24px;

    cursor: pointer;
}

.close-video:hover {
    color: #fff;
}

@media (max-width: 700px) {

    .floating-player {
        width: 92vw;
        max-width: 92vw;
    }

}

</style>


<script>

function openVideo() {

    const overlay = document.getElementById("videoOverlay");

    overlay.style.display = "flex";

    requestAnimationFrame(() => {
        overlay.classList.add("open");
    });

}


function closeVideo() {

    const overlay = document.getElementById("videoOverlay");
    const video = document.getElementById("mainVideo");

    overlay.classList.remove("open");

    video.pause();

    setTimeout(() => {
        overlay.style.display = "none";
    }, 200);

}


function closeVideoFromBackground(event) {

    if (event.target.id === "videoOverlay") {
        closeVideo();
    }

}

</script>
